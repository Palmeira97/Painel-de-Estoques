}
function submitPesagemIndividual(){
  const errWrap = document.getElementById("pi_errorWrap");
  errWrap.innerHTML = "";
  const itens = PRODUCAO_SESSAO.itensIndividuais;
  if (itens.length===0){ errWrap.innerHTML = `<div class="sc-error">${icon("alert",14)} Adicione ao menos um item para pesar.</div>`; return; }
  const observacao = (document.getElementById("pi_obs")?.value || PRODUCAO_SESSAO.observacao || "").trim();
  if (!observacao){ errWrap.innerHTML = `<div class="sc-error">${icon("alert",14)} A observação é obrigatória na pesagem individual.</div>`; return; }

  const materialMap = mapBy(DB.materiais);
  const somaPorMaterialLote = {};
  itens.forEach(it => {
    const chave = it.materialId+"|"+it.lote;
    somaPorMaterialLote[chave] = round3((somaPorMaterialLote[chave]||0)+it.quantidade);
  });
  for (const [chave, soma] of Object.entries(somaPorMaterialLote)){
    const [materialId, lote] = chave.split("|");
    const lotes = getLotesEmEstoque(materialId);
    const loteInfo = lotes.find(l=>l.lote===lote);
    if (!loteInfo || soma > loteInfo.saldo){
      errWrap.innerHTML = `<div class="sc-error">${icon("alert",14)} O lote "${escapeHtml(lote)}" de "${escapeHtml(materialMap[materialId]?.nome||"?")}" não tem mais saldo suficiente.</div>`;
      return;
    }
  }

  openSignature("Assinatura de quem realizou a pesagem individual", (assinaturaOperador) => {
    finalizarPesagemIndividual(observacao, assinaturaOperador);
  });
}
function finalizarPesagemIndividual(observacao, assinaturaOperador){
  const tipoId = garantirTipoPesagemIndividual();
  const dataMov = document.getElementById("pi_data")?.value || PRODUCAO_SESSAO.data || todayISO();
  const documento = (document.getElementById("pi_doc")?.value || PRODUCAO_SESSAO.documento || "").trim();
  const escopoMov = ROOM==="todas" ? [...ALL_ROOM_IDS] : [ROOM];
  const agora = new Date().toISOString();
  const grupoId = uid();
  const materialMap = mapBy(DB.materiais);

  const novosRegistros = PRODUCAO_SESSAO.itensIndividuais.map(it => ({
    id: uid(), producaoId: grupoId, misturaFinaId: null,
    data: dataMov, materialId: it.materialId, tipoMovimentoId: tipoId,
    setorId: "", quantidade: it.quantidade, delta: -it.quantidade,
    lote: it.lote, validade: it.validade||"", documento, observacao,
    escopo: escopoMov, colaboradorId: "",
    assinaturaOperador, assinadoEmOperador: agora,
    assinatura: null, assinadoEm: null,
    criadoEm: agora,
  }));

  DB.movimentos = [...novosRegistros, ...DB.movimentos];
  const deltaPorMaterial = {};
  novosRegistros.forEach(r => { deltaPorMaterial[r.materialId] = round3((deltaPorMaterial[r.materialId]||0) + r.delta); });
  DB.materiais = DB.materiais.map(m => deltaPorMaterial[m.id] ? {...m, estoqueAtual: round3((m.estoqueAtual||0)+deltaPorMaterial[m.id])} : m);
  persist("materiais");
  persist("movimentos");

  if (confirm("Pesagem individual registrada. Deseja imprimir etiquetas de pesagem para os itens pesados?")){
    const itensEtiqueta = novosRegistros.map(r => {
      const material = materialMap[r.materialId];
      return {
        materialNome: material?.nome||"—", materialCodigo: material?.codigo||"",
        loteIngrediente: r.lote||"", misturaCodigo: "", misturaLote: documento||"Pesagem Individual",
        data: fmtDate(dataMov), peso: r.quantidade, unidade: material?.unidade||"",
      };
    });
    perguntarViasEImprimir(itensEtiqueta);
  }

  PRODUCAO_SESSAO = criarSessaoProducaoVazia();
  PESANDO_MATERIAL_ID = null;
  VIEW = "rel_movimentacoes";
  render();
}

function listaTecnicaPesagemHTML(){

function pesagemFormHTML(materialId, alvo, material){
  const confirmado = !!PRODUCAO_SESSAO.confirmados?.[materialId];
  if (material?.codigoBarras && !confirmado){
    return `
      <div style="border-top:1px dashed var(--line); padding-top:10px;">
        <div class="sc-hint">Escaneie o código de barras do material para confirmar que é o item correto antes de pesar.</div>

        </div>
        <div id="confirmacao_erro_${materialId}"></div>
      </div>`;
  }
  const alocacoes = PRODUCAO_SESSAO.pesagens[materialId] || [];
  const lotes = getLotesEmEstoque(materialId);
  const jaAlocadoPorLote = {};
  alocacoes.forEach(a => { jaAlocadoPorLote[a.lote] = round3((jaAlocadoPorLote[a.lote]||0) + a.quantidade); });
  const loteEmEdicao = PRODUCAO_SESSAO.loteEmEdicao?.[materialId] || "";

  const resumoAlocacoes = alocacoes.length>0 ? `
    <div style="display:flex; flex-direction:column; gap:4px; width:100%;">
      ${alocacoes.map((a,i) => `
        <div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 10px;">
          <span class="sc-hint" style="margin:0;">Lote ${escapeHtml(a.lote||"—")}: ${fmtNum(a.quantidade)} ${escapeHtml(material?.unidade||"")}</span>
          <span style="display:flex; gap:4px;">
            <button class="sc-iconbtn" title="Imprimir etiqueta desta pesagem" onclick="imprimirEtiquetaAlocacao('${materialId}', ${i})">${icon("download",12)}</button>
            <button class="sc-iconbtn" title="Remover" onclick="removerAlocacaoPesagem('${materialId}', ${i})">${icon("x",12)}</button>
          </span>
        </div>`).join("")}
    </div>` : "";

  const totalPesado = round3(alocacoes.reduce((acc,a)=>acc+a.quantidade,0));
  const faltamParaAlvo = round3(Math.max(0, alvo-totalPesado));

  const loteItens = lotes.map(l=>{
    const disponivel = round3(l.saldo - (jaAlocadoPorLote[l.lote]||0));
    return { value:l.lote, label:`${l.lote||"(sem lote)"} — disponível ${fmtNum(disponivel)}${l.validade?` — val. ${fmtDate(l.validade)}`:""}` };
  });

  return `
    <div style="display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; border-top:1px dashed var(--line); padding-top:10px;">
      ${material?.codigoBarras ? `<div class="sc-hint" style="width:100%; margin:0 0 2px;">${icon("check",12)} Material confirmado por código de barras.</div>` : `<div class="sc-hint" style="width:100%; margin:0 0 2px;">${icon("alert",12)} Este material não tem código de barras cadastrado — confirmação por leitura não disponível.</div>`}

      <label class="sc-field"><span>Peso pesado neste lote</span><input class="sc-input" type="number" min="0" step="0.001" id="pesar_qtd_${materialId}" placeholder="${totalPesado>0?`Faltam p/ alvo: ${fmtNum(faltamParaAlvo)}`:`Alvo: ${fmtNum(alvo)}`}" value="" ${loteEmEdicao?"":"disabled"}></label>
      <button class="sc-btn sc-btn-ghost" ${loteEmEdicao?"":"disabled"} onclick="adicionarAlocacaoPesagem('${materialId}')">${icon("plus",13)}<span>Adicionar lote</span></button>
      <div id="pesar_erro_${materialId}" style="width:100%;"></div>
      <div style="display:flex; gap:8px; width:100%;">
        <button class="sc-btn sc-btn-primary" ${alocacoes.length===0?"disabled":""} onclick="concluirPesagemItem('${materialId}')">${icon("check",13)}<span>Concluir pesagem deste item</span></button>
        <button class="sc-btn sc-btn-ghost" onclick="cancelarPesagem()">Cancelar</button>
      </div>
    </div>`;
}

function adicionarAlocacaoPesagem(materialId){
  const errBox = document.getElementById(`pesar_erro_${materialId}`);
  const lote = PRODUCAO_SESSAO.loteEmEdicao?.[materialId] || "";
  const qtd = Number(document.getElementById(`pesar_qtd_${materialId}`).value);
  if (!lote){ errBox.innerHTML = `<div class="sc-error">${icon("alert",14)} Selecione o lote antes de informar o peso.</div>`; return; }
  if (!qtd || qtd<=0){ errBox.innerHTML = `<div class="sc-error">${icon("alert",14)} Informe um peso maior que zero.</div>`; return; }
  const lotes = getLotesEmEstoque(materialId);
  const loteInfo = lotes.find(l=>l.lote===lote);
  const alocacoesAtuais = PRODUCAO_SESSAO.pesagens[materialId] || [];
  const jaAlocado = round3(alocacoesAtuais.filter(a=>a.lote===lote).reduce((acc,a)=>acc+a.quantidade,0));
  const disponivel = loteInfo ? round3(loteInfo.saldo - jaAlocado) : 0;
  if (!loteInfo || qtd > disponivel){
    errBox.innerHTML = `<div class="sc-error">${icon("alert",14)} O lote "${escapeHtml(lote)}" só tem ${fmtNum(disponivel)} disponível. Ajuste o peso ou adicione outro lote depois.</div>`;
    return;
  }
  if (!PRODUCAO_SESSAO.pesagens[materialId]) PRODUCAO_SESSAO.pesagens[materialId] = [];
  PRODUCAO_SESSAO.pesagens[materialId].push({ quantidade: qtd, lote, validade: loteInfo.validade||"" });
  if (PRODUCAO_SESSAO.loteEmEdicao) delete PRODUCAO_SESSAO.loteEmEdicao[materialId];
  renderMain();

    loteIngrediente: pesagem.lote||"", misturaCodigo: mf?.codigo||"", misturaLote: loteProduzido,

function concluirPesagemItem(materialId){
  const mf = DB.misturasFinas.find(m=>m.id===PRODUCAO_SESSAO.misturaFinaId);
  const ing = mf?.ingredientes.find(i=>i.materialId===materialId);
  const quantidadeAlvoTotal = Number(PRODUCAO_SESSAO.quantidadeAlvo) || 0;
  const alvo = ing ? round3(ing.percentual/100 * quantidadeAlvoTotal) : 0;
  const alocacoes = PRODUCAO_SESSAO.pesagens[materialId] || [];
  const totalPesado = round3(alocacoes.reduce((acc,a)=>acc+a.quantidade,0));
  const material = DB.materiais.find(m=>m.id===materialId);

  const resultado = validarErroPesagem(totalPesado, alvo, material?.unidade);
  if (resultado.bloqueado){
    alert(resultado.mensagem);
    return;
  }

  PESANDO_MATERIAL_ID = null;
  renderMain();
}

function submitProducao(){
  const errWrap = document.getElementById("pr_errorWrap");
  errWrap.innerHTML = "";
  const mf = DB.misturasFinas.find(m=>m.id===PRODUCAO_SESSAO.misturaFinaId);
  if (!mf){ errWrap.innerHTML = `<div class="sc-error">${icon("alert",14)} Selecione a mistura fina.</div>`; return; }
  const pesadosIds = Object.keys(PRODUCAO_SESSAO.pesagens);
  if (pesadosIds.length===0){ errWrap.innerHTML = `<div class="sc-error">${icon("alert",14)} Pese ao menos um item antes de registrar.</div>`; return; }
  const todosPesados = mf.ingredientes.every(ing => (PRODUCAO_SESSAO.pesagens[ing.materialId]||[]).length>0);
  const loteProduzido = (document.getElementById("pr_lote")?.value || PRODUCAO_SESSAO.lote || "").trim();
  if (!loteProduzido){ errWrap.innerHTML = `<div class="sc-error">${icon("alert",14)} Informe o lote produzido.</div>`; return; }

  const materialMap = mapBy(DB.materiais);
  for (const materialId of pesadosIds){
    const alocacoes = PRODUCAO_SESSAO.pesagens[materialId];
    const lotes = getLotesEmEstoque(materialId);
    const somaPorLote = {};
    alocacoes.forEach(a => { somaPorLote[a.lote] = round3((somaPorLote[a.lote]||0) + a.quantidade); });
    for (const [lote, soma] of Object.entries(somaPorLote)){
      const loteInfo = lotes.find(l=>l.lote===lote);
      if (!loteInfo || soma > loteInfo.saldo){
        errWrap.innerHTML = `<div class="sc-error">${icon("alert",14)} O lote "${escapeHtml(lote)}" de "${escapeHtml(materialMap[materialId]?.nome||"?")}" não tem mais saldo suficiente. Repese este item.</div>`;
        return;
      }
    }
  }

  if (!todosPesados){
    const faltando = mf.ingredientes.filter(ing => !(PRODUCAO_SESSAO.pesagens[ing.materialId]||[]).length).map(ing => materialMap[ing.materialId]?.nome||"?").join(", ");
    const prosseguir = confirm(`Nem todos os itens da lista técnica foram pesados (faltam: ${faltando}). Clique em OK para registrar assim mesmo — o lote ficará marcado como pendente. Clique em Cancelar para continuar pesando.`);
    if (!prosseguir) return;
  }

  // exige a assinatura de quem realizou a pesagem/produção antes de concluir o registro
  openSignature(`Assinatura de quem realizou a pesagem/produção — ${escapeHtml(mf.nome)}`, (assinaturaOperador) => {
    finalizarRegistroProducao(mf, loteProduzido, assinaturaOperador, !todosPesados);
  });
}
function finalizarRegistroProducao(mf, loteProduzido, assinaturaOperador, pendenteMateriais){
  const tipoEntradaId = garantirTipoProducaoEntrada();
  const tipoConsumoId = garantirTipoProducaoConsumo();
  const tipoEnvioId = garantirTipoProducaoEnvio();
  const dataMov = document.getElementById("pr_data")?.value || PRODUCAO_SESSAO.data || todayISO();
  const documento = (document.getElementById("pr_doc")?.value || PRODUCAO_SESSAO.documento || "").trim();
  const observacao = (document.getElementById("pr_obs")?.value || PRODUCAO_SESSAO.observacao || "").trim();
  const validadeProduzido = document.getElementById("pr_validade")?.value || PRODUCAO_SESSAO.validade || "";
  const escopoMov = ROOM==="todas" ? [...ALL_ROOM_IDS] : [ROOM];
  const producaoId = uid();
  const setorProducao = DB.setores.find(s=>s.id===mf.setorId);
  const agora = new Date().toISOString();
  const materialMap = mapBy(DB.materiais);
  const ingredientesFaltantes = mf.ingredientes.filter(ing => !(PRODUCAO_SESSAO.pesagens[ing.materialId]||[]).length).map(ing => materialMap[ing.materialId]?.nome || ing.materialId);
  const quantidadeProduzida = round3(Object.values(PRODUCAO_SESSAO.pesagens).reduce((acc, alocacoes) => acc + alocacoes.reduce((a2,al)=>a2+al.quantidade,0), 0));

  const novosRegistros = [];
  novosRegistros.push({
    id: uid(), producaoId, misturaFinaId: mf.id,
    data: dataMov, materialId: mf.materialProduzidoId, tipoMovimentoId: tipoEntradaId,
    setorId: setorProducao?.id || "", quantidade: quantidadeProduzida, delta: quantidadeProduzida,
    lote: loteProduzido, validade: validadeProduzido, documento, observacao,
    escopo: escopoMov, colaboradorId: "",
    assinaturaOperador, assinadoEmOperador: agora,
    assinatura: null, assinadoEm: null,
    pendenteMateriais: !!pendenteMateriais, ingredientesFaltantes,
    criadoEm: agora,
  });
  // envio imediato ao setor: o semiacabado não fica em estoque, sai assim que é produzido
  novosRegistros.push({
    id: uid(), producaoId, misturaFinaId: mf.id,
    data: dataMov, materialId: mf.materialProduzidoId, tipoMovimentoId: tipoEnvioId,
    setorId: setorProducao?.id || "", quantidade: quantidadeProduzida, delta: -quantidadeProduzida,
    lote: loteProduzido, validade: validadeProduzido, documento, observacao: observacao || "Envio automático ao setor logo após a produção.",
    escopo: escopoMov, colaboradorId: "",
    assinaturaOperador: null, assinadoEmOperador: null,
    assinatura: null, assinadoEm: null,
    criadoEm: agora,
  });
  mf.ingredientes.forEach(ing => {
    const alocacoes = PRODUCAO_SESSAO.pesagens[ing.materialId];
    if (!alocacoes) return;
    alocacoes.forEach(pesagem => {
      novosRegistros.push({
        id: uid(), producaoId, misturaFinaId: mf.id,
        data: dataMov, materialId: ing.materialId, tipoMovimentoId: tipoConsumoId,
        setorId: setorProducao?.id || "", quantidade: pesagem.quantidade, delta: -pesagem.quantidade,
        lote: pesagem.lote, validade: pesagem.validade||"", documento, observacao,
        escopo: escopoMov, colaboradorId: "",
        assinaturaOperador: null, assinadoEmOperador: null,
        assinatura: null, assinadoEm: null,
        criadoEm: agora,
      });
    });
  });

  DB.movimentos = [...novosRegistros, ...DB.movimentos];
  const deltaPorMaterial = {};
  novosRegistros.forEach(r => { deltaPorMaterial[r.materialId] = round3((deltaPorMaterial[r.materialId]||0) + r.delta); });
  DB.materiais = DB.materiais.map(m => deltaPorMaterial[m.id] ? {...m, estoqueAtual: round3((m.estoqueAtual||0)+deltaPorMaterial[m.id])} : m);
  persist("materiais");
  persist("movimentos");

  if (confirm("Produção registrada. Deseja imprimir etiquetas de pesagem para este lote?")){
    const itensEtiqueta = [];
    mf.ingredientes.forEach(ing => {
      const alocacoes = PRODUCAO_SESSAO.pesagens[ing.materialId];
      if (!alocacoes) return;
      const material = materialMap[ing.materialId];
      alocacoes.forEach(pesagem => {
        itensEtiqueta.push({
          materialNome: material?.nome||"—", materialCodigo: material?.codigo||"",
          loteIngrediente: pesagem.lote||"", misturaCodigo: mf.codigo||"", misturaLote: loteProduzido,
          data: fmtDate(dataMov), peso: pesagem.quantidade, unidade: material?.unidade||"",
        });
      });
    });
    perguntarViasEImprimir(itensEtiqueta);
  }

  PRODUCAO_SESSAO = criarSessaoProducaoVazia();
  PESANDO_MATERIAL_ID = null;
  SELECTED_MISTURA_ID = mf.id;
  VIEW = "itens_produzidos";
  render();
}

  const cmpLotes = {

      <label class="sc-field"><span>Até</span><input class="sc-input" type="date" id="pi_rel_ate" value="${PI_FILTRO_ATE}" onchange="onPiFiltroChange()"></label>
      <div class="sc-search is-wide">${icon("search")}<input id="pi_rel_busca" oninput="onPiBuscaInput()" placeholder="Buscar por documento ou observação…"></div>
    </div>`;
  const acaoExportar = `<button class="sc-btn sc-btn-ghost" onclick="exportPesagensIndividuaisExcel()">${icon("download",14)}<span>Exportar Excel</span></button>`;

  if (itens.length===0){
    return pageHTML("Itens Produzidos", subtitle, acaoExportar, `${toggleModo}${filtroHTML}
      ${emptyHTML('Nenhuma pesagem individual encontrada para os filtros selecionados. Registre uma em "Produção", no modo Pesagem Individual.')}`);
  }

  const busca = (document.getElementById("pi_rel_busca")?.value || "").toLowerCase();
  const grupos = {};
  itens.forEach(m => { (grupos[m.producaoId] ||= []).push(m); });
  let gruposIds = Object.keys(grupos).filter(gid => {
    if (!busca) return true;
    const algum = grupos[gid][0];
    return `${algum.documento||""} ${algum.observacao||""}`.toLowerCase().includes(busca);
  });
  gruposIds.sort((a,b) => String(grupos[b][0].data||"").localeCompare(String(grupos[a][0].data||"")));

  const linhas = gruposIds.map(gid => {
    const grupo = grupos[gid];
    const primeiro = grupo[0];
    const expandido = PI_EXPANDIDO.has(gid);
    const totalItens = grupo.length;
    const linha = `<tr class="sc-rowclick" onclick="togglePesagemIndividualDetalhe('${gid}')">
      <td class="sc-expandcell">${icon(expandido?"chevronDown":"chevronRight",13)}</td>
      <td class="mono">${fmtDate(primeiro.data)}</td>
      <td class="mono">${escapeHtml(primeiro.documento||"—")}</td>
      <td>${escapeHtml(primeiro.observacao||"—")}</td>
      <td class="num mono">${totalItens}</td>
      <td>${primeiro.assinaturaOperador ? `<img src="${primeiro.assinaturaOperador}" alt="assinatura" style="height:22px; border:1px solid var(--line); border-radius:4px; background:#fff;">` : "—"}</td>
    </tr>`;
    const detalhe = expandido ? `<tr class="sc-rowdetail"><td colspan="6">
      <table class="sc-table sc-subtable">
        <thead><tr><th>Material</th><th class="num">Peso pesado</th><th>Lote</th><th></th></tr></thead>
        <tbody>${grupo.map(it => `
          <tr><td>${escapeHtml(materialMap[it.materialId]?.nome||"—")}</td>
          <td class="num mono">${fmtNum(it.quantidade)} ${escapeHtml(materialMap[it.materialId]?.unidade||"")}</td>
          <td class="mono">${escapeHtml(it.lote||"—")}</td>
          <td class="rowActions"><button class="sc-iconbtn" title="Imprimir etiqueta deste item" onclick="event.stopPropagation();imprimirEtiquetaMovimentoIndividual('${it.id}')">${icon("download",13)}</button></td>
          </tr>`).join("")}</tbody>
      </table>
      <div style="margin-top:10px;">
        <button class="sc-btn sc-btn-ghost" onclick="event.stopPropagation();imprimirEtiquetasGrupoIndividual('${gid}')">${icon("download",13)}<span>Imprimir Etiquetas de Pesagem</span></button>
      </div>
    </td></tr>` : "";
    return linha + detalhe;
  }).join("");

  const tabelaHTML = `<table class="sc-table">
    <thead><tr><th></th><th>Data</th><th>Documento</th><th>Observação</th><th class="num">Itens</th><th>Pesado por</th></tr></thead>
    <tbody>${linhas}</tbody></table>`;

  return pageHTML("Itens Produzidos", subtitle, acaoExportar, `
    ${toggleModo}
    ${filtroHTML}
    ${sectionHTML("Pesagens individuais registradas","edit","", `<div class="sc-tablewrap">${tabelaHTML}</div>`)}
  `);
}

function gerarRelatorioProducaoExcel(){

  let producoes = DB.movimentos.filter(m => inRoom(m, ROOM) && tipoMap[m.tipoMovimentoId]?.especial==="producao_entrada" && m.misturaFinaId && !m.anulado

function assinarLoteProduzido(movId){
  const mov = DB.movimentos.find(m=>m.id===movId);
  if (!mov) return;
  const mistura = DB.misturasFinas.find(m=>m.id===mov.misturaFinaId);
  const setor = DB.setores.find(s=>s.id===mistura?.setorId);
  const responsavel = DB.colaboradores.find(c=>c.id===setor?.responsavelId);
  if (!responsavel){ alert("Este setor não tem um colaborador responsável cadastrado. Configure em Cadastros → Setores antes de aprovar."); return; }
  openSignature(`Aprovação de ${responsavel.nome} (responsável por ${setor.nome}) — Lote ${mov.lote||""}`, (dataUrl) => {
    const agora = new Date().toISOString();
    DB.movimentos = DB.movimentos.map(m => m.id===movId ? { ...m, assinatura: dataUrl, assinadoEm: agora } : m);
    persist("movimentos");
    render();
  });
}
function assinarTodosLotesProduzidos(misturaFinaId){
  const tipoMap = mapBy(DB.tipos);
  const pendentes = DB.movimentos.filter(m => m.misturaFinaId===misturaFinaId && tipoMap[m.tipoMovimentoId]?.especial==="producao_entrada" && !m.assinatura && !m.anulado);
  if (pendentes.length===0){ alert("Não há lotes pendentes para aprovar."); return; }
  const mistura = DB.misturasFinas.find(m=>m.id===misturaFinaId);
  const setor = DB.setores.find(s=>s.id===mistura?.setorId);
  const responsavel = DB.colaboradores.find(c=>c.id===setor?.responsavelId);
  if (!responsavel){ alert("Este setor não tem um colaborador responsável cadastrado. Configure em Cadastros → Setores antes de aprovar."); return; }
  const pendentesIds = new Set(pendentes.map(m=>m.id));
  openSignature(`Aprovação de ${responsavel.nome} (responsável por ${setor.nome}) — ${pendentes.length} lote(s)`, (dataUrl) => {
    const agora = new Date().toISOString();
    DB.movimentos = DB.movimentos.map(m => pendentesIds.has(m.id) ? { ...m, assinatura: dataUrl, assinadoEm: agora } : m);
    persist("movimentos");
    render();
  });
}

/* ------------------------------- completar pesagem pendente de um lote já registrado ------------------------------- */
function abrirCompletarPendencia(prodId){
  const prod = DB.movimentos.find(m=>m.id===prodId);
  if (!prod) return;
  ITENS_PRODUZIDOS_COMPLETANDO = prodId;
  COMPLETAR_PENDENCIA = { producaoId: prod.producaoId, pesagens:{}, confirmados:{}, materialEmPesagem:null, loteEmEdicao:{} };
  renderMain();
}
function fecharCompletarPendencia(){
  ITENS_PRODUZIDOS_COMPLETANDO = null;
  COMPLETAR_PENDENCIA = null;
  renderMain();
}
function completarPendenciaHTML(prod){
  const tipoMap = mapBy(DB.tipos), materialMap = mapBy(DB.materiais);
  const mf = DB.misturasFinas.find(m=>m.id===prod.misturaFinaId);
  if (!mf) return `<div class="sc-hint sc-hint-alert">Mistura fina não encontrada — não é possível completar.</div>`;
  const consumosExistentes = DB.movimentos.filter(m=>m.producaoId===prod.producaoId && tipoMap[m.tipoMovimentoId]?.especial==="producao_consumo" && !m.anulado);
  const faltantes = mf.ingredientes.filter(ing => !consumosExistentes.some(c=>c.materialId===ing.materialId));
  if (faltantes.length===0){
    return `<div class="sc-hint" style="margin-top:10px;">Todos os ingredientes já foram pesados para este lote.</div>`;
  }
  const quantidadeAlvoInferida = inferirQuantidadeAlvoOriginal(mf, prod);
  const linhas = faltantes.map(ing => {
    const material = materialMap[ing.materialId];
    const alvo = quantidadeAlvoInferida ? round3(ing.percentual/100 * quantidadeAlvoInferida) : null;
    const alocacoes = COMPLETAR_PENDENCIA?.pesagens?.[ing.materialId] || [];
    const pesando = COMPLETAR_PENDENCIA?.materialEmPesagem === ing.materialId;
    let acaoHTML;
    if (alocacoes.length>0){
      const total = round3(alocacoes.reduce((acc,a)=>acc+a.quantidade,0));
      const lotesTexto = alocacoes.map(a=>`${a.lote||"—"} (${fmtNum(a.quantidade)})`).join(", ");
      acaoHTML = `<span class="sc-tag tag-entrada">${icon("check",11)} Pesado: ${fmtNum(total)} ${escapeHtml(material?.unidade||"")} · ${escapeHtml(lotesTexto)}</span>`;
    } else if (pesando){
      acaoHTML = "";
    } else {
      acaoHTML = `<button class="sc-btn sc-btn-ghost" onclick="event.stopPropagation();abrirPesagemPendencia('${ing.materialId}')">${icon("edit",13)}<span>Pesar</span></button>`;
    }
    const form = pesando ? pesagemPendenciaFormHTML(ing.materialId, material) : "";
    return `<div class="sc-formpanel is-plain" style="margin-bottom:8px;">
      <div class="sc-formpanelBody" style="gap:6px;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
          <div style="font-weight:700; color:var(--navy);">${escapeHtml(material?.nome||"—")} <span style="font-weight:400; color:var(--ink-faint); font-size:11.5px;">(${fmtNum(ing.percentual)}% da receita${alvo!==null?` — alvo: ${fmtNum(alvo)} ${escapeHtml(material?.unidade||"")}`:""})</span></div>
          <div>${acaoHTML}</div>
        </div>
        ${form}
      </div>
    </div>`;
  }).join("");
  const algumPesado = Object.keys(COMPLETAR_PENDENCIA?.pesagens||{}).length>0;
  return `<div style="border-top:1px dashed var(--line); padding-top:10px; margin-top:10px;">
    <div class="sc-hint">Pese os ingredientes que ficaram faltando neste lote. O peso é somado ao total já produzido.</div>
    ${linhas}
    <div id="completar_erro"></div>
    <div style="display:flex; gap:8px; margin-top:8px;">
      <button class="sc-btn sc-btn-primary" ${algumPesado?"":"disabled"} onclick="event.stopPropagation();registrarPesagensPendentes('${prod.id}')">${icon("check",13)}<span>Registrar pesagens pendentes</span></button>
      <button class="sc-btn sc-btn-ghost" onclick="event.stopPropagation();fecharCompletarPendencia()">Cancelar</button>
    </div>
  </div>`;
}
function pesagemPendenciaFormHTML(materialId, material){
  const confirmado = !!COMPLETAR_PENDENCIA.confirmados?.[materialId];
  if (material?.codigoBarras && !confirmado){
    return `
      <div style="border-top:1px dashed var(--line); padding-top:8px;">
        <div class="sc-hint">Escaneie o código de barras do material para confirmar que é o item correto.</div>
        <div style="display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;">
          <button class="sc-btn sc-btn-primary" onclick="event.stopPropagation();escanearConfirmacaoPendencia('${materialId}')">${icon("camera",13)}<span>Escanear código de barras</span></button>
          <button class="sc-btn sc-btn-ghost" onclick="event.stopPropagation();cancelarPesagemPendencia()">Cancelar</button>
        </div>
        <div id="confirmacao_pend_erro_${materialId}"></div>
      </div>`;
  }
  const alocacoes = COMPLETAR_PENDENCIA.pesagens[materialId] || [];
  const lotes = getLotesEmEstoque(materialId);
  const jaAlocadoPorLote = {};
  alocacoes.forEach(a => { jaAlocadoPorLote[a.lote] = round3((jaAlocadoPorLote[a.lote]||0) + a.quantidade); });
  const loteEmEdicao = COMPLETAR_PENDENCIA.loteEmEdicao?.[materialId] || "";

  const resumoAlocacoes = alocacoes.length>0 ? `
    <div style="display:flex; flex-direction:column; gap:4px; width:100%;">
      ${alocacoes.map((a,i) => `
        <div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 10px;">
          <span class="sc-hint" style="margin:0;">Lote ${escapeHtml(a.lote||"—")}: ${fmtNum(a.quantidade)} ${escapeHtml(material?.unidade||"")}</span>
          <span style="display:flex; gap:4px;">
            <button class="sc-iconbtn" title="Imprimir etiqueta desta pesagem" onclick="event.stopPropagation();imprimirEtiquetaAlocacaoPendencia('${materialId}', ${i})">${icon("download",12)}</button>
            <button class="sc-iconbtn" title="Remover" onclick="event.stopPropagation();removerAlocacaoPesagemPendencia('${materialId}', ${i})">${icon("x",12)}</button>
          </span>
        </div>`).join("")}
    </div>` : "";

  const loteItens = lotes.map(l=>{
    const disponivel = round3(l.saldo - (jaAlocadoPorLote[l.lote]||0));
    return { value:l.lote, label:`${l.lote||"(sem lote)"} — disponível ${fmtNum(disponivel)}${l.validade?` — val. ${fmtDate(l.validade)}`:""}` };
  });
  return `
    <div style="display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; border-top:1px dashed var(--line); padding-top:8px;">
      ${material?.codigoBarras ? `<div class="sc-hint" style="width:100%; margin:0 0 2px;">${icon("check",12)} Material confirmado por código de barras.</div>` : `<div class="sc-hint" style="width:100%; margin:0 0 2px;">${icon("alert",12)} Este material não tem código de barras cadastrado.</div>`}
      ${resumoAlocacoes}
      <label class="sc-field is-wide"><span>Lote do material <span style="color:var(--danger);">*</span></span>${comboHTML(`pesarpend_lote_${materialId}`, loteItens, loteEmEdicao, {placeholder:"Digite para buscar o lote…", onChange:(v)=>onLotePesagemPendenciaChange(materialId, v)})}</label>
      <label class="sc-field"><span>Peso pesado neste lote</span><input class="sc-input" type="number" min="0" step="0.001" id="pesarpend_qtd_${materialId}" value="" ${loteEmEdicao?"":"disabled"}></label>
      <button class="sc-btn sc-btn-ghost" ${loteEmEdicao?"":"disabled"} onclick="event.stopPropagation();adicionarAlocacaoPesagemPendencia('${materialId}')">${icon("plus",13)}<span>Adicionar lote</span></button>
      <div id="pesarpend_erro_${materialId}" style="width:100%;"></div>
      <button class="sc-btn sc-btn-ghost" onclick="event.stopPropagation();cancelarPesagemPendencia()">Cancelar</button>
    </div>`;
}
function abrirPesagemPendencia(materialId){ COMPLETAR_PENDENCIA.materialEmPesagem = materialId; renderMain(); }
function cancelarPesagemPendencia(){ COMPLETAR_PENDENCIA.materialEmPesagem = null; renderMain(); }
function onLotePesagemPendenciaChange(materialId, value){
  if (!COMPLETAR_PENDENCIA.loteEmEdicao) COMPLETAR_PENDENCIA.loteEmEdicao = {};
  COMPLETAR_PENDENCIA.loteEmEdicao[materialId] = value;
  renderMain();
}
function escanearConfirmacaoPendencia(materialId){
  openScanner((text) => {
    const material = DB.materiais.find(m=>m.id===materialId);
    const codeLower = (text||"").trim().toLowerCase();
    if (material && (material.codigoBarras||"").trim().toLowerCase() === codeLower){
      if (!COMPLETAR_PENDENCIA.confirmados) COMPLETAR_PENDENCIA.confirmados = {};
      COMPLETAR_PENDENCIA.confirmados[materialId] = true;
      renderMain();
    } else {
      renderMain();
      const errBox = document.getElementById(`confirmacao_pend_erro_${materialId}`);
      if (errBox) errBox.innerHTML = `<div class="sc-error">${icon("alert",14)} Código escaneado não corresponde a "${escapeHtml(material?.nome||"?")}".</div>`;
    }
  });
}
function adicionarAlocacaoPesagemPendencia(materialId){
  const errBox = document.getElementById(`pesarpend_erro_${materialId}`);
  const lote = COMPLETAR_PENDENCIA.loteEmEdicao?.[materialId] || "";
  const qtd = Number(document.getElementById(`pesarpend_qtd_${materialId}`).value);
  if (!lote){ errBox.innerHTML = `<div class="sc-error">${icon("alert",14)} Selecione o lote antes de informar o peso.</div>`; return; }
  if (!qtd || qtd<=0){ errBox.innerHTML = `<div class="sc-error">${icon("alert",14)} Informe um peso maior que zero.</div>`; return; }
  const lotes = getLotesEmEstoque(materialId);
  const loteInfo = lotes.find(l=>l.lote===lote);
  const alocacoesAtuais = COMPLETAR_PENDENCIA.pesagens[materialId] || [];
  const jaAlocado = round3(alocacoesAtuais.filter(a=>a.lote===lote).reduce((acc,a)=>acc+a.quantidade,0));
  const disponivel = loteInfo ? round3(loteInfo.saldo - jaAlocado) : 0;
  if (!loteInfo || qtd > disponivel){
    errBox.innerHTML = `<div class="sc-error">${icon("alert",14)} O lote "${escapeHtml(lote)}" só tem ${fmtNum(disponivel)} disponível. Ajuste o peso ou adicione outro lote depois.</div>`;
    return;
  }
  if (!COMPLETAR_PENDENCIA.pesagens[materialId]) COMPLETAR_PENDENCIA.pesagens[materialId] = [];
  COMPLETAR_PENDENCIA.pesagens[materialId].push({ quantidade: qtd, lote, validade: loteInfo.validade||"" });
  if (COMPLETAR_PENDENCIA.loteEmEdicao) delete COMPLETAR_PENDENCIA.loteEmEdicao[materialId];
  COMPLETAR_PENDENCIA.materialEmPesagem = null;
  renderMain();
}
function imprimirEtiquetaAlocacaoPendencia(materialId, index){
  const alocacoes = COMPLETAR_PENDENCIA.pesagens[materialId];
  if (!alocacoes || !alocacoes[index]) return;
  const pesagem = alocacoes[index];
  const material = DB.materiais.find(m=>m.id===materialId);
  const tipoMap = mapBy(DB.tipos);
  const prod = DB.movimentos.find(m => m.producaoId===COMPLETAR_PENDENCIA.producaoId && tipoMap[m.tipoMovimentoId]?.especial==="producao_entrada" && !m.anulado);
  const mf = DB.misturasFinas.find(m=>m.id===prod?.misturaFinaId);
  const item = {
    materialNome: material?.nome||"—", materialCodigo: material?.codigo||"",
    loteIngrediente: pesagem.lote||"", misturaCodigo: mf?.codigo||"", misturaLote: prod?.lote||"",
    data: fmtDate(todayISO()), peso: pesagem.quantidade, unidade: material?.unidade||"",
  };
  perguntarViasEImprimir([item]);
}
function removerAlocacaoPesagemPendencia(materialId, index){
  if (!COMPLETAR_PENDENCIA.pesagens[materialId]) return;
  COMPLETAR_PENDENCIA.pesagens[materialId].splice(index, 1);
  if (COMPLETAR_PENDENCIA.pesagens[materialId].length===0) delete COMPLETAR_PENDENCIA.pesagens[materialId];
  renderMain();
}
function inferirQuantidadeAlvoOriginal(mf, prod){
  const tipoMap = mapBy(DB.tipos);
  const consumosExistentes = DB.movimentos.filter(m=>m.producaoId===prod.producaoId && tipoMap[m.tipoMovimentoId]?.especial==="producao_consumo" && !m.anulado);
  const somaPorIngrediente = {};
  consumosExistentes.forEach(c => { somaPorIngrediente[c.materialId] = round3((somaPorIngrediente[c.materialId]||0) + c.quantidade); });
  for (const ing of mf.ingredientes){
    const somaExistente = somaPorIngrediente[ing.materialId];
    if (somaExistente && ing.percentual>0) return round3(somaExistente / (ing.percentual/100));
  }
  return 0;
}
function registrarPesagensPendentes(prodId){
  const errBox = document.getElementById("completar_erro");
  const prod = DB.movimentos.find(m=>m.id===prodId);
  if (!prod){ if(errBox) errBox.innerHTML = `<div class="sc-error">${icon("alert",14)} Lote não encontrado.</div>`; return; }
  const mf = DB.misturasFinas.find(m=>m.id===prod.misturaFinaId);
  if (!mf){ if(errBox) errBox.innerHTML = `<div class="sc-error">${icon("alert",14)} Mistura fina não encontrada.</div>`; return; }
  const pesadosIds = Object.keys(COMPLETAR_PENDENCIA?.pesagens||{});
  if (pesadosIds.length===0){ if(errBox) errBox.innerHTML = `<div class="sc-error">${icon("alert",14)} Pese ao menos um item pendente antes de registrar.</div>`; return; }

  const materialMap = mapBy(DB.materiais);
  for (const materialId of pesadosIds){
    const alocacoes = COMPLETAR_PENDENCIA.pesagens[materialId];
    const lotes = getLotesEmEstoque(materialId);
    const somaPorLote = {};
    alocacoes.forEach(a => { somaPorLote[a.lote] = round3((somaPorLote[a.lote]||0) + a.quantidade); });
    for (const [lote, soma] of Object.entries(somaPorLote)){
      const loteInfo = lotes.find(l=>l.lote===lote);
      if (!loteInfo || soma > loteInfo.saldo){
        if (errBox) errBox.innerHTML = `<div class="sc-error">${icon("alert",14)} O lote "${escapeHtml(lote)}" de "${escapeHtml(materialMap[materialId]?.nome||"?")}" não tem mais saldo suficiente. Repese este item.</div>`;
        return;
      }
    }
  }

  const quantidadeAlvoInferida = inferirQuantidadeAlvoOriginal(mf, prod);
  for (const materialId of pesadosIds){
    const ing = mf.ingredientes.find(i=>i.materialId===materialId);
    if (!ing || !quantidadeAlvoInferida) continue;
    const alvo = round3(ing.percentual/100 * quantidadeAlvoInferida);
    const totalPesado = round3(COMPLETAR_PENDENCIA.pesagens[materialId].reduce((acc,a)=>acc+a.quantidade,0));
    const material = materialMap[materialId];
    const resultado = validarErroPesagem(totalPesado, alvo, material?.unidade);
    if (resultado.bloqueado){
      alert(`${escapeHtml(material?.nome||"Item")}: ${resultado.mensagem}`);
      return;
    }
  }

  const tipoMap = mapBy(DB.tipos);
  const tipoConsumoId = garantirTipoProducaoConsumo();
  const tipoEntradaId = garantirTipoProducaoEntrada();
  const tipoEnvioId = garantirTipoProducaoEnvio();
  const agora = new Date().toISOString();
  const dataMov = todayISO();

  const novosRegistros = [];
  let extraTotal = 0;
  pesadosIds.forEach(materialId => {
    const alocacoes = COMPLETAR_PENDENCIA.pesagens[materialId];
    alocacoes.forEach(pesagem => {
      extraTotal = round3(extraTotal + pesagem.quantidade);
      novosRegistros.push({
        id: uid(), producaoId: prod.producaoId, misturaFinaId: mf.id,
        data: dataMov, materialId, tipoMovimentoId: tipoConsumoId,
        setorId: prod.setorId, quantidade: pesagem.quantidade, delta: -pesagem.quantidade,
        lote: pesagem.lote, validade: pesagem.validade||"", documento: prod.documento||"",
        observacao: "Pesagem pendente completada posteriormente.",
        escopo: prod.escopo, colaboradorId: "",
        assinaturaOperador: null, assinadoEmOperador: null,
        assinatura: null, assinadoEm: null,
        criadoEm: agora,
      });
    });
  });
  DB.movimentos = [...novosRegistros, ...DB.movimentos];

  const deltaPorMaterial = {};
  novosRegistros.forEach(r => { deltaPorMaterial[r.materialId] = round3((deltaPorMaterial[r.materialId]||0) + r.delta); });
  DB.materiais = DB.materiais.map(m => deltaPorMaterial[m.id] ? {...m, estoqueAtual: round3((m.estoqueAtual||0)+deltaPorMaterial[m.id])} : m);

  // soma o peso recém-pesado à entrada e ao envio do semiacabado (o estoque continua líquido em zero)
  DB.movimentos = DB.movimentos.map(m => {
    if (m.producaoId!==prod.producaoId) return m;
    if (m.tipoMovimentoId===tipoEntradaId) return { ...m, quantidade: round3(m.quantidade+extraTotal), delta: round3(m.delta+extraTotal) };
    if (m.tipoMovimentoId===tipoEnvioId) return { ...m, quantidade: round3(m.quantidade+extraTotal), delta: round3(m.delta-extraTotal) };
    return m;
  });

  // recalcula a pendência: pode ter sido resolvida por completo ou só parcialmente
  const consumosAtualizados = DB.movimentos.filter(m => m.producaoId===prod.producaoId && tipoMap[m.tipoMovimentoId]?.especial==="producao_consumo" && !m.anulado);
  const aindaFaltando = mf.ingredientes.filter(ing => !consumosAtualizados.some(c=>c.materialId===ing.materialId)).map(ing => materialMap[ing.materialId]?.nome || ing.materialId);
  DB.movimentos = DB.movimentos.map(m => (m.producaoId===prod.producaoId && m.tipoMovimentoId===tipoEntradaId)
    ? { ...m, pendenteMateriais: aindaFaltando.length>0, ingredientesFaltantes: aindaFaltando }
    : m);

  persist("materiais");
  persist("movimentos");
  ITENS_PRODUZIDOS_COMPLETANDO = null;
  COMPLETAR_PENDENCIA = null;
  render();
}

/* ================================ RELATÓRIOS ================================ */
function downloadExcel(rows, sheetName, filename){
  if (typeof XLSX === "undefined"){
    alert("Não foi possível carregar o gerador de planilhas Excel. Verifique sua conexão com a internet e tente novamente.");
    return;
  }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, filename);
}
function estoquesHTML(){
  const materiaisNaSala = DB.materiais.filter(m => inRoom(m, ROOM) && !isSemiacabado(m));
  const abaixoMinimo = materiaisNaSala.filter(m => (m.estoqueAtual||0) <= (m.estoqueMinimo||0));
  const statusValidadePorMaterial = materiaisNaSala.map(m => piorValidadeMaterial(m.id)).filter(Boolean);
  const contarStatus = (status) => statusValidadePorMaterial.filter(c=>c.status===status).length;
  const qtdVencidos = contarStatus("vencido");
  const qtdHoje = contarStatus("hoje");
  const qtdCriticos = contarStatus("critico");
  const qtdAtencao = contarStatus("atencao");
  const categoriaItemsEstoque = [...new Set(materiaisNaSala.map(m=>m.categoria).filter(Boolean))].sort((a,b)=>a.localeCompare(b)).map(c=>({value:c, label:c}));

  const estoqueSection = sectionHTML("Estoque atual","boxes",
    `<button class="sc-btn sc-btn-ghost" onclick="exportEstoqueExcel()">${icon("download",14)}<span>Exportar Excel</span></button>`, `
    ${abaixoMinimo.length>0 ? `<div class="sc-hint sc-hint-alert" style="cursor:pointer;" onclick="filtrarEstoquePorSituacao('baixo')" title="Clique para ver apenas estes materiais">${icon("alert",14)} ${abaixoMinimo.length} material(is) abaixo do estoque mínimo.</div>` : ""}
    ${(qtdVencidos+qtdHoje+qtdCriticos+qtdAtencao)>0 ? `
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center;">
      ${qtdVencidos>0?`<button class="sc-tag tag-vencido ${ESTOQUE_FILTRO_VALIDADE==="vencido"?"is-tagativa":""}" style="cursor:pointer; border:none;" onclick="filtrarEstoquePorValidade('vencido')">${qtdVencidos} vencido(s)</button>`:""}
      ${qtdHoje>0?`<button class="sc-tag tag-hoje ${ESTOQUE_FILTRO_VALIDADE==="hoje"?"is-tagativa":""}" style="cursor:pointer; border:none;" onclick="filtrarEstoquePorValidade('hoje')">${qtdHoje} vencendo hoje</button>`:""}

function filterEstoqueList(materiaisNaSala){
  const q = (document.getElementById("estoqueSearch")?.value || "").toLowerCase();
  const categoria = document.getElementById("estoqueFiltroCategoria")?.value || "";
  const situacao = document.getElementById("estoqueFiltroSituacao")?.value || "";
  const validadeFiltro = ESTOQUE_FILTRO_VALIDADE || "";
  const ordenar = document.getElementById("estoqueOrdenar")?.value || "nome_asc";
  let lista = materiaisNaSala.filter(m => {
    const baixo = (m.estoqueAtual||0) <= (m.estoqueMinimo||0);
    if (categoria && m.categoria !== categoria) return false;
    if (situacao==="baixo" && !baixo) return false;
    if (situacao==="normal" && baixo) return false;
    if (validadeFiltro){
      const pior = piorValidadeMaterial(m.id);
      const status = pior ? pior.status : "sem_validade";
      if (validadeFiltro==="qualquer_alerta"){
        if (!["vencido","hoje","critico","atencao"].includes(status)) return false;
      } else if (validadeFiltro==="sem_validade"){
        if (pior) return false;
      } else if (status !== validadeFiltro) return false;
    }
    return `${m.codigo} ${m.nome}`.toLowerCase().includes(q);
  });
  const cmp = {
    nome_asc: (a,b)=>a.nome.localeCompare(b.nome),
    nome_desc: (a,b)=>b.nome.localeCompare(a.nome),
    estoque_desc: (a,b)=>(b.estoqueAtual||0)-(a.estoqueAtual||0),
    estoque_asc: (a,b)=>(a.estoqueAtual||0)-(b.estoqueAtual||0),
  }[ordenar];
  return lista.slice().sort(cmp);
}

        <div id="edmv_erro"></div>
      </div>
      <div class="sc-formfoot">
        <button class="sc-btn sc-btn-ghost" onclick="fecharEdicaoMovimento()">Cancelar</button>

function salvarEdicaoMovimento(id){
  const mov = DB.movimentos.find(m=>m.id===id);
  if (!mov) return;
  const errBox = document.getElementById("edmv_erro");
  const daProducao = !!(mov.producaoId && mov.misturaFinaId);

  const novaData = document.getElementById("edmv_data").value || mov.data;
  const novoLote = document.getElementById("edmv_lote").value.trim();
  const novaValidade = document.getElementById("edmv_validade").value || "";
  const novoSetor = document.getElementById("edmv_setor").value || "";
  const novoDoc = document.getElementById("edmv_doc").value.trim();
  const novaObs = document.getElementById("edmv_obs").value.trim();

  let novaQtd = mov.quantidade;
  if (!daProducao){
    novaQtd = Number(document.getElementById("edmv_qtd").value);
    if (!novaQtd || novaQtd<=0){ errBox.innerHTML = `<div class="sc-error">${icon("alert",14)} Informe uma quantidade maior que zero.</div>`; return; }
  }

  // recalcula o efeito no estoque preservando o sinal original do lançamento
  const sinal = mov.delta < 0 ? -1 : 1;
  const novoDelta = round3(sinal * novaQtd);
  const diferenca = round3(novoDelta - (mov.delta||0));

  if (diferenca !== 0 && !mov.anulado){
    const material = DB.materiais.find(x=>x.id===mov.materialId);
    const novoEstoque = round3((material?.estoqueAtual||0) + diferenca);
    if (novoEstoque < 0){
      errBox.innerHTML = `<div class="sc-error">${icon("alert",14)} Esta alteração deixaria o estoque de "${escapeHtml(material?.nome||"?")}" negativo (${fmtNum(novoEstoque)}). Ajuste a quantidade.</div>`;
      return;
    }
    DB.materiais = DB.materiais.map(x => x.id===mov.materialId ? {...x, estoqueAtual: novoEstoque} : x);
    persist("materiais");
  }

  DB.movimentos = DB.movimentos.map(m => m.id===id ? {
    ...m,
    data: novaData, quantidade: novaQtd, delta: novoDelta,
    lote: novoLote, validade: novaValidade, setorId: novoSetor,
    documento: novoDoc, observacao: novaObs,
    editadoEm: new Date().toISOString(),
  } : m);
  persist("movimentos");
  MOV_EDITANDO_ID = null;
  render();
}

          <div class="sc-search" style="flex:1; min-width:180px;">${icon("search",14)}<input id="consumoMatBusca" oninput="renderConsumoMateriaisList()" placeholder="Buscar material…"></div>
        </div>
        <div id="consumoMatListWrap">${consumoMateriaisListHTML()}</div>
      </div>
    </div>
    <div class="sc-tablewrap" id="consumoTableWrap" style="margin-top:12px;">${consumoTableHTML()}</div>
    <div class="sc-formfoot" style="padding:14px 0 0;">
      <button class="sc-btn sc-btn-ghost" onclick="exportConsumoExcel()">${icon("download",14)}<span>Exportar Excel</span></button>
    </div>
  `);

  return pageHTML("Consumo", `Consumo por material e análises<span class="sc-roomchip">${icon(roomIcon(ROOM),11)} ${roomLabel(ROOM)}</span>`, "",
    `${painelConsumo}`);
}
function consumoMateriaisListHTML(){
  const q = (document.getElementById("consumoMatBusca")?.value || "").toLowerCase();
  const materiaisNaSala = DB.materiais.filter(m => inRoom(m, ROOM) && `${m.nome} ${m.codigo||""}`.toLowerCase().includes(q)).sort((a,b)=>a.nome.localeCompare(b.nome));
  if (materiaisNaSala.length===0) return emptyHTML("Nenhum material encontrado.");
  return `<div style="display:flex; flex-direction:column; gap:4px; max-height:220px; overflow:auto; border:1px solid var(--line); border-radius:8px; padding:8px 10px;">
      ${materiaisNaSala.map(m=>`
        <label style="display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:400; padding:2px 0;">
          <input type="checkbox" id="consumo_mat_${m.id}" ${CONSUMO_MATERIAIS_SELECIONADOS.has(m.id)?"checked":""} onchange="onConsumoMaterialToggle('${m.id}', this.checked)">
          <span>${escapeHtml(m.nome)}${m.codigo?` (${escapeHtml(m.codigo)})`:""}</span>
        </label>`).join("")}
    </div>`;
}
function renderConsumoMateriaisList(){
  const wrap = document.getElementById("consumoMatListWrap");
  if (wrap) wrap.innerHTML = consumoMateriaisListHTML();
}
function onConsumoMaterialToggle(materialId, checked){
  if (checked) CONSUMO_MATERIAIS_SELECIONADOS.add(materialId);
  else CONSUMO_MATERIAIS_SELECIONADOS.delete(materialId);
  renderConsumoTable();
}
function selecionarTodosConsumo(){
  const materiaisNaSala = DB.materiais.filter(m => inRoom(m, ROOM));
  materiaisNaSala.forEach(m => CONSUMO_MATERIAIS_SELECIONADOS.add(m.id));
  renderMain();
}
function limparSelecaoConsumo(){
  CONSUMO_MATERIAIS_SELECIONADOS.clear();
  renderMain();
}
function calcularConsumo(){
  const de = document.getElementById("cf_de")?.value || "";
  const ate = document.getElementById("cf_ate")?.value || "";
  const ordenar = document.getElementById("cf_ordenar")?.value || "consumo_desc";
  const tipoMap = mapBy(DB.tipos);
  const materiaisAlvo = DB.materiais.filter(m => inRoom(m, ROOM) && CONSUMO_MATERIAIS_SELECIONADOS.has(m.id));
  const linhas = materiaisAlvo.map(m => {
    const movs = DB.movimentos.filter(mv => {
      if (mv.materialId !== m.id) return false;
      if (!inRoom(mv, ROOM)) return false;
      if (de && mv.data < de) return false;
      if (ate && mv.data > ate) return false;
      if (mv.anulado) return false;
      return tipoMap[mv.tipoMovimentoId]?.efeito === "saida";
    });
    const totalConsumido = round3(movs.reduce((acc,mv)=>acc+mv.quantidade, 0));
    return { material: m, totalConsumido, numMovimentos: movs.length };
  });
  const cmp = {
    consumo_desc: (a,b)=>b.totalConsumido-a.totalConsumido,
    consumo_asc: (a,b)=>a.totalConsumido-b.totalConsumido,
    nome_asc: (a,b)=>a.material.nome.localeCompare(b.material.nome),
    nome_desc: (a,b)=>b.material.nome.localeCompare(a.material.nome),
  }[ordenar];
  return linhas.sort(cmp);
}
function consumoTableHTML(){
  if (CONSUMO_MATERIAIS_SELECIONADOS.size===0){
    return emptyHTML("Selecione um ou mais materiais acima para ver o consumo no período.");
  }
  const linhas = calcularConsumo();
  if (linhas.length===0) return emptyHTML("Nenhum material selecionado nesta visão.");
  return `<table class="sc-table">
    <thead><tr><th>Material</th><th>Categoria</th><th class="num">Consumido no período</th><th class="num">Nº movimentações</th></tr></thead>
    <tbody>${linhas.map(l=>`
      <tr><td>${escapeHtml(l.material.nome)}</td><td>${escapeHtml(l.material.categoria)}</td>
      <td class="num mono">${fmtNum(l.totalConsumido)} ${escapeHtml(l.material.unidade)}</td>
      <td class="num mono">${l.numMovimentos}</td></tr>`).join("")}</tbody></table>`;
}
function renderConsumoTable(){
  const wrap = document.getElementById("consumoTableWrap");
  if (wrap) wrap.innerHTML = consumoTableHTML();
}
function exportConsumoExcel(){
  const linhas = calcularConsumo();
  const rows = linhas.map(l => ({
    "Material": l.material.nome,
    "Código": l.material.codigo || "",
    "Categoria": l.material.categoria,
    "Consumido no Período": l.totalConsumido,
    "Unidade": l.material.unidade,
    "Nº de Movimentações": l.numMovimentos,
  }));
  downloadExcel(rows, "Consumo por Material", `consumo_por_material_${todayISO()}.xlsx`);
}

/* ============================ RELATÓRIOS · MISTURAS FINAS (lista técnica) ============================ */
function misturasRelatorioHTML(){
  const misturas = DB.misturasFinas.filter(mf => inRoom(mf, ROOM));
  const materialMap = mapBy(DB.materiais);
  const setorMap = mapBy(DB.setores);
  const subtitle = `Lista técnica (receita) de cada mistura fina cadastrada<span class="sc-roomchip">${icon(roomIcon(ROOM),11)} ${roomLabel(ROOM)}</span>`;

  if (misturas.length===0){
    return pageHTML("Misturas Finas", subtitle, "",
      emptyHTML('Nenhuma mistura fina cadastrada ainda. Cadastre em "Misturas Finas", dentro de Cadastros.'));
  }

  const setorItensMfRel = [...DB.setores].sort((a,b)=>a.nome.localeCompare(b.nome)).map(s=>({value:s.id, label:s.nome}));
  const toolbar = `
    <div class="sc-toolbar">
      <div class="sc-search">${icon("search")}<input id="mfRelSearch" oninput="renderMisturasRelatorioTable()" placeholder="Buscar por nome ou código…"></div>
      ${comboHTML("mfRelFiltroSetor", setorItensMfRel, document.getElementById("mfRelFiltroSetor")?.value||"", {placeholder:"Todos os setores", style:"max-width:220px;", onChange:()=>renderMisturasRelatorioTable()})}
      <select class="sc-input" id="mfRelOrdenar" onchange="renderMisturasRelatorioTable()" style="max-width:200px;">
        <option value="nome_asc">Nome (A-Z)</option>
        <option value="nome_desc">Nome (Z-A)</option>
        <option value="codigo_asc">Código</option>
        <option value="ingredientes_desc">Nº de ingredientes</option>
      </select>
    </div>`;

  return pageHTML("Misturas Finas", subtitle, "", `${toolbar}<div class="sc-tablewrap" id="mfRelTableWrap">${misturasRelatorioTableHTML(filterMisturasRelatorioList(misturas))}</div>`);
}
function misturasRelatorioTableHTML(list){
  const materialMap = mapBy(DB.materiais);
  if (list.length===0) return emptyHTML("Nenhuma mistura fina encontrada para os filtros selecionados.");
  return `<table class="sc-table">
    <thead><tr><th>Nome</th><th>Material produzido</th><th class="num">Ingredientes</th><th></th></tr></thead>
    <tbody>${list.map(mf=>{
      const produzido = materialMap[mf.materialProduzidoId];
      return `<tr>
        <td>${escapeHtml(mf.nome)}${mf.codigo?` <span class="mono" style="color:var(--ink-faint);">(${escapeHtml(mf.codigo)})</span>`:""}</td>
        <td>${escapeHtml(produzido?.nome||"—")}</td>
        <td class="num mono">${(mf.ingredientes||[]).length}</td>
        <td class="rowActions">
          <button class="sc-iconbtn" title="Editar" onclick="editarMisturaDoRelatorio('${mf.id}')">${icon("edit",14)}</button>
          <button class="sc-btn sc-btn-ghost" onclick="gerarListaTecnica('${mf.id}')">${icon("download",13)}<span>Lista Técnica</span></button>
        </td>
      </tr>`;
    }).join("")}</tbody></table>`;
}
function filterMisturasRelatorioList(misturas){
  const q = (document.getElementById("mfRelSearch")?.value || "").toLowerCase();
  const setorId = document.getElementById("mfRelFiltroSetor")?.value || "";
  const ordenar = document.getElementById("mfRelOrdenar")?.value || "nome_asc";
  let lista = misturas.filter(mf => {
    if (setorId && mf.setorId !== setorId) return false;
    return `${mf.nome} ${mf.codigo}`.toLowerCase().includes(q);
  });
  const cmp = {
    nome_asc: (a,b)=>a.nome.localeCompare(b.nome),
    nome_desc: (a,b)=>b.nome.localeCompare(a.nome),
    codigo_asc: (a,b)=>(a.codigo||"").localeCompare(b.codigo||"", undefined, {numeric:true}),
    ingredientes_desc: (a,b)=>(b.ingredientes||[]).length-(a.ingredientes||[]).length,
  }[ordenar];
  return lista.slice().sort(cmp);
}
function renderMisturasRelatorioTable(){
  const wrap = document.getElementById("mfRelTableWrap");
  const misturas = DB.misturasFinas.filter(mf => inRoom(mf, ROOM));
  if (wrap) wrap.innerHTML = misturasRelatorioTableHTML(filterMisturasRelatorioList(misturas));
}
function editarMisturaDoRelatorio(id){
  const mf = DB.misturasFinas.find(m=>m.id===id);
  VIEW = "misturasfinas";
  OPEN_FORM = {
    type: "misturafina",
    editId: id,
    ingredientesDraft: mf ? mf.ingredientes.map(i=>({...i})) : [{ materialId:"", quantidade:"" }],
  };
  render();
}
function gerarListaTecnica(misturaId){
  const mf = DB.misturasFinas.find(m=>m.id===misturaId);
  if (!mf){ alert("Mistura fina não encontrada."); return; }
  const materialMap = mapBy(DB.materiais);
  const produzido = materialMap[mf.materialProduzidoId];
  const totalPercentual = round3(mf.ingredientes.reduce((acc,ing)=>acc+(ing.percentual||0),0));
  const linhasIngredientes = mf.ingredientes.map((ing,i) => {
    const material = materialMap[ing.materialId];
    return `<tr>
      <td>${i+1}</td>
      <td>${escapeHtml(material?.nome||"—")}</td>
      <td>${escapeHtml(material?.codigo||"—")}</td>
      <td>${fmtNum(ing.percentual)}%</td>
    </tr>`;
  }).join("");

  const html = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Lista Técnica — ${escapeHtml(mf.nome)}</title>
<style>
  body{ font-family: Arial, Helvetica, sans-serif; color:#16233A; padding:32px; max-width:900px; margin:0 auto; }
  h1{ font-size:16px; text-align:center; margin:0 0 4px; }
  .sub{ text-align:center; font-size:11px; color:#555; margin-bottom:22px; }
  .info{ font-size:12.5px; margin-bottom:4px; }
  table{ width:100%; border-collapse:collapse; margin-top:16px; font-size:11.5px; }
  th, td{ border:1px solid #999; padding:6px 8px; text-align:left; }
  th{ background:#eef1f5; }
  tfoot td{ font-weight:bold; background:#f6f6f6; }
  .obs{ margin-top:20px; font-size:11px; line-height:1.5; }
  .footnote{ margin-top:30px; font-size:9.5px; color:#777; }
  .no-print{ margin-top:26px; text-align:center; }
  .no-print button{ padding:9px 18px; font-size:13px; cursor:pointer; border-radius:6px; border:1px solid #173a7a; background:#173a7a; color:#fff; }
  @media print { .no-print{ display:none; } body{ padding:0; } }
</style></head><body>
  <h1>LISTA TÉCNICA DE PRODUÇÃO — ${escapeHtml(mf.nome.toUpperCase())}</h1>
  <div class="sub">Biosyn — Sala de Mistura Fina</div>
  <div class="info"><strong>Código da mistura:</strong> ${escapeHtml(mf.codigo||"—")}</div>
  <div class="info"><strong>Material produzido:</strong> ${escapeHtml(produzido?.nome||"—")}${produzido?.codigo?` (${escapeHtml(produzido.codigo)})`:""}</div>
  <table>
    <thead><tr><th>#</th><th>Ingrediente</th><th>Código</th><th>% do total</th></tr></thead>
    <tbody>${linhasIngredientes || `<tr><td colspan="4" style="text-align:center;color:#777;">Nenhum ingrediente cadastrado.</td></tr>`}</tbody>
    ${mf.ingredientes.length>0 ? `<tfoot><tr><td colspan="3">Total</td><td>${fmtNum(totalPercentual)}%</td></tr></tfoot>` : ""}
  </table>
  ${mf.observacao ? `<div class="obs"><strong>Observações:</strong> ${escapeHtml(mf.observacao)}</div>` : ""}
  <div class="footnote">Documento gerado automaticamente pelo Painel de Controle de Estoque — Biosyn, em ${escapeHtml(fmtDate(todayISO()))}.</div>
  <div class="no-print"><button onclick="window.print()">Imprimir / Salvar como PDF</button></div>
</body></html>`;

  const win = window.open("", "_blank");
  if (!win){ alert("Não foi possível abrir a lista técnica. Verifique se o bloqueador de pop-ups do navegador está ativo para este site."); return; }
  win.document.open();
  win.document.write(html);
  win.document.close();
}
