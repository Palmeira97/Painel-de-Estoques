<body>
<div id="app"></div>

<script>
/* =====================================================================
   PAINEL DE CONTROLE DE ESTOQUE — BIOSYN
   Duas salas: Produtos Controlados e EPIs.
   Cada registro (material, categoria, unidade, setor, tipo de
   movimento, movimentação) carrega um "escopo" de visibilidade:
   'ambas' | 'controlados' | 'epis'.
   Persistência: window.storage quando disponível (dentro do Claude);
   caso contrário, localStorage do navegador (uso independente).
===================================================================== */

const STORAGE_PREFIX = "biosyn_estoque_mistura_fina";
const HAS_CLAUDE_STORAGE = (typeof window.storage !== "undefined");

async function storageGet(key){
  if (HAS_CLAUDE_STORAGE){ try { return await window.storage.get(key); } catch(e){ return null; } }
  const v = localStorage.getItem(key);
  return v ? { key, value: v } : null;
}
async function storageSet(key, value){
  if (HAS_CLAUDE_STORAGE){ try { return await window.storage.set(key, value); } catch(e){ console.error(e); return null; } }
  localStorage.setItem(key, value);
  return { key, value };
}
async function storageDelete(key){
  if (HAS_CLAUDE_STORAGE){ try { return await window.storage.delete(key); } catch(e){ return null; } }
  localStorage.removeItem(key);
  return null;
}

/* ------------------------------- helpers ------------------------------- */
const uid = () => `${Date.now().toString(36)}${Math.random().toString(36).slice(2,8)}`;
const todayISO = () => new Date().toISOString().slice(0,10);
const round3 = (n) => Math.round(n*1000)/1000;
function converterParaGramas(valor, unidade){
  const u = (unidade||"").trim().toLowerCase();
  if (u === "kg") return valor*1000;
  if (u === "g") return valor;
  return null; // unidade não suportada por esta regra (ex.: mL, L, unidade, caixa)
}
function limiteErroPesagem(alvoGramas){
  if (alvoGramas <= 100) return { categoria: "até 100 g", limite: 0.02 };
  if (alvoGramas <= 5000) return { categoria: "até 5.000 g", limite: 0.3 };
  return { categoria: "acima de 5.000 g", limite: 0.6 };
}
function validarErroPesagem(pesoTotal, alvo, unidade){
  if (!alvo || alvo<=0) return { bloqueado:false };
  if (pesoTotal < alvo){
    return { bloqueado:true, mensagem: `Peso abaixo do indicado na formulação.\n\nAlvo: ${fmtNum(alvo)} ${unidade||""}\nPesado: ${fmtNum(pesoTotal)} ${unidade||""}` };
  }
  const alvoGramas = converterParaGramas(alvo, unidade);
  if (alvoGramas === null) return { bloqueado:false };
  const { categoria, limite } = limiteErroPesagem(alvoGramas);
  const erroPercentual = round3(((pesoTotal-alvo)/alvo)*100);
  if (erroPercentual > limite){
    return { bloqueado:true, mensagem: `Erro de pesagem superior ao limite estabelecido.\n\nEsta pesagem se enquadra na categoria "${categoria}", cujo limite máximo de erro é ${limite}%.\nErro atual: ${fmtNum(erroPercentual)}%` };
  }
  return { bloqueado:false };
}
const fmtDate = (iso) => { if(!iso) return "—"; const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; };
const fmtNum = (n) => new Intl.NumberFormat("pt-BR",{maximumFractionDigits:3}).format(n||0);
const escapeHtml = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ------------------------------- salas e escopo (visibilidade por sala) ------------------------------- */
const ROOMS = [
  { id:"mistura_fina", label:"Mistura Fina", icon:"flask" },
];
const ALL_ROOM_IDS = ROOMS.map(r=>r.id);
function roomIcon(room){ const r = ROOMS.find(x=>x.id===room); return r ? r.icon : "globe"; }
function roomLabel(room){
  const r = ROOMS.find(x=>x.id===room);
  if (r) return `Sala de ${r.label}`;
  return "Visão Geral — Todas as Salas";
}
/* ---------- seletor com busca (combobox) ----------
   Renderiza um campo de texto com sugestões filtradas conforme a digitação e mantém um input
   escondido com o MESMO id do antigo <select>, para que todas as leituras de valor continuem iguais. */
const COMBO_REG = {};
function comboHTML(id, items, selectedValue, opts){
  opts = opts || {};
  COMBO_REG[id] = { items, onChange: opts.onChange || null };
  const sel = items.find(i => String(i.value) === String(selectedValue==null?"":selectedValue));
  const listId = "dl_" + String(id).replace(/[^A-Za-z0-9_]/g, "_");
  const estilo = opts.style ? ` style="${opts.style}"` : "";
  return `<input class="sc-input" id="${id}__q" list="${listId}" value="${escapeHtml(sel?sel.label:"")}" placeholder="${escapeHtml(opts.placeholder||"Digite para buscar…")}" oninput="comboOnInput('${id}')" onblur="comboOnBlur('${id}')" autocomplete="off"${estilo}>
<datalist id="${listId}">${items.map(i=>`<option value="${escapeHtml(i.label)}"></option>`).join("")}</datalist>
<input type="hidden" id="${id}" value="${escapeHtml(sel?String(sel.value):"")}">`;
}
function comboOnInput(id){
  const reg = COMBO_REG[id];
  if (!reg) return;
  const qEl = document.getElementById(id+"__q");
  const hidden = document.getElementById(id);
  if (!qEl || !hidden) return;
  const texto = (qEl.value||"").trim();
  const achado = reg.items.find(i => i.label.toLowerCase() === texto.toLowerCase());
  let novo;
  if (achado) novo = String(achado.value);
  else if (texto === "") novo = "";
  else return; // ainda digitando: não descarta a seleção atual no meio da busca
  if (hidden.value === novo) return;
  hidden.value = novo;
  if (reg.onChange) reg.onChange(novo);
}
function comboOnBlur(id){
  const reg = COMBO_REG[id];
  if (!reg) return;
  const qEl = document.getElementById(id+"__q");
  const hidden = document.getElementById(id);
  if (!qEl || !hidden) return;
  // ao sair do campo, mostra sempre o rótulo do item realmente selecionado (evita texto solto sem seleção)
  const atual = reg.items.find(i => String(i.value) === String(hidden.value));
  qEl.value = atual ? atual.label : "";
}
function isSemiacabado(material){
  if (!material) return false;
  if (material.categoria === "Semiacabado") return true;
  // um material referenciado como produto de alguma mistura fina também é semiacabado
  return DB.misturasFinas.some(mf => mf.materialProduzidoId === material.id);
}
function setorHomeDaSala(roomId){
  if (!roomId || roomId==="todas") return null;
  return DB.setores.find(s => s.salaBase === roomId) || null;
}
function inRoom(item, room){
  // Este painel tem uma única sala (Mistura Fina) — tudo está sempre visível.
  return true;
}
/* ------------------------------- seed data ------------------------------- */
function seedCategorias(){
  return ["Matéria-Prima","Insumo de Mistura","Semiacabado","Produto Acabado","Embalagem","Outro"]
    .map(nome => ({ id: uid(), nome, escopo:[...ALL_ROOM_IDS] }));
}
function seedUnidades(){ return ["g","kg","mL","L","unidade","caixa"].map(nome => ({ id: uid(), nome, escopo:[...ALL_ROOM_IDS] })); }
const EFEITOS = [
  { id:"entrada", label:"Entrada (soma ao estoque)" },
  { id:"saida", label:"Saída (subtrai do estoque)" },
];
function isEntregaIndividual(tipo){
  if (!tipo) return false;
  if (tipo.especial === "entrega_individual") return true;
  return String(tipo.nome||"").trim().toLowerCase() === "entrega individual";
}
const NOMES_BAIXA_INTERNA = ["saída por utilização", "saída por descarte", "ajuste de inventário - negativo"];
function isBaixaInterna(tipo){
  if (!tipo) return false;
  if (tipo.especial === "baixa_interna") return true;
  return NOMES_BAIXA_INTERNA.includes(String(tipo.nome||"").trim().toLowerCase());
}
function seedSetores(){ return [
  { id: uid(), nome:"Sala de Mistura Fina", responsavelId:"", escopo:[...ALL_ROOM_IDS], salaBase:"mistura_fina" },
]; }
const COLABORADORES_PADRAO_BIOSYN = [
  ["ALESSANDRA GRUBER","Controle de Qualidade"], ["AMANDA DA SILVA VICENTE","Recursos Humanos"],
  ["AMANDA GRUN WESTFAL","Administrativo Geral"], ["ANA PAULA DA SILVA CARDOSO","Faturamento"],
  ["ANDRELISE LUCINEIDE DELFINO","Manutenção Industrial"], ["ANDRESSA OLIVEIRA MACHADO","Segurança e Esterilização"],
  ["ARTHUR HENRIQUE PALMEIRA","Suprimentos"], ["BIANCA ALVES DA SILVA","Logística"],
  ["BRYAN DE LIMA DOS SANTOS LIMA","Setor Ingredientes"], ["CALLIANDRA DAVID ESMALA","Marketing"],
  ["CAMILA CAMPOS VACA","Controle de Qualidade"], ["CAMILA ROSA DUARTE","Setor Ingredientes"],
  ["CLAUDETE MARTINS DE LARA","Segurança e Esterilização"], ["CLAUDINEI SOARES DA SILVA","Administrativo Geral"],
  ["DAIANE DO ROSARIO","Controle de Qualidade"], ["DIANA DA SILVA SOUZA","Recursos Humanos"],

function paraNomeProprio(texto){
  return texto.trim().split(/\s+/).map(palavra => palavra.charAt(0).toUpperCase() + palavra.slice(1).toLowerCase()).join(" ");
}
function garantirColaboradoresPadrao(){
  const setoresNomes = [...new Set(COLABORADORES_PADRAO_BIOSYN.map(([,setor])=>setor))];
  let setoresAlterados = false;
  setoresNomes.forEach(nomeSetor => {
    if (!DB.setores.some(s => s.nome.trim().toLowerCase()===nomeSetor.toLowerCase())){
      DB.setores.push({ id: uid(), nome: nomeSetor, responsavelId:"", escopo:[...ALL_ROOM_IDS], salaBase:"" });
      setoresAlterados = true;
    }
  });
  if (setoresAlterados) persist("setores");

  const setorIdPorNome = {};
  DB.setores.forEach(s => { setorIdPorNome[s.nome.trim().toLowerCase()] = s.id; });

  let colaboradoresAlterados = false;
  COLABORADORES_PADRAO_BIOSYN.forEach(([nome, nomeSetor]) => {
    const nomeFormatado = paraNomeProprio(nome);
    if (!DB.colaboradores.some(c => c.nome.trim().toLowerCase()===nome.toLowerCase())){
      DB.colaboradores.push({ id: uid(), nome: nomeFormatado, setorId: setorIdPorNome[nomeSetor.toLowerCase()]||"", escopo:[...ALL_ROOM_IDS] });
      colaboradoresAlterados = true;
    }
  });
  if (colaboradoresAlterados) persist("colaboradores");
}
function corrigirCapitalizacaoColaboradoresPadrao(){
  const nomesOriginais = new Set(COLABORADORES_PADRAO_BIOSYN.map(([nome]) => nome.trim().toLowerCase()));
  let alterou = false;
  DB.colaboradores = DB.colaboradores.map(c => {
    if (nomesOriginais.has(c.nome.trim().toLowerCase()) && c.nome !== paraNomeProprio(c.nome)){
      alterou = true;
      return { ...c, nome: paraNomeProprio(c.nome) };
    }
    return c;
  });
  if (alterou) persist("colaboradores");
}

function garantirMateriaisEMisturasFinasPadrao(){
  let materiaisAlterados = false;
  MATERIAIS_PADRAO_MISTURA_FINA.forEach(([codigo, nome]) => {
    if (!DB.materiais.some(m => m.codigo.trim().toLowerCase()===codigo.toLowerCase())){
      DB.materiais.push({
        id: uid(), codigo, codigoBarras: codigo, nome,
        categoria: "", unidade: "g", estoqueMinimo: 0, estoqueAtual: 0,
        observacao: "", escopo: [...ALL_ROOM_IDS],
      });
      materiaisAlterados = true;
    }
  });
  if (materiaisAlterados) persist("materiais");

  const setorPadrao = setorHomeDaSala("mistura_fina") || DB.setores[0];
  const materialIdPorNome = {};
  DB.materiais.forEach(m => { materialIdPorNome[m.nome.trim().toLowerCase()] = m.id; });

  let misturasAlteradas = false;
  MISTURAS_FINAS_PADRAO_BIOSYN.forEach(mf => {
    if (DB.misturasFinas.some(x => x.codigo.trim().toLowerCase()===mf.codigo.toLowerCase())) return;
    const ingredientes = mf.ingredientes
      .map(([nomeIng, pct]) => ({ materialId: materialIdPorNome[nomeIng.trim().toLowerCase()], percentual: pct }))
      .filter(i => i.materialId);
    if (ingredientes.length===0) return;
    const materialProduzidoId = sincronizarMaterialDaMistura(null, mf.nome, "g", mf.codigo);
    DB.misturasFinas.push({
      id: uid(), nome: mf.nome, codigo: mf.codigo, setorId: setorPadrao?.id || "",
      unidade: "g", materialProduzidoId, ingredientes, observacao: "",
      escopo: [...ALL_ROOM_IDS],
    });
    misturasAlteradas = true;
  });
  if (misturasAlteradas) persist("misturasFinas");
}
function corrigirUnidadeCategoriaPadraoBiosyn(){
  const codigosMateriais = new Set(MATERIAIS_PADRAO_MISTURA_FINA.map(([codigo]) => codigo));
  const codigosMisturas = new Set(MISTURAS_FINAS_PADRAO_BIOSYN.map(mf => mf.codigo));
  const idsSemiacabadosPadrao = new Set(DB.misturasFinas.filter(mf => codigosMisturas.has(mf.codigo)).map(mf => mf.materialProduzidoId));

  let materiaisAlterados = false;
  DB.materiais = DB.materiais.map(m => {
    if (codigosMateriais.has(m.codigo) && m.unidade==="kg" && m.categoria==="Insumo de Mistura"){
      materiaisAlterados = true;
      return { ...m, unidade: "g", categoria: "" };
    }
    if (idsSemiacabadosPadrao.has(m.id) && m.unidade==="kg"){
      materiaisAlterados = true;
      return { ...m, unidade: "g" };
    }
    return m;
  });
  if (materiaisAlterados) persist("materiais");

  let misturasAlteradas = false;
  DB.misturasFinas = DB.misturasFinas.map(mf => {
    if (codigosMisturas.has(mf.codigo) && mf.unidade==="kg"){
      misturasAlteradas = true;
      return { ...mf, unidade: "g" };
    }
    return mf;
  });
  if (misturasAlteradas) persist("misturasFinas");
}

function recarregarInventarioInicialMF(){
  // remove os lançamentos do inventário anterior, revertendo o efeito no estoque,
  // para então recarregar a versão atualizada (quantidades revisadas + validades)
  const antigos = DB.movimentos.filter(m => m.inventarioInicial);
  if (antigos.length > 0){
    const deltaPorMaterial = {};
    antigos.forEach(m => { if (m.delta) deltaPorMaterial[m.materialId] = round3((deltaPorMaterial[m.materialId]||0) - m.delta); });
    DB.materiais = DB.materiais.map(m => deltaPorMaterial[m.id] ? {...m, estoqueAtual: round3((m.estoqueAtual||0)+deltaPorMaterial[m.id])} : m);
    DB.movimentos = DB.movimentos.filter(m => !m.inventarioInicial);
    persist("materiais");
    persist("movimentos");
  }
  garantirInventarioInicialMF();
}
function garantirInventarioInicialMF(){
  const tipoEntrada = DB.tipos.find(t => t.nome==="Entrada por Recebimento Almox.");
  if (!tipoEntrada) return;
  const setorBase = setorHomeDaSala("mistura_fina") || DB.setores[0];
  const materialPorCodigo = {};
  DB.materiais.forEach(m => { materialPorCodigo[String(m.codigo).trim()] = m; });

  const agora = new Date().toISOString();
  const dataInventario = todayISO();
  const novosRegistros = [];
  const deltaPorMaterial = {};

  INVENTARIO_INICIAL_MF.forEach(([codigo, lote, quantidade, validade]) => {
    const material = materialPorCodigo[codigo];
    if (!material) return;
    // não duplica: se já existe uma entrada de inventário para este material+lote, pula
    const jaExiste = DB.movimentos.some(m => m.materialId===material.id && m.lote===lote && m.inventarioInicial);
    if (jaExiste) return;
    novosRegistros.push({
      id: uid(), producaoId: null, misturaFinaId: null,
      data: dataInventario, materialId: material.id, tipoMovimentoId: tipoEntrada.id,
      setorId: setorBase?.id || "", quantidade, delta: quantidade,
      lote, validade: validade || "", documento: "", observacao: "Inventário inicial.",
      escopo: [...ALL_ROOM_IDS], colaboradorId: "",
      assinaturaOperador: null, assinadoEmOperador: null,
      assinatura: null, assinadoEm: null,
      inventarioInicial: true,
      criadoEm: agora,
    });
    deltaPorMaterial[material.id] = round3((deltaPorMaterial[material.id]||0) + quantidade);
  });

  if (novosRegistros.length===0) return;
  DB.movimentos = [...novosRegistros, ...DB.movimentos];
  DB.materiais = DB.materiais.map(m => deltaPorMaterial[m.id] ? {...m, estoqueAtual: round3((m.estoqueAtual||0)+deltaPorMaterial[m.id])} : m);
  persist("materiais");
  persist("movimentos");
}

async function loadAll(){
  const keys = ["materiais","categorias","unidades","setores","tipos","movimentos","colaboradores","misturasFinas"];
  for (const key of keys){
    const res = await storageGet(`${STORAGE_PREFIX}:${key}`);
    if (res && res.value){
      try { DB[key] = JSON.parse(res.value); } catch(e){ DB[key] = defaultFor(key); }
    } else {
      DB[key] = defaultFor(key);
    }
  }
  // normaliza materiais antigos: garante o campo separado de código de barras
  DB.materiais = DB.materiais.map(m => ({ codigoBarras: "", ...m }));
  // normaliza setores antigos: garante o campo de setor-base da sala e de responsável (colaborador)
  DB.setores = DB.setores.map(s => ({ salaBase: "", responsavelId: "", ...s }));

  // migração: garante a lista padrão de setores e colaboradores da Biosyn
  const colaboradoresPadraoMarcador = await storageGet(`${STORAGE_PREFIX}:colaboradores_padrao_biosyn_v1`);
  if (!colaboradoresPadraoMarcador){
    garantirColaboradoresPadrao();
    storageSet(`${STORAGE_PREFIX}:colaboradores_padrao_biosyn_v1`, "1");
  }

  // migração: corrige capitalização dos colaboradores padrão já inseridos em maiúsculas
  const capitalizacaoMarcador = await storageGet(`${STORAGE_PREFIX}:colaboradores_capitalizacao_v1`);
  if (!capitalizacaoMarcador){
    corrigirCapitalizacaoColaboradoresPadrao();
    storageSet(`${STORAGE_PREFIX}:colaboradores_capitalizacao_v1`, "1");
  }

  // migração: garante os materiais e misturas finas padrão da Biosyn
  const materiaisMisturasPadraoMarcador = await storageGet(`${STORAGE_PREFIX}:materiais_misturas_padrao_biosyn_v1`);
  if (!materiaisMisturasPadraoMarcador){
    garantirMateriaisEMisturasFinasPadrao();
    storageSet(`${STORAGE_PREFIX}:materiais_misturas_padrao_biosyn_v1`, "1");
  }

  // migração: corrige unidade (kg → g) e limpa categoria dos materiais/misturas padrão já inseridos
  const unidadeCategoriaCorrecaoMarcador = await storageGet(`${STORAGE_PREFIX}:materiais_padrao_unidade_g_v1`);
  if (!unidadeCategoriaCorrecaoMarcador){
    corrigirUnidadeCategoriaPadraoBiosyn();
    storageSet(`${STORAGE_PREFIX}:materiais_padrao_unidade_g_v1`, "1");
  }

  // migração: carrega o inventário inicial como entradas por recebimento do almoxarifado
  const inventarioInicialMarcador = await storageGet(`${STORAGE_PREFIX}:inventario_inicial_mf_v1`);
  if (!inventarioInicialMarcador){
    garantirInventarioInicialMF();
    storageSet(`${STORAGE_PREFIX}:inventario_inicial_mf_v1`, "1");
  }

  // migração: recarrega o inventário com as quantidades revisadas e as datas de validade
  const inventarioV2Marcador = await storageGet(`${STORAGE_PREFIX}:inventario_mf_validades_v2`);
  if (!inventarioV2Marcador){
    recarregarInventarioInicialMF();
    storageSet(`${STORAGE_PREFIX}:inventario_mf_validades_v2`, "1");
  }

  // migração: complementa os 7 materiais que faltavam no cadastro e suas entradas de inventário
  const inventarioComplementoMarcador = await storageGet(`${STORAGE_PREFIX}:inventario_complemento_7_itens_v1`);
  if (!inventarioComplementoMarcador){
    garantirMateriaisEMisturasFinasPadrao();
    garantirInventarioInicialMF();
    storageSet(`${STORAGE_PREFIX}:inventario_complemento_7_itens_v1`, "1");
  }

  await tentarRestaurarArquivoDados();

  // migração: padroniza o catálogo de unidades de medida (instalações já existentes)
  const unidadesPadraoMarcador = await storageGet(`${STORAGE_PREFIX}:unidades_padrao_v2`);
  if (!unidadesPadraoMarcador){
    DB.unidades = seedUnidades();
    persist("unidades");
    storageSet(`${STORAGE_PREFIX}:unidades_padrao_v2`, "1");
  }

  // migração: substitui o catálogo de categorias pelo novo padrão (Controlados x EPIs)
  const categoriasPadraoMarcador = await storageGet(`${STORAGE_PREFIX}:categorias_padrao_v3`);
  if (!categoriasPadraoMarcador){
    DB.categorias = seedCategorias();
    persist("categorias");
    storageSet(`${STORAGE_PREFIX}:categorias_padrao_v3`, "1");
  }

  // migração: garante a categoria "Semiacabado" (usada pelos materiais gerados a partir de Misturas Finas)
  const categoriaSemiacabadoMarcador = await storageGet(`${STORAGE_PREFIX}:categoria_semiacabado_v1`);
  if (!categoriaSemiacabadoMarcador){
    if (!DB.categorias.some(c => c.nome==="Semiacabado")){
      DB.categorias.push({ id: uid(), nome:"Semiacabado", escopo:[...ALL_ROOM_IDS] });
      persist("categorias");
    }
    storageSet(`${STORAGE_PREFIX}:categoria_semiacabado_v1`, "1");
  }

  // migração: garante um setor definido em misturas finas já cadastradas sem essa informação
  const misturaSetorMarcador = await storageGet(`${STORAGE_PREFIX}:mistura_setor_v1`);
  if (!misturaSetorMarcador){
    const setorPadrao = setorHomeDaSala("mistura_fina") || DB.setores[0];
    if (setorPadrao && DB.misturasFinas.some(mf => !mf.setorId)){
      DB.misturasFinas = DB.misturasFinas.map(mf => mf.setorId ? mf : { ...mf, setorId: setorPadrao.id });
      persist("misturasFinas");
    }
    storageSet(`${STORAGE_PREFIX}:mistura_setor_v1`, "1");
  }

  // migração: receita passa a usar percentual do total em vez de quantidade fixa por rendimento padrão
  const misturaPercentualMarcador = await storageGet(`${STORAGE_PREFIX}:mistura_percentual_v1`);
  if (!misturaPercentualMarcador){
    let alterou = false;
    DB.misturasFinas = DB.misturasFinas.map(mf => {
      const precisaConverter = (mf.ingredientes||[]).some(ing => ing.percentual===undefined && ing.quantidade!==undefined);
      if (!precisaConverter) return mf;
      alterou = true;
      const totalQuantidade = mf.ingredientes.reduce((acc,ing)=>acc+(Number(ing.quantidade)||0),0);
      const base = mf.rendimentoPadrao > 0 ? mf.rendimentoPadrao : totalQuantidade;
      const ingredientes = mf.ingredientes.map(ing => ({
        materialId: ing.materialId,
        percentual: base>0 ? round3((Number(ing.quantidade)||0)/base*100) : 0,
      }));
      const { rendimentoPadrao, ...resto } = mf;
      return { ...resto, ingredientes };
    });
    if (alterou) persist("misturasFinas");
    storageSet(`${STORAGE_PREFIX}:mistura_percentual_v1`, "1");
  }

  // migração: garante código de barras em materiais já cadastrados (necessário para confirmação por leitura na pesagem)
  const codigoBarrasMarcador = await storageGet(`${STORAGE_PREFIX}:materiais_codigo_barras_v1`);
  if (!codigoBarrasMarcador){
    if (DB.materiais.some(m => !m.codigoBarras)){
      DB.materiais = DB.materiais.map(m => m.codigoBarras ? m : { ...m, codigoBarras: gerarCodigoBarrasUnico() });
      persist("materiais");
    }
    storageSet(`${STORAGE_PREFIX}:materiais_codigo_barras_v1`, "1");
  }

  // migração: renomeia o tipo de movimento antigo, preservando id e histórico
  let tiposAlterados = false;
  DB.tipos = DB.tipos.map(t => {
    if (t.nome === "Saída por Dispensação/Uso" || t.nome === "Saída por Dispensação"){
      tiposAlterados = true;
      return { ...t, nome: "Saída por Utilização" };
    }
    return t;
  });
  if (tiposAlterados) persist("tipos");

  // migração: remove o tipo "Entrega Individual" (não usado neste painel), quando não houver histórico vinculado
  const removerEntregaMarcador = await storageGet(`${STORAGE_PREFIX}:remover_entrega_individual_v1`);
  if (!removerEntregaMarcador){
    const tiposEntrega = DB.tipos.filter(t => isEntregaIndividual(t));
    const temHistorico = DB.movimentos.some(m => tiposEntrega.some(t => t.id === m.tipoMovimentoId));
    if (tiposEntrega.length > 0 && !temHistorico){
      DB.tipos = DB.tipos.filter(t => !isEntregaIndividual(t));
      persist("tipos");
    }
    storageSet(`${STORAGE_PREFIX}:remover_entrega_individual_v1`, "1");
  }

  // migração: garante a existência dos tipos especiais de Produção
  const tiposProducaoMarcador = await storageGet(`${STORAGE_PREFIX}:tipos_producao_v1`);
  if (!tiposProducaoMarcador){
    if (!DB.tipos.some(t => t.especial==="producao_entrada")){
      DB.tipos.push({ id: uid(), nome:"Produção - Semiacabado Produzido", efeito:"entrada", escopo:[...ALL_ROOM_IDS], especial:"producao_entrada" });
    }
    if (!DB.tipos.some(t => t.especial==="producao_consumo")){
      DB.tipos.push({ id: uid(), nome:"Produção - Consumo de Ingrediente", efeito:"saida", escopo:[...ALL_ROOM_IDS], especial:"producao_consumo" });
    }
    persist("tipos");
    storageSet(`${STORAGE_PREFIX}:tipos_producao_v1`, "1");
  }

  // migração: garante o tipo de envio imediato ao setor (semiacabado não fica em estoque)
  const tipoEnvioMarcador = await storageGet(`${STORAGE_PREFIX}:tipos_producao_envio_v1`);
  if (!tipoEnvioMarcador){
    if (!DB.tipos.some(t => t.especial==="producao_envio")){
      DB.tipos.push({ id: uid(), nome:"Produção - Envio ao Setor", efeito:"saida", escopo:[...ALL_ROOM_IDS], especial:"producao_envio" });
      persist("tipos");
    }
    storageSet(`${STORAGE_PREFIX}:tipos_producao_envio_v1`, "1");
  }

  // migração: garante o tipo de Pesagem Individual
  const tipoPesagemIndividualMarcador = await storageGet(`${STORAGE_PREFIX}:tipos_pesagem_individual_v1`);
  if (!tipoPesagemIndividualMarcador){
    if (!DB.tipos.some(t => t.especial==="pesagem_individual")){
      DB.tipos.push({ id: uid(), nome:"Pesagem Individual", efeito:"saida", escopo:[...ALL_ROOM_IDS], especial:"pesagem_individual" });
      persist("tipos");
    }
    storageSet(`${STORAGE_PREFIX}:tipos_pesagem_individual_v1`, "1");
  }

  // migração: catálogo de tipos específico do laboratório (Recebimento Almox./Produção, Reprocesso, Descarte, Ajustes)
  const tiposLaboratorioMarcador = await storageGet(`${STORAGE_PREFIX}:tipos_laboratorio_v1`);
  if (!tiposLaboratorioMarcador){
    const nomesAntigos = ["entrada por compra","entrada por devolução","saída por utilização","transf. semanal aos setores","transf. aos setores"];
    const novosNomes = [
      { nome:"Entrada por Recebimento Almox.", efeito:"entrada" },
      { nome:"Entrada por Recebimento Produção", efeito:"entrada" },
      { nome:"Entrada para Reprocesso", efeito:"entrada" },
    ];
    DB.tipos = DB.tipos.filter(t => {
      const nomeLower = String(t.nome||"").trim().toLowerCase();
      if (!nomesAntigos.includes(nomeLower)) return true;
      const temHistorico = DB.movimentos.some(m => m.tipoMovimentoId === t.id);
      return temHistorico; // mantém apenas se já tiver histórico vinculado
    });
    novosNomes.forEach(n => {
      if (!DB.tipos.some(t => String(t.nome||"").trim().toLowerCase()===n.nome.toLowerCase())){
        DB.tipos.push({ id: uid(), nome:n.nome, efeito:n.efeito, escopo:[...ALL_ROOM_IDS] });
      }
    });
    persist("tipos");
    storageSet(`${STORAGE_PREFIX}:tipos_laboratorio_v1`, "1");
  }

  // migração: todo tipo de movimento passa a ter efeito de entrada ou saída (fim de "ajuste"/"neutro")
  const tiposEfeitosMarcador = await storageGet(`${STORAGE_PREFIX}:tipos_efeitos_v3`);
  if (!tiposEfeitosMarcador){
    DB.tipos = DB.tipos.map(t => {
      if (t.nome === "Transferência entre Setores") return { ...t, nome:"Transf. Semanal aos Setores", efeito:"saida" };
      if (t.nome === "Ajuste de Inventário") return { ...t, nome:"Ajuste de Inventário - Positivo", efeito:"entrada" };
      if (t.efeito === "neutro" || t.efeito === "ajuste") return { ...t, efeito:"saida" };
      return t;
    });
    if (!DB.tipos.some(t => t.nome==="Transf. aos Setores")){
      DB.tipos.push({ id: uid(), nome:"Transf. aos Setores", efeito:"saida", escopo:[...ALL_ROOM_IDS] });
    }
    if (!DB.tipos.some(t => t.nome==="Ajuste de Inventário - Negativo")){
      DB.tipos.push({ id: uid(), nome:"Ajuste de Inventário - Negativo", efeito:"saida", escopo:[...ALL_ROOM_IDS] });
    }
    persist("tipos");
    storageSet(`${STORAGE_PREFIX}:tipos_efeitos_v3`, "1");
  }

  // migração: marca tipos de baixa interna (sem setor de destino) — usam o setor da própria sala
  const baixaInternaMarcador = await storageGet(`${STORAGE_PREFIX}:tipos_baixa_interna_v1`);
  if (!baixaInternaMarcador){
    let baixaAlterada = false;
    DB.tipos = DB.tipos.map(t => {
      if (!t.especial && NOMES_BAIXA_INTERNA.includes(String(t.nome||"").trim().toLowerCase())){
        baixaAlterada = true;
        return { ...t, especial: "baixa_interna" };
      }
      return t;
    });
    if (baixaAlterada) persist("tipos");
    storageSet(`${STORAGE_PREFIX}:tipos_baixa_interna_v1`, "1");
  }

  // migração: liga o "responsável" (texto livre) de cada setor a um colaborador cadastrado, quando possível
  const responsavelColabMarcador = await storageGet(`${STORAGE_PREFIX}:setor_responsavel_colaborador_v1`);
  if (!responsavelColabMarcador){
    DB.setores = DB.setores.map(s => {
      if (!s.responsavelId && s.responsavel){
        const match = DB.colaboradores.find(c => c.nome.trim().toLowerCase() === String(s.responsavel).trim().toLowerCase());
        if (match) return { ...s, responsavelId: match.id };
      }
      return s;
    });
    persist("setores");
    storageSet(`${STORAGE_PREFIX}:setor_responsavel_colaborador_v1`, "1");
  }

  // migração: garante a existência do setor-base da Sala de Mistura Fina
  const setoresBaseMarcador = await storageGet(`${STORAGE_PREFIX}:setores_sala_base_v1`);
  if (!setoresBaseMarcador){
    if (!DB.setores.some(s => s.salaBase === "mistura_fina")){
      DB.setores.push({ id: uid(), nome:"Sala de Mistura Fina", responsavelId:"", escopo:[...ALL_ROOM_IDS], salaBase:"mistura_fina" });
      persist("setores");
    }
    storageSet(`${STORAGE_PREFIX}:setores_sala_base_v1`, "1");
  }

  render();
}
function defaultFor(key){
  if (key==="setores") return seedSetores();
  if (key==="tipos") return seedTipos();
  if (key==="categorias") return seedCategorias();
  if (key==="unidades") return seedUnidades();
  if (key==="colaboradores") return [];
  if (key==="misturasFinas") return [];
  return [];
}
function persist(key){
  storageSet(`${STORAGE_PREFIX}:${key}`, JSON.stringify(DB[key]));
  if (DATA_FILE_HANDLE) escreverArquivoDados();
}

/* ------------------------------- arquivo de dados local (auto-save real em arquivo) ------------------------------- */
const HAS_FS_ACCESS = (typeof window.showSaveFilePicker === "function" && typeof window.showOpenFilePicker === "function");
const IDB_NAME = "biosyn_estoque_mistura_fina_fs";
const IDB_STORE = "handles";
let DATA_FILE_HANDLE = null;    // arquivo conectado e autorizado nesta sessão
let PENDING_FILE_HANDLE = null; // arquivo encontrado de uma sessão anterior, aguardando reconexão

function idbOpen(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, value){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readonly");
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function idbDelete(key){
  try{
    const db = await idbOpen();
    return new Promise((resolve) => {
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    });
  } catch(e){ /* nada a fazer */ }
}

async function tentarRestaurarArquivoDados(){
  if (!HAS_FS_ACCESS) return;
  try{
    const handle = await idbGet("dataFile");
    if (!handle) return;
    const perm = await handle.queryPermission({ mode:"readwrite" });
    if (perm === "granted") DATA_FILE_HANDLE = handle;
    else PENDING_FILE_HANDLE = handle;
  } catch(e){ /* handle inválido ou revogado — ignora */ }
}
async function reconectarArquivoDados(){
  if (!PENDING_FILE_HANDLE) return;
  try{
    const perm = await PENDING_FILE_HANDLE.requestPermission({ mode:"readwrite" });
    if (perm === "granted"){
      DATA_FILE_HANDLE = PENDING_FILE_HANDLE;
      PENDING_FILE_HANDLE = null;
      await escreverArquivoDados();
      render();
    }
  } catch(e){ alert("Não foi possível reconectar ao arquivo."); }
}
async function criarNovoArquivoDados(){
  if (!HAS_FS_ACCESS){
    alert("Este navegador não permite salvar automaticamente em arquivo (recurso disponível no Chrome ou Edge, no computador). Os dados continuam salvos automaticamente neste navegador.");
    return;
  }
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: "estoque-biosyn.json",
      types: [{ description: "Arquivo de dados do Painel de Estoque", accept: { "application/json": [".json"] } }],
    });
    DATA_FILE_HANDLE = handle;
    PENDING_FILE_HANDLE = null;
    await idbSet("dataFile", handle);
    await escreverArquivoDados();
    render();
  } catch(e){ /* usuário cancelou a seleção — nada a fazer */ }
}
async function abrirArquivoDados(){
  if (!HAS_FS_ACCESS){
    alert("Este navegador não permite abrir arquivos de dados automaticamente (recurso disponível no Chrome ou Edge, no computador).");
    return;
  }
  try{
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: "Arquivo de dados do Painel de Estoque", accept: { "application/json": [".json"] } }],
    });
    const perm = await handle.requestPermission({ mode: "readwrite" });
    if (perm !== "granted"){ alert("Permissão de leitura e escrita não concedida."); return; }
    const file = await handle.getFile();
    let data;
    try {
      data = JSON.parse(await file.text());
    } catch(parseErr){
      alert("O arquivo selecionado não é um JSON válido — ele pode estar corrompido ou não ser um arquivo de dados deste painel.");
      return;
    }
    const chaves = ["materiais","categorias","unidades","setores","tipos","movimentos","colaboradores","misturasFinas"];
    let algumaChaveEncontrada = false;
    for (const key of chaves){
      if (Array.isArray(data[key])){ DB[key] = data[key]; algumaChaveEncontrada = true; }
    }
    if (!algumaChaveEncontrada){
      alert("O arquivo selecionado não parece ser um arquivo de dados deste painel (nenhuma informação reconhecida foi encontrada nele).");
      return;
    }
    for (const key of chaves) persistLocalOnly(key);
    DATA_FILE_HANDLE = handle;
    PENDING_FILE_HANDLE = null;
    await idbSet("dataFile", handle);
    render();
  } catch(e){
    if (e && e.name !== "AbortError") alert(`Não foi possível abrir o arquivo selecionado. Detalhe técnico: ${e && e.message ? e.message : e}`);
  }
}
function persistLocalOnly(key){ storageSet(`${STORAGE_PREFIX}:${key}`, JSON.stringify(DB[key])); }
async function desconectarArquivoDados(){
  DATA_FILE_HANDLE = null;
  PENDING_FILE_HANDLE = null;
  await idbDelete("dataFile");
  render();
}
async function resetarDadosCompleto(){
  const passo1 = confirm("Isso vai apagar TODOS os dados cadastrados neste painel — materiais, misturas finas, movimentações, colaboradores e setores — e voltar às configurações padrão de fábrica. Esta ação não pode ser desfeita. Deseja continuar?");
  if (!passo1) return;
  const passo2 = confirm("Confirmação final: tem certeza que quer apagar todos os dados de teste e começar do zero?");
  if (!passo2) return;

  if (DATA_FILE_HANDLE || PENDING_FILE_HANDLE){
    await desconectarArquivoDados();
  }

  const chaves = [
    "materiais","categorias","unidades","setores","tipos","movimentos","colaboradores","misturasFinas",
    "unidades_padrao_v2","categorias_padrao_v3","categoria_semiacabado_v1",
    "setores_sala_base_v1","setor_responsavel_colaborador_v1","mistura_setor_v1","mistura_percentual_v1",
    "remover_entrega_individual_v1","tipos_producao_v1","tipos_producao_envio_v1","tipos_laboratorio_v1",
    "tipos_baixa_interna_v1","tipos_efeitos_v3","materiais_codigo_barras_v1",
  ];
  for (const k of chaves){
    await storageDelete(`${STORAGE_PREFIX}:${k}`);
  }
  alert("Dados apagados. O painel vai recarregar do zero, pronto para o uso real.");
  window.location.reload();
}
async function escreverArquivoDados(){
  if (!DATA_FILE_HANDLE) return;
  try{
    let perm = await DATA_FILE_HANDLE.queryPermission({ mode:"readwrite" });
    if (perm !== "granted") perm = await DATA_FILE_HANDLE.requestPermission({ mode:"readwrite" });
    if (perm !== "granted") return;
    const writable = await DATA_FILE_HANDLE.createWritable();
    const payload = JSON.stringify({
      materiais: DB.materiais, categorias: DB.categorias, unidades: DB.unidades,
      setores: DB.setores, tipos: DB.tipos, movimentos: DB.movimentos,
      colaboradores: DB.colaboradores, misturasFinas: DB.misturasFinas,
      salvoEm: new Date().toISOString(),
    }, null, 2);
    await writable.write(payload);
    await writable.close();
  } catch(e){ console.error("Falha ao salvar no arquivo conectado", e); }
}

/* ------------------------------- leitor de código de barras ------------------------------- */
let html5QrCode = null;
let SCANNER_CALLBACK = null;

function scannerOverlayHTML(){
  return `
  <div id="scannerOverlay" style="display:none; position:fixed; inset:0; background:rgba(6,26,51,.75); z-index:1000; align-items:center; justify-content:center; padding:16px;">
    <div style="background:#fff; border-radius:12px; padding:18px; width:min(420px,94vw); box-shadow:0 12px 40px rgba(0,0,0,.35);">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <strong style="color:var(--navy); font-size:14px;">Escanear código de barras</strong>
        <button class="sc-iconbtn" onclick="closeScanner()">${icon("x",14)}</button>
      </div>
      <div id="scannerRegion" style="width:100%; border-radius:8px; overflow:hidden; background:#000; min-height:220px;"></div>
      <div class="sc-hint" style="margin-top:10px;">Aponte a câmera para o código de barras do material. É necessário permitir o acesso à câmera do dispositivo.</div>
      <div id="scannerError"></div>
      <div style="border-top:1px solid var(--line); margin-top:14px; padding-top:12px;">
        <div class="sc-hint" style="margin-bottom:6px;">Câmera indisponível ou código danificado? Digite manualmente:</div>
        <div style="display:flex; gap:6px;">
          <input class="sc-input" id="scannerManualInput" placeholder="Digite o código de barras" onkeydown="if(event.key==='Enter'){event.preventDefault();confirmarCodigoManual();}">
          <button class="sc-btn sc-btn-primary" onclick="confirmarCodigoManual()">Usar</button>
        </div>
      </div>
    </div>
  </div>`;
}

function openScanner(callback){
  SCANNER_CALLBACK = callback;
  const overlay = document.getElementById("scannerOverlay");
  if (!overlay) return;
  overlay.style.display = "flex";
  const errBox = document.getElementById("scannerError");
  if (errBox) errBox.innerHTML = "";
  const manualInput = document.getElementById("scannerManualInput");
  if (manualInput){
    manualInput.value = "";
    manualInput.focus();
  }
  requestAnimationFrame(() => {
    if (typeof Html5Qrcode === "undefined"){
      if (errBox) errBox.innerHTML = `<div class="sc-error">${icon("alert",14)} Não foi possível carregar o leitor de código de barras. Verifique sua conexão com a internet.</div>`;
      return;
    }
    try{
      html5QrCode = new Html5Qrcode("scannerRegion", {
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.ITF, Html5QrcodeSupportedFormats.QR_CODE,
        ],
      });
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 260, height: 160 } },
        (decodedText) => handleScanSuccess(decodedText),
        () => {}
      ).catch(() => {
        if (errBox) errBox.innerHTML = `<div class="sc-error">${icon("alert",14)} Não foi possível acessar a câmera. Verifique as permissões do navegador.</div>`;
      });
    } catch(e){
      if (errBox) errBox.innerHTML = `<div class="sc-error">${icon("alert",14)} Leitor de código de barras indisponível neste navegador.</div>`;
    }
  });
}
function closeScanner(){
  const overlay = document.getElementById("scannerOverlay");
  if (overlay) overlay.style.display = "none";
  if (html5QrCode){
    html5QrCode.stop().then(() => html5QrCode.clear()).catch(() => {});
    html5QrCode = null;
  }
}
function handleScanSuccess(decodedText){
  const cb = SCANNER_CALLBACK;
  closeScanner();
  if (cb) cb(decodedText);
}
function confirmarCodigoManual(){
  const input = document.getElementById("scannerManualInput");
  const code = (input?.value || "").trim();
  if (!code){
    const errBox = document.getElementById("scannerError");
    if (errBox) errBox.innerHTML = `<div class="sc-error">${icon("alert",14)} Digite o código de barras antes de confirmar.</div>`;
    return;
  }
  handleScanSuccess(code);
}
function scanForMaterialCodigo(){
  openScanner((text) => {
    const el = document.getElementById("f_codigoBarras");
    if (el) el.value = text;
  });
}
function scanForMovMaterial(){
  openScanner((text) => {
    const el = document.getElementById("mv_codigoBusca");
    if (el) el.value = text;
    buscarMaterialPorCodigo();
  });
}
function buscarMaterialPorCodigo(){
  const code = (document.getElementById("mv_codigoBusca")?.value || "").trim();
  const msgWrap = document.getElementById("mv_codigoMsg");
  if (!msgWrap) return;
  if (!code){ msgWrap.innerHTML = ""; return; }
  const codeLower = code.toLowerCase();
  const found = DB.materiais.find(m => (m.codigoBarras||"").trim().toLowerCase() === codeLower && inRoom(m, ROOM))
    || DB.materiais.find(m => (m.codigo||"").trim().toLowerCase() === codeLower && inRoom(m, ROOM));
  if (found){
    const sel = document.getElementById("mv_material");
    if (sel){ sel.value = found.id; onMovMaterialChange(); }
    msgWrap.innerHTML = `<div class="sc-hint">${icon("check",12)} Material localizado: <strong>${escapeHtml(found.nome)}</strong></div>`;
  } else {
    msgWrap.innerHTML = `<div class="sc-error">${icon("alert",14)} Nenhum material cadastrado com o código "${escapeHtml(code)}"${ROOM!=="todas" ? " nesta visão" : ""}.</div>`;
  }
}

/* ------------------------------- assinatura digital (mouse/touch) ------------------------------- */
let SIGNATURE_CALLBACK = null;
let sigCtx = null;
let sigDrawing = false;
let sigHasStroke = false;

function signatureOverlayHTML(){
  return `
  <div id="signatureOverlay" style="display:none; position:fixed; inset:0; background:rgba(6,26,51,.75); z-index:1000; align-items:center; justify-content:center; padding:16px;">
    <div style="background:#fff; border-radius:12px; padding:18px; width:min(480px,94vw); box-shadow:0 12px 40px rgba(0,0,0,.35);">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <strong style="color:var(--navy); font-size:14px;" id="signatureTitle">Assinatura do colaborador</strong>
        <button class="sc-iconbtn" onclick="closeSignature()">${icon("x",14)}</button>
      </div>
      <canvas id="signatureCanvas" style="width:100%; height:200px; border:1px solid var(--line); border-radius:8px; background:#fdfdfd; touch-action:none; cursor:crosshair; display:block;"></canvas>
      <div class="sc-hint" style="margin-top:8px;">Assine com o mouse ou o dedo (touch) na área acima.</div>
      <div style="display:flex; justify-content:space-between; gap:8px; margin-top:12px;">
        <button class="sc-btn sc-btn-ghost" onclick="limparAssinatura()">Limpar</button>
        <div style="display:flex; gap:8px;">
          <button class="sc-btn sc-btn-ghost" onclick="closeSignature()">Cancelar</button>
          <button class="sc-btn sc-btn-primary" onclick="confirmarAssinatura()">${icon("check",14)}<span>Confirmar assinatura</span></button>
        </div>
      </div>
    </div>
  </div>`;
}
function openSignature(title, callback){
  SIGNATURE_CALLBACK = callback;
  const overlay = document.getElementById("signatureOverlay");
  if (!overlay) return;
  const titleEl = document.getElementById("signatureTitle");
  if (titleEl) titleEl.textContent = title;
  overlay.style.display = "flex";
  requestAnimationFrame(() => {
    const canvas = document.getElementById("signatureCanvas");
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.round(rect.width));
    canvas.height = Math.max(1, Math.round(rect.height));
    sigCtx = canvas.getContext("2d");
    sigCtx.fillStyle = "#fdfdfd";
    sigCtx.fillRect(0, 0, canvas.width, canvas.height);
    sigCtx.strokeStyle = "#16233A";
    sigCtx.lineWidth = 2.2;
    sigCtx.lineCap = "round";
    sigCtx.lineJoin = "round";
    sigHasStroke = false;
    bindSignatureEvents(canvas);
  });
}
function bindSignatureEvents(canvas){
  const pos = (e) => {
    const rect = canvas.getBoundingClientRect();
    const point = e.touches && e.touches[0] ? e.touches[0] : e;
    return { x: point.clientX - rect.left, y: point.clientY - rect.top };
  };
  const start = (e) => { e.preventDefault(); sigDrawing = true; const p = pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); };
  const move = (e) => { if (!sigDrawing) return; e.preventDefault(); const p = pos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); sigHasStroke = true; };
  const end = () => { sigDrawing = false; };
  canvas.onmousedown = start; canvas.onmousemove = move; canvas.onmouseup = end; canvas.onmouseleave = end;
  canvas.ontouchstart = start; canvas.ontouchmove = move; canvas.ontouchend = end;
}
function limparAssinatura(){
  if (!sigCtx) return;
  const canvas = document.getElementById("signatureCanvas");
  sigCtx.fillStyle = "#fdfdfd";
  sigCtx.fillRect(0, 0, canvas.width, canvas.height);
  sigHasStroke = false;
}
function closeSignature(){
  const overlay = document.getElementById("signatureOverlay");
  if (overlay) overlay.style.display = "none";
  sigCtx = null;
  SIGNATURE_CALLBACK = null;
}
function confirmarAssinatura(){
  if (!sigHasStroke){ alert("Faça a assinatura na área indicada antes de confirmar."); return; }
  const canvas = document.getElementById("signatureCanvas");
  const dataUrl = canvas.toDataURL("image/png");
  const cb = SIGNATURE_CALLBACK;
  closeSignature();
  if (cb) cb(dataUrl);
}

  ROOM = r;

  render();
}

  const el = document.getElementById("mainContent");

function painelHTML(){
  const materiais = DB.materiais.filter(m => inRoom(m, ROOM) && !isSemiacabado(m));
  const movimentos = DB.movimentos.filter(m => inRoom(m, ROOM));
  const setores = DB.setores.filter(s => inRoom(s, ROOM));
  const tipoMapGeral = mapBy(DB.tipos);
  const abaixoMinimo = materiais.filter((m) => (m.estoqueAtual||0) <= (m.estoqueMinimo||0));
  const hoje = todayISO();
  const mfsProduzidasHoje = movimentos.filter(m => tipoMapGeral[m.tipoMovimentoId]?.especial==="producao_entrada" && m.data === hoje && !m.anulado);
  const ultimos = movimentos.slice(0,8);
  const materialMap = mapBy(DB.materiais), setorMap = mapBy(DB.setores), tipoMap = mapBy(DB.tipos);

  const ordemUrgencia = { vencido:0, hoje:1, critico:2, atencao:3 };
  const alertasValidade = materiais
    .map(m => ({ m, c: piorValidadeMaterial(m.id) }))
    .filter(x => x.c && ordemUrgencia.hasOwnProperty(x.c.status))
    .sort((a,b) => ordemUrgencia[a.c.status]-ordemUrgencia[b.c.status]);

  const pendentesAssinatura = movimentos.filter(m => tipoMapGeral[m.tipoMovimentoId]?.especial==="producao_entrada" && !m.assinatura && !m.anulado).length;
  const lotesFaltandoMateriais = movimentos.filter(m => tipoMapGeral[m.tipoMovimentoId]?.especial==="producao_entrada" && m.pendenteMateriais && !m.anulado);

  const cards = `
  <div class="sc-cards">
    <button class="sc-stat" onclick="nav('materiais')"><div class="sc-stat-value">${materiais.length}</div><div class="sc-stat-label">Materiais em Estoque</div></button>
    <button class="sc-stat" onclick="nav('itens_produzidos')"><div class="sc-stat-value">${mfsProduzidasHoje.length}</div><div class="sc-stat-label">MFs produzidas hoje</div></button>
    <button class="sc-stat ${abaixoMinimo.length>0?"is-alert":""}" onclick="nav('estoques')"><div class="sc-stat-value">${abaixoMinimo.length}</div><div class="sc-stat-label">Abaixo do mínimo</div></button>
    <button class="sc-stat ${alertasValidade.length>0?"is-alert":""}" onclick="nav('estoques')"><div class="sc-stat-value">${alertasValidade.length}</div><div class="sc-stat-label">Alertas de validade</div></button>
    <button class="sc-stat ${pendentesAssinatura>0?"is-alert":""}" onclick="nav('itens_produzidos')"><div class="sc-stat-value">${pendentesAssinatura}</div><div class="sc-stat-label">Assinaturas pendentes</div></button>
  </div>`;

  let alertProducaoPendenteSection = "";
  if (lotesFaltandoMateriais.length>0){
    const misturaMapPainel = mapBy(DB.misturasFinas);
    alertProducaoPendenteSection = sectionHTML("MFs faltando materiais","alert","", `
      <div class="sc-tablewrap"><table class="sc-table">
        <thead><tr><th>Mistura Fina</th><th>Lote</th><th>Data</th><th>Materiais faltando</th></tr></thead>
        <tbody>${lotesFaltandoMateriais.map(m=>`
          <tr><td>${escapeHtml(misturaMapPainel[m.misturaFinaId]?.nome||"—")}</td>
          <td class="mono">${escapeHtml(m.lote||"—")}</td>
          <td class="mono">${fmtDate(m.data)}</td>
          <td>${escapeHtml((m.ingredientesFaltantes||[]).join(", "))}</td></tr>`).join("")}
        </tbody></table></div>`);
  }

  let alertEstoqueSection = "";
  if (abaixoMinimo.length>0){
    alertEstoqueSection = sectionHTML("Alertas de estoque baixo","alert","", `
      <div class="sc-tablewrap"><table class="sc-table">
        <thead><tr><th>Material</th><th>Categoria</th><th class="num">Estoque</th><th class="num">Mínimo</th></tr></thead>
        <tbody>${abaixoMinimo.map(m=>`
          <tr><td>${escapeHtml(m.nome)}</td><td>${escapeHtml(m.categoria)}</td>
          <td class="num stamp-red mono">${fmtNum(m.estoqueAtual)} ${escapeHtml(m.unidade)}</td>
          <td class="num mono">${fmtNum(m.estoqueMinimo)} ${escapeHtml(m.unidade)}</td></tr>`).join("")}
        </tbody></table></div>`);
  }

  let alertValidadeSection = "";
  if (alertasValidade.length>0){
    alertValidadeSection = sectionHTML("Alertas de validade","alert","", `
      <div class="sc-tablewrap"><table class="sc-table">
        <thead><tr><th>Material</th><th>Categoria</th><th class="num">Estoque</th><th>Situação</th></tr></thead>
        <tbody>${alertasValidade.map(({m,c})=>`
          <tr><td>${escapeHtml(m.nome)}</td><td>${escapeHtml(m.categoria)}</td>
          <td class="num mono">${fmtNum(m.estoqueAtual)} ${escapeHtml(m.unidade)}</td>
          <td>${validadeBadgeFromClass(c)}</td></tr>`).join("")}
        </tbody></table></div>`);
  }

  const ultimosBody = ultimos.length===0 ? emptyHTML("Nenhuma movimentação registrada ainda nesta visão. Abra “Movimentações” para lançar a primeira entrada ou saída.") : `
    <div class="sc-tablewrap"><table class="sc-table">
      <thead><tr><th>Data</th><th>Material</th><th>Tipo</th><th>Setor</th><th class="num">Qtd.</th></tr></thead>
      <tbody>${ultimos.map(m=>`
        <tr><td class="mono">${fmtDate(m.data)}</td><td>${escapeHtml(materialMap[m.materialId]?.nome||"—")}</td>
        <td>${efeitoTagHTML(tipoMap[m.tipoMovimentoId])}</td><td>${escapeHtml(setorMap[m.setorId]?.nome||"—")}</td>
        <td class="num mono">${fmtNum(m.quantidade)}</td></tr>`).join("")}

  return pageHTML("Painel", `Visão geral do dia<span class="sc-roomchip">${icon(roomIcon(ROOM),11)} ${roomLabel(ROOM)}</span>`, "", `
    ${cards}
    ${alertProducaoPendenteSection}
    ${alertEstoqueSection}
    ${alertValidadeSection}
    ${sectionHTML("Últimas movimentações","clipboard","", ultimosBody)}
  `);
}

function materiaisHTML(){

      <select class="sc-input" id="materiaisOrdenar" onchange="renderMateriaisTable()" style="max-width:200px;">
        <option value="nome_asc">Nome (A-Z)</option>

function filterMateriaisList(){
  const q = (document.getElementById("materiaisSearch")?.value || "").toLowerCase();
  const categoria = document.getElementById("materiaisFiltroCategoria")?.value || "";
  const ordenar = document.getElementById("materiaisOrdenar")?.value || "nome_asc";
  let lista = DB.materiais.filter(m => {
    if (isSemiacabado(m)) return false;
    if (categoria && m.categoria !== categoria) return false;
    return `${m.codigo} ${m.codigoBarras} ${m.nome} ${m.categoria}`.toLowerCase().includes(q);
  });
  const cmp = {
    nome_asc: (a,b)=>a.nome.localeCompare(b.nome),
    nome_desc: (a,b)=>b.nome.localeCompare(a.nome),
    codigo_asc: (a,b)=>(a.codigo||"").localeCompare(b.codigo||"", undefined, {numeric:true}),
    estoque_desc: (a,b)=>(b.estoqueAtual||0)-(a.estoqueAtual||0),
    estoque_asc: (a,b)=>(a.estoqueAtual||0)-(b.estoqueAtual||0),
  }[ordenar];
  return lista.slice().sort(cmp);
}
function renderMateriaisTable(){
  const wrap = document.getElementById("materiaisTableWrap");
  if (wrap) wrap.innerHTML = materiaisTableHTML(filterMateriaisList());
}

function openForm(type, editId){ OPEN_FORM = { type, editId: editId||null }; renderMain(); }
function gerarCodigoBarrasAuto(){
  let codigo = "";
  for (let i=0;i<12;i++) codigo += Math.floor(Math.random()*10);
  return codigo;
}
function gerarCodigoBarrasUnico(){
  let codigo;
  do { codigo = gerarCodigoBarrasAuto(); } while (DB.materiais.some(m=>m.codigoBarras===codigo));
  return codigo;
}
function gerarCodigoBarrasParaMaterial(){
  const el = document.getElementById("f_codigoBarras");
  if (el) el.value = gerarCodigoBarrasUnico();
}
function saveMaterial(editId){
  const nome = document.getElementById("f_nome").value.trim();
  if (!nome){ alert("Informe o nome do material."); return; }
  const codigo = document.getElementById("f_codigo").value.trim();
  if (!codigo){ alert("Informe o código do material."); return; }
  const duplicadoCodigo = DB.materiais.find(m => m.codigo.trim().toLowerCase()===codigo.toLowerCase() && m.id!==editId);
  if (duplicadoCodigo){ alert(`Já existe um material com esse código: ${duplicadoCodigo.nome}.`); return; }
  const codigoBarras = document.getElementById("f_codigoBarras").value.trim();
  if (!codigoBarras){ alert("Informe ou gere o código de barras do material — ele será usado para confirmar o item na hora da pesagem."); return; }
  const duplicado = DB.materiais.find(m => m.codigoBarras===codigoBarras && m.id!==editId);
  if (duplicado){ alert(`Já existe um material com esse código de barras: ${duplicado.nome}.`); return; }
  const data = {
    codigo,
    codigoBarras,
    nome,
    categoria: document.getElementById("f_categoria").value,
    unidade: document.getElementById("f_unidade").value,
    estoqueMinimo: Number(document.getElementById("f_min").value)||0,
    escopo: [...ALL_ROOM_IDS],
    observacao: document.getElementById("f_obs").value.trim(),
  };
  if (editId){
    DB.materiais = DB.materiais.map(m => m.id===editId ? { ...m, ...data } : m);
  } else {
    data.estoqueAtual = 0;
    DB.materiais.push({ id: uid(), ...data });
  }
  persist("materiais");
  OPEN_FORM = null;
  render();
}
function deleteMaterial(id){
  if (!confirm("Excluir este material do cadastro? O histórico de movimentações existente será mantido.")) return;
  DB.materiais = DB.materiais.filter(m=>m.id!==id);
  persist("materiais");
  render();
}
function imprimirEtiquetaMaterialCadastro(materialId){
  const material = DB.materiais.find(m=>m.id===materialId);
  if (!material){ alert("Material não encontrado."); return; }
  if (!material.codigoBarras){ alert("Este material não tem código de barras cadastrado. Gere um na tela de edição antes de imprimir a etiqueta."); return; }

  const html = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Etiqueta — ${escapeHtml(material.nome)}</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.12.3/JsBarcode.all.min.js"><\/script>
<style>
  * { box-sizing: border-box; }
  @page { size: 6cm 3.6cm; margin: 0; }
  body{ font-family: Arial, Helvetica, sans-serif; color:#16233A; margin:0; background:#e9edf2; }
  .etiqueta{
    width:6cm; height:3.6cm; padding:2mm 3mm; border:1px solid #999;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    overflow:hidden; background:#fff; margin:6px auto;
  }
  .et-marca{ font-size:6px; letter-spacing:.4px; color:#666; line-height:1; }
  .et-nome{ font-size:9px; font-weight:bold; margin-top:1mm; line-height:1.15; max-height:2.3em; overflow:hidden; }
  .et-codigo{ font-size:6.5px; color:#555; margin-top:0.5mm; }
  svg{ width:100%; max-height:1.4cm; margin-top:1mm; }
  .no-print{ margin:14px auto; text-align:center; }
  .no-print button{ padding:9px 18px; font-size:13px; cursor:pointer; border-radius:6px; border:1px solid #173a7a; background:#173a7a; color:#fff; }
  @media print {
    .no-print{ display:none; }
    body{ background:#fff; }
    .etiqueta{ border:none; margin:0; }
  }
</style></head><body>
  <div class="etiqueta">
    <div class="et-marca">BIOSYN · MISTURA FINA</div>
    <div class="et-nome">${escapeHtml(material.nome)}</div>
    <div class="et-codigo">${escapeHtml(material.codigo||"")}</div>
    <svg id="barcode"></svg>
    <div id="barcodeErro" style="display:none; color:#b3261e; font-size:8px; margin-top:1mm;"></div>
  </div>
  <div class="no-print"><button onclick="window.print()">Imprimir</button></div>
  <script>
    window.onload = function(){
      var erroBox = document.getElementById("barcodeErro");
      try {
        if (typeof JsBarcode === "undefined") throw new Error("Biblioteca de código de barras não carregou. Verifique sua conexão com a internet e tente novamente.");
        JsBarcode("#barcode", ${JSON.stringify(material.codigoBarras)}, { format:"CODE128", displayValue:true, fontSize:9, height:26, margin:2 });
      } catch(e){
        erroBox.style.display = "block";
        erroBox.textContent = e && e.message ? e.message : "Não foi possível gerar o código de barras.";
      }
    };
  <\/script>
</body></html>`;

  const win = window.open("", "_blank");
  if (!win){ alert("Não foi possível abrir a etiqueta. Verifique se o bloqueador de pop-ups do navegador está ativo para este site."); return; }
  win.document.open();
  win.document.write(html);
  win.document.close();
}

function filterMisturasFinasList(){
  const q = (document.getElementById("misturasSearch")?.value || "").toLowerCase();
  const setorId = document.getElementById("misturasFiltroSetor")?.value || "";
  const ordenar = document.getElementById("misturasOrdenar")?.value || "nome_asc";
  let lista = DB.misturasFinas.filter(mf => {
    if (setorId && mf.setorId !== setorId) return false;
    return `${mf.nome} ${mf.codigo}`.toLowerCase().includes(q);
  });
  const cmp = {
    nome_asc: (a,b)=>a.nome.localeCompare(b.nome),
    nome_desc: (a,b)=>b.nome.localeCompare(a.nome),
    codigo_asc: (a,b)=>(a.codigo||"").localeCompare(b.codigo||"", undefined, {numeric:true}),
    ingredientes_desc: (a,b)=>(b.ingredientes||[]).length-(a.ingredientes||[]).length,
  }[ordenar];
  return lista.slice().sort(cmp);
}

function gerarCodigoMaterialAuto(){
  return `MF-${uid().slice(0,6).toUpperCase()}`;
}
function sincronizarMaterialDaMistura(mf, nome, unidade, codigo){
  const categoriaSemiacabado = DB.categorias.some(c=>c.nome==="Semiacabado") ? "Semiacabado" : (DB.categorias[0]?.nome || "");
  if (mf && mf.materialProduzidoId){
    const existente = DB.materiais.find(m=>m.id===mf.materialProduzidoId);
    if (existente){
      DB.materiais = DB.materiais.map(m => m.id===mf.materialProduzidoId ? { ...m, nome, unidade, codigo: codigo || m.codigo } : m);
      persist("materiais");
      return mf.materialProduzidoId;
    }
  }
  const novoMaterial = {
    id: uid(), codigo: codigo || gerarCodigoMaterialAuto(), codigoBarras: gerarCodigoBarrasUnico(),
    nome, categoria: categoriaSemiacabado, unidade, estoqueMinimo: 0, estoqueAtual: 0,
    observacao: "Material gerado automaticamente a partir do cadastro de Misturas Finas.",
    escopo: [...ALL_ROOM_IDS],
  };
  DB.materiais.push(novoMaterial);
  persist("materiais");
  return novoMaterial.id;
}
function saveMisturaFina(editId){
  const nome = document.getElementById("mf_nome").value.trim();
  if (!nome){ alert("Informe o nome da mistura fina."); return; }
  const setorId = document.getElementById("mf_setor").value;
  if (!setorId){ alert("Selecione o setor desta mistura fina."); return; }
  const unidade = document.getElementById("mf_unidade").value;
  if (!unidade){ alert("Selecione a unidade de medida."); return; }
  const ingredientes = (OPEN_FORM?.ingredientesDraft||[])
    .filter(i=>i.materialId && Number(i.percentual)>0)
    .map(i=>({ materialId:i.materialId, percentual:Number(i.percentual) }));
  if (ingredientes.length===0){ alert("Adicione ao menos um ingrediente com percentual maior que zero."); return; }
  const totalPercentual = round3(ingredientes.reduce((acc,i)=>acc+i.percentual,0));
  if (Math.abs(totalPercentual-100) > 0.5){
    if (!confirm(`A soma dos percentuais está em ${fmtNum(totalPercentual)}% (esperado 100%). Deseja salvar assim mesmo?`)) return;
  }
  const codigo = document.getElementById("mf_codigo").value.trim();
  if (!codigo){ alert("Informe o código da mistura fina."); return; }
  const observacao = document.getElementById("mf_obs").value.trim();

  // o código identifica a mistura fina: salvar com um código já existente atualiza aquele registro
  const mesmoCodigo = DB.misturasFinas.find(m => m.codigo.trim().toLowerCase() === codigo.toLowerCase());
  let idAlvo = editId;
  if (editId){
    if (mesmoCodigo && mesmoCodigo.id !== editId){
      alert(`Já existe uma mistura fina com o código "${codigo}" (${mesmoCodigo.nome}). Escolha outro código ou edite aquele registro.`);
      return;
    }
    if (!confirm("Você está editando uma MF já existente, seguir com a alteração?")) return;
  } else if (mesmoCodigo){
    if (!confirm("Você está editando uma MF já existente, seguir com a alteração?")) return;
    idAlvo = mesmoCodigo.id;
  }

  const mfAtual = idAlvo ? DB.misturasFinas.find(m=>m.id===idAlvo) : null;

  const materialProduzidoId = sincronizarMaterialDaMistura(mfAtual, nome, unidade, codigo);

  const data = {
    nome, codigo, setorId, unidade, materialProduzidoId, ingredientes, observacao,
    escopo: [...ALL_ROOM_IDS],
  };
  if (idAlvo) DB.misturasFinas = DB.misturasFinas.map(m=> m.id===idAlvo ? {...m, ...data} : m);
  else DB.misturasFinas.push({ id: uid(), ...data });
  persist("misturasFinas");
  OPEN_FORM = null;
  render();
}
function deleteMisturaFina(id){
  const emUso = DB.movimentos.filter(m=>m.misturaFinaId===id).length;
  if (emUso>0){ alert(`Não é possível excluir: ${emUso} produção(ões) já registrada(s) usam esta mistura fina.`); return; }
  if (!confirm("Excluir esta mistura fina e sua receita?")) return;
  DB.misturasFinas = DB.misturasFinas.filter(m=>m.id!==id);
  persist("misturasFinas");
  render();
}

/* ============================== MOVIMENTAÇÕES ============================== */
/* ------------------------------- indicadores de validade ------------------------------- */
const LIMITE_CRITICO_DIAS = 10;
const LIMITE_ATENCAO_DIAS = 45;
function classificarValidade(validadeISO){
  if (!validadeISO) return null;
  const hoje = new Date(todayISO()+"T00:00:00");
  const val = new Date(validadeISO+"T00:00:00");
  const diffDias = Math.round((val - hoje) / (1000*60*60*24));
  if (diffDias < 0) return { status:"vencido", label:`Vencido há ${Math.abs(diffDias)} dia(s)`, dias:diffDias };
  if (diffDias === 0) return { status:"hoje", label:"Vence hoje", dias:diffDias };
  if (diffDias <= LIMITE_CRITICO_DIAS) return { status:"critico", label:`Vence em ${diffDias} dia(s)`, dias:diffDias };
  if (diffDias <= LIMITE_ATENCAO_DIAS) return { status:"atencao", label:`Vence em ${diffDias} dia(s)`, dias:diffDias };
  return { status:"ok", label:`Vence em ${diffDias} dia(s)`, dias:diffDias };
}
function validadeBadgeFromClass(c){
  if (!c) return `<span class="sc-tag tag-semvalidade">Sem validade</span>`;
  const map = { vencido:"tag-vencido", hoje:"tag-hoje", critico:"tag-critico", atencao:"tag-atencao", ok:"tag-entrada" };
  return `<span class="sc-tag ${map[c.status]}">${c.label}</span>`;
}
function validadeBadgeHTML(validadeISO){
  return validadeBadgeFromClass(classificarValidade(validadeISO));
}
function piorValidadeMaterial(materialId){
  const ordem = { vencido:0, hoje:1, critico:2, atencao:3, ok:4 };
  let pior = null;
  getLotesEmEstoque(materialId).forEach(l => {
    if (!l.validade) return;
    const c = classificarValidade(l.validade);
    if (!pior || ordem[c.status] < ordem[pior.status]) pior = c;
  });
  return pior;
}
function getLotesEmEstoque(materialId){
  if (!materialId) return [];
  const tipoMap = mapBy(DB.tipos);
  const porLote = {};
  DB.movimentos
    .filter(m => m.materialId === materialId && !m.anulado)
    .slice()
    .sort((a,b) => String(a.data||"").localeCompare(String(b.data||"")))
    .forEach(m => {
      const key = (m.lote||"").trim();
      const tipo = tipoMap[m.tipoMovimentoId];
      if (!porLote[key]) porLote[key] = { lote:key, saldo:0, validade:"", documento:"" };
      const entry = porLote[key];
      if (tipo?.efeito === "entrada"){
        entry.saldo = round3(entry.saldo + m.quantidade);
        if (m.validade) entry.validade = m.validade;
        if (m.documento) entry.documento = m.documento;
      } else if (tipo?.efeito === "saida"){
        entry.saldo = round3(entry.saldo - m.quantidade);
      }
    });
  return Object.values(porLote).filter(l => l.saldo > 0.0001).sort((a,b)=> (a.lote||"").localeCompare(b.lote||""));
}
/* ------------------------------- seleção de múltiplos lotes na saída ------------------------------- */
const MAX_LOTES_POR_LANCAMENTO = 5;
let MV_LOTES_SELECIONADOS = [];
let MV_CONTINUAR_DRAFT = null; // { tipoMovimentoId, setorId, colaboradorId } | null

function calcularAlocacaoLotes(selecoes, lotesDisponiveis, qtdAlvo){
  let restante = qtdAlvo;
  const alocacoes = [];
  for (const codigo of selecoes){
    const lote = lotesDisponiveis.find(l=>l.lote===codigo);
    if (!lote) continue;
    const usado = restante <= 0 ? 0 : round3(Math.min(lote.saldo, restante));
    alocacoes.push({ ...lote, usado });
    restante = round3(Math.max(0, restante - usado));
  }
  return { alocacoes, restante };
}
function lotesSaidaRowsHTML(materialId){
  const lotesDisponiveis = getLotesEmEstoque(materialId);
  MV_LOTES_SELECIONADOS = MV_LOTES_SELECIONADOS.filter(codigo => lotesDisponiveis.some(l=>l.lote===codigo));

  if (lotesDisponiveis.length === 0){
    return `<div class="sc-hint">Nenhum lote em estoque para este material — a saída será lançada sem vínculo a um lote específico.</div>`;
  }

  const qtdAlvo = Number(document.getElementById("mv_qtd")?.value) || 0;
  const { alocacoes, restante } = calcularAlocacaoLotes(MV_LOTES_SELECIONADOS, lotesDisponiveis, qtdAlvo);

  const linhas = MV_LOTES_SELECIONADOS.map((codigo, i) => {
    const info = alocacoes[i];
    const jaEscolhidosAntes = MV_LOTES_SELECIONADOS.slice(0, i);
    const opcoes = lotesDisponiveis.filter(l => l.lote===codigo || !jaEscolhidosAntes.includes(l.lote));
    const optionsHTML = `<option value="">Selecione…</option>` + opcoes.map(l=>`<option value="${escapeHtml(l.lote)}" ${l.lote===codigo?"selected":""}>${l.lote?escapeHtml(l.lote):"(sem lote)"} — saldo ${fmtNum(l.saldo)}${l.validade?` — val. ${fmtDate(l.validade)}`:""}</option>`).join("");
    return `<div class="sc-lotrow">
      <select class="sc-input" onchange="onMovLoteRowChange(${i}, this.value)">${optionsHTML}</select>
      <span class="sc-hint">${info ? `Usando ${fmtNum(info.usado)}${info.validade?` · val. ${fmtDate(info.validade)}`:""}` : ""}</span>
    </div>`;
  });

  const restamLotes = lotesDisponiveis.some(l => !MV_LOTES_SELECIONADOS.includes(l.lote));
  if (restante > 0 && MV_LOTES_SELECIONADOS.length < MAX_LOTES_POR_LANCAMENTO && restamLotes){
    const opcoes = lotesDisponiveis.filter(l => !MV_LOTES_SELECIONADOS.includes(l.lote));
    const optionsHTML = `<option value="">Selecione o próximo lote…</option>` + opcoes.map(l=>`<option value="${escapeHtml(l.lote)}">${l.lote?escapeHtml(l.lote):"(sem lote)"} — saldo ${fmtNum(l.saldo)}${l.validade?` — val. ${fmtDate(l.validade)}`:""}</option>`).join("");
    linhas.push(`<div class="sc-lotrow">
      <select class="sc-input" onchange="onMovLoteRowChange(${MV_LOTES_SELECIONADOS.length}, this.value)">${optionsHTML}</select>
    </div>`);
  }

  const aviso = (restante > 0 && MV_LOTES_SELECIONADOS.length >= MAX_LOTES_POR_LANCAMENTO)
    ? `<div class="sc-error">${icon("alert",14)} Os lotes selecionados somam ${fmtNum(round3(qtdAlvo-restante))}; faltam ${fmtNum(restante)} para completar a quantidade informada (máximo de ${MAX_LOTES_POR_LANCAMENTO} lotes por lançamento).</div>`
    : "";

  return `<div style="display:flex; flex-direction:column; gap:8px;">${linhas.join("")}</div>${aviso}`;
}
function onMovLoteRowChange(index, value){
  MV_LOTES_SELECIONADOS = MV_LOTES_SELECIONADOS.slice(0, index);
  if (value) MV_LOTES_SELECIONADOS.push(value);
  refreshLoteFields();
}

function submitMovimento(continuar){
  const materialId = document.getElementById("mv_material").value;
  const tipoMovimentoId = document.getElementById("mv_tipo").value;
  const setorId = document.getElementById("mv_setor")?.value || "";
  const errWrap = document.getElementById("mv_errorWrap");
  errWrap.innerHTML = "";
  if (!materialId || !tipoMovimentoId || !setorId){
    errWrap.innerHTML = `<div class="sc-error">${icon("alert",14)} Selecione material, tipo de movimento e setor.</div>`;
    return;
  }
  const qtd = Number(document.getElementById("mv_qtd").value);
  if (!qtd || qtd<=0){
    errWrap.innerHTML = `<div class="sc-error">${icon("alert",14)} Informe uma quantidade maior que zero.</div>`;
    return;
  }
  const tipo = DB.tipos.find(t=>t.id===tipoMovimentoId);
  const material = DB.materiais.find(m=>m.id===materialId);
  if (tipo?.efeito==="saida" && material && qtd > (material.estoqueAtual||0)){
    errWrap.innerHTML = `<div class="sc-error">${icon("alert",14)} Estoque insuficiente. Disponível: ${fmtNum(material.estoqueAtual)} ${escapeHtml(material.unidade)}.</div>`;
    return;
  }

  const colaboradorId = document.getElementById("mv_colaborador").value;
  if (isEntregaIndividual(tipo) && !colaboradorId){
    errWrap.innerHTML = `<div class="sc-error">${icon("alert",14)} Selecione o colaborador para a Entrega Individual.</div>`;
    return;
  }

  const escopoMov = ROOM==="todas" ? [...ALL_ROOM_IDS] : [ROOM];
  const dataMov = document.getElementById("mv_data").value || todayISO();
  const documento = document.getElementById("mv_doc").value.trim();
  const observacao = document.getElementById("mv_obs").value.trim();

  const baseRegistro = {
    data: dataMov, materialId, tipoMovimentoId, setorId, documento, observacao,
    escopo: escopoMov, colaboradorId: colaboradorId || "",
    assinatura: null, assinadoEm: null, criadoEm: new Date().toISOString(),
  };

  let novosRegistros = [];

  if (tipo?.efeito === "saida"){
    const lotesDisponiveis = getLotesEmEstoque(materialId);
    if (lotesDisponiveis.length === 0){
      // material sem lotes rastreados — mantém comportamento simples (sem vínculo a lote)
      novosRegistros = [{ id: uid(), ...baseRegistro, quantidade: qtd, delta: -qtd, lote: "", validade: "" }];
    } else {
      if (MV_LOTES_SELECIONADOS.length === 0){
        errWrap.innerHTML = `<div class="sc-error">${icon("alert",14)} Selecione ao menos um lote para esta saída.</div>`;
        return;
      }
      const { alocacoes, restante } = calcularAlocacaoLotes(MV_LOTES_SELECIONADOS, lotesDisponiveis, qtd);
      if (restante > 0.0001){
        errWrap.innerHTML = `<div class="sc-error">${icon("alert",14)} Os lotes selecionados somam ${fmtNum(round3(qtd-restante))}; faltam ${fmtNum(restante)} para completar a quantidade informada. Selecione mais lotes.</div>`;
        return;
      }
      novosRegistros = alocacoes.filter(a=>a.usado>0).map(a => ({
        id: uid(), ...baseRegistro,
        quantidade: a.usado, delta: -a.usado,
        lote: a.lote, validade: a.validade || "",
      }));
    }
  } else {
    // entrada: lote/validade manuais, um único lançamento
    novosRegistros = [{
      id: uid(), ...baseRegistro, quantidade: qtd, delta: qtd,
      lote: document.getElementById("mv_lote")?.value.trim() || "",
      validade: document.getElementById("mv_validade")?.value || "",
    }];
  }

  DB.movimentos = [...novosRegistros, ...DB.movimentos];
  const somaDelta = novosRegistros.reduce((acc,r)=>acc+r.delta, 0);
  if (somaDelta !== 0){
    DB.materiais = DB.materiais.map(m => m.id===materialId ? {...m, estoqueAtual: round3((m.estoqueAtual||0)+somaDelta)} : m);
    persist("materiais");
  }
  persist("movimentos");

  MV_LOTES_SELECIONADOS = [];
  if (continuar){
    MV_CONTINUAR_DRAFT = { tipoMovimentoId, setorId, colaboradorId: colaboradorId || "" };
  } else {
    MV_CONTINUAR_DRAFT = null;
  }
  render();
}
function anularMovimento(id){
  const mov = DB.movimentos.find(m=>m.id===id);
  if (!mov) return;
  if (mov.anulado){ alert("Esta movimentação já está anulada."); return; }

  // se fizer parte de uma produção de mistura fina, o semiacabado, o envio ao setor e o consumo de
  // cada insumo compartilham o mesmo producaoId — anular precisa desfazer o conjunto inteiro,
  // devolvendo os insumos utilizados ao estoque
  const grupo = (mov.producaoId && mov.misturaFinaId)
    ? DB.movimentos.filter(m => m.producaoId===mov.producaoId && m.misturaFinaId && !m.anulado)
    : [mov];

  const mensagem = grupo.length>1
    ? `Esta movimentação faz parte de um lote de produção. Anular vai desfazer TODO o lote — o semiacabado produzido, o envio ao setor e a baixa dos ${grupo.length-1} lançamento(s) de insumo utilizados, devolvendo-os ao estoque. Deseja continuar?`
    : "Anular esta movimentação? Ela deixa de contar para o estoque e para todo o painel, mas continua visível aqui, marcada como anulada.";
  if (!confirm(mensagem)) return;

  const deltaPorMaterial = {};
  grupo.forEach(m => { if (m.delta) deltaPorMaterial[m.materialId] = round3((deltaPorMaterial[m.materialId]||0) - m.delta); });
  DB.materiais = DB.materiais.map(m => deltaPorMaterial[m.id] ? {...m, estoqueAtual: round3((m.estoqueAtual||0)+deltaPorMaterial[m.id])} : m);
  persist("materiais");

  const idsGrupo = new Set(grupo.map(m=>m.id));
  const agora = new Date().toISOString();
  DB.movimentos = DB.movimentos.map(m => idsGrupo.has(m.id) ? { ...m, anulado:true, anuladoEm: agora } : m);
  persist("movimentos");
  atualizarHistoricoMovimentos();
}
function reativarMovimento(id){
  const mov = DB.movimentos.find(m=>m.id===id);
  if (!mov || !mov.anulado) return;

  const grupo = (mov.producaoId && mov.misturaFinaId)
    ? DB.movimentos.filter(m => m.producaoId===mov.producaoId && m.misturaFinaId && m.anulado)
    : [mov];

  const mensagem = grupo.length>1
    ? `Esta movimentação faz parte de um lote de produção anulado. Reativar vai restaurar TODO o lote — o semiacabado produzido, o envio ao setor e a baixa dos ${grupo.length-1} lançamento(s) de insumo utilizados. Deseja continuar?`
    : "Reativar esta movimentação? Ela volta a contar para o estoque e para todo o painel.";
  if (!confirm(mensagem)) return;

  const deltaPorMaterial = {};
  grupo.forEach(m => { if (m.delta) deltaPorMaterial[m.materialId] = round3((deltaPorMaterial[m.materialId]||0) + m.delta); });
  DB.materiais = DB.materiais.map(m => deltaPorMaterial[m.id] ? {...m, estoqueAtual: round3((m.estoqueAtual||0)+deltaPorMaterial[m.id])} : m);
  persist("materiais");

  const idsGrupo = new Set(grupo.map(m=>m.id));
  DB.movimentos = DB.movimentos.map(m => idsGrupo.has(m.id) ? { ...m, anulado:false, anuladoEm: null } : m);
  persist("movimentos");
  atualizarHistoricoMovimentos();
}

function adicionarItemIndividual(){
  const errBox = document.getElementById("pi_novo_erro");
  const materialId = PRODUCAO_SESSAO.materialIndividualAtual;
  const lote = PRODUCAO_SESSAO.loteIndividualEmEdicao;
  const qtd = Number(document.getElementById("pi_novo_qtd")?.value);
  if (!materialId){ errBox.innerHTML = `<div class="sc-error">${icon("alert",14)} Selecione o material.</div>`; return; }
  if (!lote){ errBox.innerHTML = `<div class="sc-error">${icon("alert",14)} Selecione o lote.</div>`; return; }
  if (!qtd || qtd<=0){ errBox.innerHTML = `<div class="sc-error">${icon("alert",14)} Informe um peso maior que zero.</div>`; return; }
  const lotes = getLotesEmEstoque(materialId);
  const loteInfo = lotes.find(l=>l.lote===lote);
  const jaAlocado = round3(PRODUCAO_SESSAO.itensIndividuais.filter(it=>it.materialId===materialId && it.lote===lote).reduce((acc,it)=>acc+it.quantidade,0));
  const disponivel = loteInfo ? round3(loteInfo.saldo - jaAlocado) : 0;
  if (!loteInfo || qtd > disponivel){
    errBox.innerHTML = `<div class="sc-error">${icon("alert",14)} O lote "${escapeHtml(lote)}" só tem ${fmtNum(disponivel)} disponível.</div>`;
    return;
  }
  PRODUCAO_SESSAO.itensIndividuais.push({ materialId, lote, quantidade: qtd, validade: loteInfo.validade||"" });
  PESANDO_MATERIAL_ID = null;
  renderMain();
}

    materialNome: material?.nome||"—", materialCodigo: material?.codigo||"",
    loteIngrediente: it.lote||"", misturaCodigo: "", misturaLote: "Pesagem Individual",

  };
