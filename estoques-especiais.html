<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Controle de Estoque — Biosyn</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --navy: #173a7a;
    --navy-deep: #0f264f;
    --blue: #144272;
    --accent: #2C74B3;
    --accent-light: #5FA0D6;
    --bg: #F1F5F9;
    --card: #FFFFFF;
    --ink: #16233A;
    --ink-faint: #64748B;
    --line: #E2E8F0;
    --line-soft: #EEF2F7;
    --danger: #B3261E;
    --danger-bg: #FCECEB;
    --amber: #B7791F;
    --amber-bg: #FBF3E4;
    --slate: #6B7688;
    --font: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--navy-deep); }
  body{ font-family: var(--font); color: var(--ink); }

  .sc-shell{ display:flex; min-height:100vh; width:100%; background: var(--bg); }

  .sc-sidebar{
    width: 246px; flex-shrink:0; background: var(--navy);
    padding: 22px 16px; display:flex; flex-direction:column; gap:2px;
    position:sticky; top:0; height:100vh; overflow:auto; color:#EAF1FA;
  }
  .sc-brand{ display:flex; align-items:center; gap:10px; padding: 2px 4px 18px; }
  .sc-brand-icon{ width:36px; height:36px; border-radius:9px; background:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; padding:4px; overflow:hidden; }
  .sc-brand-title{ font-size:13.5px; font-weight:700; letter-spacing:.2px; line-height:1.25; color:#fff; }
  .sc-brand-sub{ font-size:10.5px; color: #9FB6D2; margin-top:2px; letter-spacing:.3px; }

  .sc-visaogeral{ display:flex; align-items:center; gap:8px; width:100%; background:transparent; border:1px solid rgba(255,255,255,.22); color:#D6E4F5; padding:9px 12px; border-radius:8px; cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:600; margin:4px 0 12px; }
  .sc-visaogeral:hover{ background: rgba(255,255,255,.08); }
  .sc-visaogeral.is-active{ background:#fff; color:var(--navy); border-color:#fff; }
  .sc-roomswitch{ display:flex; flex-direction:column; gap:6px; margin: 4px 0 18px; padding: 12px; background: rgba(255,255,255,.06); border-radius:10px; }
  .sc-roomswitch-label{ font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:#9FB6D2; margin-bottom:2px; padding: 0 2px;}
  .sc-roombtn{ display:flex; align-items:center; gap:8px; background:transparent; border:1px solid transparent; color:#D6E4F5; padding:8px 9px; border-radius:7px; cursor:pointer; text-align:left; font-family:inherit; font-size:12px; }
  .sc-roombtn:hover{ background: rgba(255,255,255,.08); }
  .sc-roombtn.is-active{ background:#fff; color: var(--navy); font-weight:700; }
  .sc-roombtn svg{ flex-shrink:0; }

  .sc-nav-groupLabel{ font-size:10px; color:#8AA3C2; margin: 16px 8px 4px; letter-spacing:.5px; text-transform:uppercase; }
  .sc-navitem{
    display:flex; align-items:center; gap:9px; width:100%;
    background:transparent; border:none; text-align:left;
    padding: 8px 9px; border-radius:7px; cursor:pointer;
    font-family: var(--font); font-size:12.5px; color: #D6E4F5;
  }
  .sc-navitem:hover{ background: rgba(255,255,255,.08); }
  .sc-navitem.is-active{ background: var(--accent); color:#fff; font-weight:600; }
  .sc-navitem.is-disabled{ opacity:.4; cursor:not-allowed; }
  .sc-navitem.is-disabled:hover{ background:transparent; }
  .sc-navitem svg{ flex-shrink:0; }
  .sc-navbadge{ margin-left:auto; background: var(--danger); color: #fff; font-size:10px; padding:1px 6px; border-radius:8px; }
  .sc-sidebar-foot{ margin-top:auto; font-size:10px; color: #8AA3C2; padding: 12px 8px 2px; border-top: 1px solid rgba(255,255,255,.12); line-height:1.5; display:flex; flex-direction:column; gap:8px; }
  .sc-filenote{ font-size:10px; color:#8AA3C2; line-height:1.5; }
  .sc-filenote.is-ok{ color:#7FD6A8; display:flex; align-items:center; gap:5px; font-weight:600; }
  .sc-filebtn{ display:flex; align-items:center; gap:6px; width:100%; text-align:left; background: rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); color:#EAF1FA; font-family:inherit; font-size:10.5px; padding:6px 8px; border-radius:6px; cursor:pointer; }
  .sc-filebtn:hover{ background: rgba(255,255,255,.16); }

  .sc-main{ flex:1; overflow:auto; padding: 30px 38px 60px; }
  .sc-page{ max-width: 1140px; }
  .sc-pageHead{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px; padding-bottom:14px; border-bottom: 1px solid var(--line); flex-wrap:wrap; gap:10px; }
  .sc-pageHead h1{ font-size:22px; margin:0; letter-spacing:.1px; color: var(--navy); font-weight:700; }
  .sc-pageHead p{ margin: 5px 0 0; font-size:12.5px; color: var(--ink-faint); }
  .sc-roomchip{ display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; background: var(--line-soft); color: var(--accent); margin-left:8px; letter-spacing:.2px; vertical-align:middle; }

  .sc-cards{ display:grid; grid-template-columns: repeat(5, 1fr); gap:12px; margin-bottom:28px; }
  .sc-stat{ text-align:left; background: var(--card); border:1px solid var(--line); padding:14px 16px; cursor:pointer; border-radius:10px; font-family:inherit; box-shadow: 0 1px 2px rgba(10,38,71,.04); min-width:0; }
  .sc-stat:hover{ border-color: var(--accent); }
  .sc-stat.is-alert{ border-color: var(--danger); background: var(--danger-bg); }
  .sc-stat-value{ font-size:26px; line-height:1; font-weight:700; color: var(--navy); }
  .sc-stat.is-alert .sc-stat-value{ color: var(--danger); }
  .sc-stat-label{ font-size:11.5px; color: var(--ink-faint); margin-top:6px; }

  .sc-section{ margin-bottom: 30px; }
  .sc-sectionHead{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; flex-wrap:wrap; gap:8px; }
  .sc-sectionTitle{ display:flex; align-items:center; gap:8px; font-size:14.5px; font-weight:700; color: var(--navy); }
  .sc-sectionTitle svg{ color: var(--accent); }

  .sc-table{ width:100%; border-collapse:collapse; font-size:12.5px; background: var(--card); border-radius:10px; overflow:hidden; }
  .sc-table thead th{ text-align:left; font-weight:700; font-size:10.5px; color: var(--ink-faint); letter-spacing:.3px; text-transform:uppercase; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--line-soft); white-space:nowrap; }
  .sc-table tbody td{ padding: 9px 12px; border-bottom: 1px solid var(--line-soft); vertical-align:middle; }
  .sc-table tbody tr:hover{ background: #FAFCFE; }
  .sc-rowclick{ cursor:pointer; }
  .sc-rowclick:hover{ background: #EAF2FA; }
  .sc-expandcell{ width:20px; color: var(--ink-faint); }
  .sc-rowdetail td{ background: var(--line-soft); padding:10px 12px 14px 34px; }
  .sc-subtable{ box-shadow:none; border:1px solid var(--line); }
  .sc-subtable thead th{ background: #fff; }
  .sc-lotrow{ display:flex; align-items:center; gap:10px; }
  .sc-lotrow select{ flex:1; }
  .sc-lotrow .sc-hint{ white-space:nowrap; margin:0; }
  .sc-table td.num, .sc-table th.num{ text-align:right; }
  .sc-tablewrap{ overflow-x:auto; border:1px solid var(--line); border-radius:10px; }
  .sc-tablewrap .sc-table{ border-radius:0; }
  .mono{ font-variant-numeric: tabular-nums; }
  .stamp-red{ color: var(--danger); font-weight:700; }
  .stamp-blue{ color: var(--accent); font-weight:700; }
  .rowActions{ display:flex; gap:4px; justify-content:flex-end; white-space:nowrap; }

  .sc-tag{ display:inline-block; padding:2px 9px; border-radius:20px; font-size:10.5px; font-weight:600; border:1px solid transparent; white-space:nowrap; }
  .tag-entrada{ color: var(--accent); background: #EAF2FA; }
  .tag-saida{ color: var(--danger); background: var(--danger-bg); }
  .tag-ajuste{ color: var(--amber); background: var(--amber-bg); }
  .tag-neutro{ color: var(--slate); background: #EEF1F5; }
  .tag-ambas{ color: var(--navy); background: #E7ECF3; }
  .tag-controlados{ color: #7A3E9D; background: #F2E9F8; }
  .tag-epis{ color: #0F7A5C; background: #E5F5EF; }
  .tag-graficos{ color: var(--amber); background: var(--amber-bg); }
  .tag-vencido{ color: #fff; background: var(--danger); }
  .tag-hoje{ color: var(--danger); background: var(--danger-bg); font-weight:700; }
  .tag-critico{ color: #B45309; background: #FEF0DC; }
  .tag-atencao{ color: var(--amber); background: var(--amber-bg); }
  .tag-semvalidade{ color: var(--slate); background: #EEF1F5; }

  .sc-search{ display:flex; align-items:center; gap:8px; background: var(--card); border:1px solid var(--line); padding:9px 12px; border-radius:9px; }
  .sc-search input{ border:none; background:transparent; outline:none; font-family: var(--font); font-size:12.5px; width:100%; color: var(--ink); }
  .sc-toolbar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }

  .sc-toolbar select.sc-input{ max-width:230px; }

  .sc-formpanelHead{ display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line-soft); font-weight:700; font-size:13px; color: var(--navy); }
  .sc-formpanelBody{ padding: 16px; display:flex; flex-direction:column; gap:13px; }
  .sc-fieldrow{ display:flex; gap:12px; flex-wrap:wrap; }
  .sc-field{ display:flex; flex-direction:column; gap:5px; font-size:11px; color: var(--ink-faint); flex:1; min-width:150px; font-weight:600; }
  .sc-field.is-wide{ flex: 2 1 230px; }
  .sc-input{ font-family: var(--font); font-size:12.5px; padding:8px 10px; border:1px solid var(--line); background: #fff; color: var(--ink); border-radius:7px; width:100%; font-weight:400; }
  .sc-input:focus{ outline:2px solid var(--accent-light); outline-offset:0; border-color: var(--accent); }
  .sc-formfoot{ display:flex; gap:8px; justify-content:flex-end; padding: 4px 16px 16px; }

  .sc-btn{ display:inline-flex; align-items:center; gap:7px; font-family: var(--font); font-size:12.5px; font-weight:600; padding:9px 15px; border-radius:8px; cursor:pointer; border:1px solid transparent; }
  .sc-btn-primary{ background: var(--accent); color: #fff; }
  .sc-btn-primary:hover{ background: var(--blue); }
  .sc-btn-ghost{ background:transparent; color: var(--navy); border-color: var(--line); }
  .sc-btn-ghost:hover{ border-color: var(--accent); color: var(--accent); }
  .sc-iconbtn{ background:transparent; border:1px solid var(--line); padding:6px; border-radius:7px; cursor:pointer; color: var(--ink-faint); display:inline-flex; }
  .sc-iconbtn:hover{ border-color: var(--accent); color: var(--accent); }

  .sc-hint{ font-size:11.5px; color: var(--ink-faint); margin-top:-2px; }
  .sc-hint-alert{ display:flex; align-items:center; gap:6px; color: var(--danger); margin-bottom:10px; font-weight:600; }
  .sc-error{ display:flex; align-items:center; gap:6px; color: var(--danger); font-size:11.5px; background: var(--danger-bg); padding:8px 11px; border-radius:7px; margin-top:4px; }

  .sc-empty{ padding: 30px 16px; text-align:center; color: var(--ink-faint); font-size:12.5px; background: var(--card); border:1px dashed var(--line); border-radius:10px; }
  .sc-colabitem{ display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; text-align:left; background: var(--card); border:1px solid var(--line); padding:10px 12px; border-radius:8px; cursor:pointer; font-family:inherit; font-size:12.5px; color: var(--ink); }
  .sc-colabitem:hover{ border-color: var(--accent); }
  .sc-colabitem.is-active{ border-color: var(--accent); background: #EAF2FA; font-weight:700; }

  @media (max-width: 860px){
    .sc-shell{ flex-direction:column; }
    .sc-sidebar{ width:100%; height:auto; position:relative; }
    .sc-sidebar-foot{ display:none; }
    .sc-cards{ grid-template-columns: repeat(2,1fr); }
    .sc-main{ padding: 18px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   PAINEL DE CONTROLE DE ESTOQUE — BIOSYN
   Duas salas: Produtos Controlados e EPIs.
   Cada registro (material, categoria, unidade, setor, tipo de
   movimento, movimentação) carrega um "escopo" de visibilidade:
   'ambas' | 'controlados' | 'epis'.
   Persistência: window.storage quando disponível (dentro do Claude);
   caso contrário, localStorage do navegador (uso independente).
===================================================================== */

const STORAGE_PREFIX = "biosyn_estoque";
const HAS_CLAUDE_STORAGE = (typeof window.storage !== "undefined");

async function storageGet(key){
  if (HAS_CLAUDE_STORAGE){ try { return await window.storage.get(key); } catch(e){ return null; } }
  const v = localStorage.getItem(key);
  return v ? { key, value: v } : null;
}
async function storageSet(key, value){
  if (HAS_CLAUDE_STORAGE){ try { return await window.storage.set(key, value); } catch(e){ console.error(e); return null; } }
  localStorage.setItem(key, value);
  return { key, value };
}

/* ------------------------------- helpers ------------------------------- */
const uid = () => `${Date.now().toString(36)}${Math.random().toString(36).slice(2,8)}`;
const todayISO = () => new Date().toISOString().slice(0,10);
const round3 = (n) => Math.round(n*1000)/1000;
const fmtDate = (iso) => { if(!iso) return "—"; const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; };
const fmtNum = (n) => new Intl.NumberFormat("pt-BR",{maximumFractionDigits:3}).format(n||0);
const escapeHtml = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ------------------------------- salas e escopo (visibilidade por sala) ------------------------------- */
const ROOMS = [
  { id:"controlados", label:"Produtos Controlados", icon:"flask" },
  { id:"epis", label:"EPIs", icon:"shield" },
  { id:"graficos", label:"Materiais Gráficos", icon:"printer" },
];
const ALL_ROOM_IDS = ROOMS.map(r=>r.id);
function roomIcon(room){ const r = ROOMS.find(x=>x.id===room); return r ? r.icon : "globe"; }
function roomLabel(room){
  const r = ROOMS.find(x=>x.id===room);
  if (r) return `Sala de ${r.label}`;
  return "Visão Geral — Todas as Salas";
}
function setorHomeDaSala(roomId){
  if (!roomId || roomId==="todas") return null;
  return DB.setores.find(s => s.salaBase === roomId) || null;
}
function normalizeEscopo(escopo){
  if (Array.isArray(escopo)) return escopo.filter(id => ALL_ROOM_IDS.includes(id));
  if (escopo === "ambas") return [...ALL_ROOM_IDS];
  if (typeof escopo === "string" && ALL_ROOM_IDS.includes(escopo)) return [escopo];
  return [...ALL_ROOM_IDS];
}
function escopoChecklistHTML(prefix, escopo){
  const sel = normalizeEscopo(escopo);
  return ROOMS.map(r => `
    <label style="display:flex; align-items:center; gap:7px; font-weight:400; font-size:12.5px; color:var(--ink); padding:4px 0;">
      <input type="checkbox" id="${prefix}_${r.id}" ${sel.includes(r.id)?"checked":""}> ${icon(r.icon,13)} <span>${escapeHtml(r.label)}</span>
    </label>`).join("");
}
function readEscopoChecklist(prefix){
  return ROOMS.filter(r => document.getElementById(`${prefix}_${r.id}`)?.checked).map(r=>r.id);
}
function escopoBadgesHTML(escopo){
  const arr = normalizeEscopo(escopo);
  if (arr.length === ROOMS.length) return `<span class="sc-tag tag-ambas">Todas as salas</span>`;
  if (arr.length === 0) return `<span class="sc-tag tag-ambas">Nenhuma sala</span>`;
  return arr.map(id => `<span class="sc-tag tag-${id}">${escapeHtml(ROOMS.find(r=>r.id===id)?.label || id)}</span>`).join(" ");
}
function escopoLabelPlain(escopo){
  const arr = normalizeEscopo(escopo);
  if (arr.length === ROOMS.length) return "Todas as salas";
  return arr.map(id => ROOMS.find(r=>r.id===id)?.label || id).join(", ");
}
function inRoom(item, room){
  if (!room || room==="todas") return true;
  return normalizeEscopo(item.escopo).includes(room);
}

/* ------------------------------- seed data ------------------------------- */
function seedCategorias(){
  const epis = ["Luvas","Calçados de Segurança","Máscaras e Respiradores","Óculos e Protetores Faciais","Protetores Auriculares","Capacetes","Vestimentas de Proteção","Cintos de Segurança e Talabartes","Outros EPIs"]
    .map(nome => ({ id: uid(), nome, escopo:["epis"] }));
  const controlados = ["Solventes","Ácidos e Bases","Produtos Químicos Diversos","Reagentes de Laboratório","Entorpecentes","Psicotrópicos","Precursores Químicos","Inflamáveis","Corrosivos","Outros Controlados"]
    .map(nome => ({ id: uid(), nome, escopo:["controlados"] }));
  return [...controlados, ...epis];
}
function seedUnidades(){ return ["g","mL","unidade","par","caixa"].map(nome => ({ id: uid(), nome, escopo:[...ALL_ROOM_IDS] })); }
const EFEITOS = [
  { id:"entrada", label:"Entrada (soma ao estoque)" },
  { id:"saida", label:"Saída (subtrai do estoque)" },
];
function isEntregaIndividual(tipo){
  if (!tipo) return false;
  if (tipo.especial === "entrega_individual") return true;
  return String(tipo.nome||"").trim().toLowerCase() === "entrega individual";
}
const NOMES_BAIXA_INTERNA = ["saída por utilização", "saída por descarte", "ajuste de inventário - negativo"];
function isBaixaInterna(tipo){
  if (!tipo) return false;
  if (tipo.especial === "baixa_interna") return true;
  return NOMES_BAIXA_INTERNA.includes(String(tipo.nome||"").trim().toLowerCase());
}
const NOMES_TRANSFERENCIA_SETOR = ["transf. semanal aos setores", "transf. aos setores"];
function isTransferenciaSetor(tipo){
  if (!tipo) return false;
  if (tipo.especial === "transferencia_setor") return true;
  return NOMES_TRANSFERENCIA_SETOR.includes(String(tipo.nome||"").trim().toLowerCase());
}
function seedSetores(){ return [
  { id: uid(), nome:"Sala de Produtos Controlados", responsavelId:"", escopo:[...ALL_ROOM_IDS], salaBase:"controlados" },
  { id: uid(), nome:"Almoxarifado de EPIs", responsavelId:"", escopo:[...ALL_ROOM_IDS], salaBase:"epis" },
  { id: uid(), nome:"Sala de Materiais Gráficos", responsavelId:"", escopo:[...ALL_ROOM_IDS], salaBase:"graficos" },
]; }
const COLABORADORES_PADRAO_BIOSYN = [
  ["ALESSANDRA GRUBER","Controle de Qualidade"], ["AMANDA DA SILVA VICENTE","Recursos Humanos"],
  ["AMANDA GRUN WESTFAL","Administrativo Geral"], ["ANA PAULA DA SILVA CARDOSO","Faturamento"],
  ["ANDRELISE LUCINEIDE DELFINO","Manutenção Industrial"], ["ANDRESSA OLIVEIRA MACHADO","Segurança e Esterilização"],
  ["ARTHUR HENRIQUE PALMEIRA","Suprimentos"], ["BIANCA ALVES DA SILVA","Logística"],
  ["BRYAN DE LIMA DOS SANTOS LIMA","Setor Ingredientes"], ["CALLIANDRA DAVID ESMALA","Marketing"],
  ["CAMILA CAMPOS VACA","Controle de Qualidade"], ["CAMILA ROSA DUARTE","Setor Ingredientes"],
  ["CLAUDETE MARTINS DE LARA","Segurança e Esterilização"], ["CLAUDINEI SOARES DA SILVA","Administrativo Geral"],
  ["DAIANE DO ROSARIO","Controle de Qualidade"], ["DIANA DA SILVA SOUZA","Recursos Humanos"],
  ["DILMARA CUNHA DA SILVA","Segurança e Esterilização"], ["ELAINE DE MELO","Setor Pasta"],
  ["EMILY CORREA","Laboratório"], ["FERNANDA DANIELA SCHWEITZER","Compras"],
  ["FERNANDA PEREIRA DA CRUZ","Setor Ingredientes"], ["FRANCIELY LEAO PATRICIO","Marketing"],
  ["GABRIELA SAMARA DA SILVA","Setor Ingredientes"], ["GABRIELE DA LUZ SULZ","Setor Pasta"],
  ["GILMAR MEFELLES","Manutenção Industrial"], ["GILSON PRUENÇA DA SILVA","Setor Pó"],
  ["GIOVANE PIETROSKI","Manutenção Industrial"], ["GISELI ALVES DE OLIVEIRA","PCPM"],
  ["GUIDO JONATHAN KRUGER","Setor Premix"], ["HELOIZA DE BRAGA","Controle de Qualidade"],
  ["HENRIQUE OSSOVSKI","Segurança e Esterilização"], ["HÍCARO ALEXANDRE FRAGOSO DE BARROS","Setor Sache"],
  ["HUGO SILVA OLIVEIRA","Setor Premix"], ["IANDRA VIEIRA","Controle de Qualidade"],
  ["IDEVAN SOUZA ACOSTA","Almoxarifado"], ["JACKSON BALICIO GALDINO","TI"],
  ["JAMILLE MARIA HEIN GENAUCK","Setor Ingredientes"], ["JAQUELINE CORREIA DE NEGREIRO","Setor Sache"],
  ["JEISIANE PEREIRA BORSTMANN","Setor Ingredientes"], ["JESSICA GAZANIGA","Setor Pasta"],
  ["JESSICA RODRIGUES GREGORIO MIRANDA","Setor Ingredientes"], ["JOAO GARIEL DOS SANTOS CAMARGO","Setor Pó"],
  ["JOSNE CARLETTO CRIPPA DA SILVA","Setor Ingredientes"], ["JUAN CARLOS REINERT","Suprimentos"],
  ["JUAN FELIPE SCHROEDER DA ROSA","Setor Líquido"], ["KARINE SILVA GIL","Setor Ingredientes"],

async function loadAll(){
  const keys = ["materiais","categorias","unidades","setores","tipos","movimentos","colaboradores"];
  for (const key of keys){
    const res = await storageGet(`${STORAGE_PREFIX}:${key}`);
    if (res && res.value){
      try { DB[key] = JSON.parse(res.value); } catch(e){ DB[key] = defaultFor(key); }
    } else {
      DB[key] = defaultFor(key);
    }
  }
  // normaliza registros antigos: converte escopo (string legada ou ausente) em array de salas
  for (const key of ["materiais","categorias","unidades","setores","tipos","movimentos","colaboradores"]){
    DB[key] = DB[key].map(x => ({ ...x, escopo: normalizeEscopo(x.escopo) }));
  }
  // normaliza materiais antigos: garante o campo separado de código de barras e o CA
  DB.materiais = DB.materiais.map(m => ({ codigoBarras: "", ca: "", caValidade: "", ...m }));
  // normaliza setores antigos: garante o campo de setor-base da sala e de responsável (colaborador)
  DB.setores = DB.setores.map(s => ({ salaBase: "", responsavelId: "", ...s }));

  // migração: garante a lista padrão de setores e colaboradores da Biosyn
  const colaboradoresPadraoMarcador = await storageGet(`${STORAGE_PREFIX}:colaboradores_padrao_biosyn_v1`);
  if (!colaboradoresPadraoMarcador){
    garantirColaboradoresPadrao();
    storageSet(`${STORAGE_PREFIX}:colaboradores_padrao_biosyn_v1`, "1");
  }

  // migração: corrige capitalização dos colaboradores padrão já inseridos em maiúsculas
  const capitalizacaoMarcador = await storageGet(`${STORAGE_PREFIX}:colaboradores_capitalizacao_v1`);
  if (!capitalizacaoMarcador){
    corrigirCapitalizacaoColaboradoresPadrao();
    storageSet(`${STORAGE_PREFIX}:colaboradores_capitalizacao_v1`, "1");
  }

  await tentarRestaurarArquivoDados();

  // migração: padroniza o catálogo de unidades de medida (instalações já existentes)
  const unidadesPadraoMarcador = await storageGet(`${STORAGE_PREFIX}:unidades_padrao_v2`);
  if (!unidadesPadraoMarcador){
    DB.unidades = seedUnidades();
    persist("unidades");
    storageSet(`${STORAGE_PREFIX}:unidades_padrao_v2`, "1");
  }

  // migração: substitui o catálogo de categorias pelo novo padrão (Controlados x EPIs)
  const categoriasPadraoMarcador = await storageGet(`${STORAGE_PREFIX}:categorias_padrao_v3`);
  if (!categoriasPadraoMarcador){
    DB.categorias = seedCategorias();
    persist("categorias");
    storageSet(`${STORAGE_PREFIX}:categorias_padrao_v3`, "1");
  }

  // migração: renomeia o tipo de movimento antigo, preservando id e histórico
  let tiposAlterados = false;
  DB.tipos = DB.tipos.map(t => {
    if (t.nome === "Saída por Dispensação/Uso" || t.nome === "Saída por Dispensação"){
      tiposAlterados = true;
      return { ...t, nome: "Saída por Utilização" };
    }
    return t;
  });
  if (tiposAlterados) persist("tipos");

  // migração: garante a existência do tipo especial "Entrega Individual"
  const entregaIndividualMarcador = await storageGet(`${STORAGE_PREFIX}:tipo_entrega_individual_v1`);
  if (!entregaIndividualMarcador){
    if (!DB.tipos.some(t => isEntregaIndividual(t))){
      DB.tipos.push({ id: uid(), nome:"Entrega Individual", efeito:"saida", escopo:[...ALL_ROOM_IDS], especial:"entrega_individual" });
      persist("tipos");
    }
    storageSet(`${STORAGE_PREFIX}:tipo_entrega_individual_v1`, "1");
  }

  // migração: todo tipo de movimento passa a ter efeito de entrada ou saída (fim de "ajuste"/"neutro")
  const tiposEfeitosMarcador = await storageGet(`${STORAGE_PREFIX}:tipos_efeitos_v3`);
  if (!tiposEfeitosMarcador){
    DB.tipos = DB.tipos.map(t => {
      if (t.nome === "Transferência entre Setores") return { ...t, nome:"Transf. Semanal aos Setores", efeito:"saida" };
      if (t.nome === "Ajuste de Inventário") return { ...t, nome:"Ajuste de Inventário - Positivo", efeito:"entrada" };
      if (t.efeito === "neutro" || t.efeito === "ajuste") return { ...t, efeito:"saida" };
      return t;
    });
    if (!DB.tipos.some(t => t.nome==="Transf. aos Setores")){
      DB.tipos.push({ id: uid(), nome:"Transf. aos Setores", efeito:"saida", escopo:[...ALL_ROOM_IDS] });
    }
    if (!DB.tipos.some(t => t.nome==="Ajuste de Inventário - Negativo")){
      DB.tipos.push({ id: uid(), nome:"Ajuste de Inventário - Negativo", efeito:"saida", escopo:[...ALL_ROOM_IDS] });
    }
    persist("tipos");
    storageSet(`${STORAGE_PREFIX}:tipos_efeitos_v3`, "1");
  }

  // migração: marca tipos de baixa interna (sem setor de destino) — usam o setor da própria sala
  const baixaInternaMarcador = await storageGet(`${STORAGE_PREFIX}:tipos_baixa_interna_v1`);
  if (!baixaInternaMarcador){
    let baixaAlterada = false;
    DB.tipos = DB.tipos.map(t => {
      if (!t.especial && NOMES_BAIXA_INTERNA.includes(String(t.nome||"").trim().toLowerCase())){
        baixaAlterada = true;
        return { ...t, especial: "baixa_interna" };
      }
      return t;
    });
    if (baixaAlterada) persist("tipos");
    storageSet(`${STORAGE_PREFIX}:tipos_baixa_interna_v1`, "1");
  }

  // migração: marca tipos de transferência aos setores (usados em "Recebimentos por Setor")
  const transferenciaSetorMarcador = await storageGet(`${STORAGE_PREFIX}:tipos_transferencia_setor_v1`);
  if (!transferenciaSetorMarcador){
    let transfAlterada = false;
    DB.tipos = DB.tipos.map(t => {
      if (!t.especial && NOMES_TRANSFERENCIA_SETOR.includes(String(t.nome||"").trim().toLowerCase())){
        transfAlterada = true;
        return { ...t, especial: "transferencia_setor" };
      }
      return t;
    });
    if (transfAlterada) persist("tipos");
    storageSet(`${STORAGE_PREFIX}:tipos_transferencia_setor_v1`, "1");
  }

  // migração: liga o "responsável" (texto livre) de cada setor a um colaborador cadastrado, quando possível
  const responsavelColabMarcador = await storageGet(`${STORAGE_PREFIX}:setor_responsavel_colaborador_v1`);
  if (!responsavelColabMarcador){
    DB.setores = DB.setores.map(s => {
      if (!s.responsavelId && s.responsavel){
        const match = DB.colaboradores.find(c => c.nome.trim().toLowerCase() === String(s.responsavel).trim().toLowerCase());
        if (match) return { ...s, responsavelId: match.id };
      }
      return s;
    });
    persist("setores");
    storageSet(`${STORAGE_PREFIX}:setor_responsavel_colaborador_v1`, "1");
  }

  // migração: define o setor-base de cada sala (Controlados, EPIs, Materiais Gráficos)
  const setoresBaseMarcador = await storageGet(`${STORAGE_PREFIX}:setores_sala_base_v1`);
  if (!setoresBaseMarcador){
    DB.setores = DB.setores.map(s => {
      if (s.nome === "Sala de Produtos Controlados — Central" || s.nome === "Sala de Produtos Controlados"){
        return { ...s, nome:"Sala de Produtos Controlados", salaBase: s.salaBase || "controlados" };
      }
      if (s.nome === "Almoxarifado de EPIs"){
        return { ...s, salaBase: s.salaBase || "epis" };
      }
      return s;
    });
    if (!DB.setores.some(s => s.salaBase === "controlados")){
      DB.setores.push({ id: uid(), nome:"Sala de Produtos Controlados", responsavel:"", escopo:[...ALL_ROOM_IDS], salaBase:"controlados" });
    }
    if (!DB.setores.some(s => s.salaBase === "epis")){
      DB.setores.push({ id: uid(), nome:"Almoxarifado de EPIs", responsavel:"", escopo:[...ALL_ROOM_IDS], salaBase:"epis" });
    }
    if (!DB.setores.some(s => s.salaBase === "graficos")){
      DB.setores.push({ id: uid(), nome:"Sala de Materiais Gráficos", responsavel:"", escopo:[...ALL_ROOM_IDS], salaBase:"graficos" });
    }
    persist("setores");
    storageSet(`${STORAGE_PREFIX}:setores_sala_base_v1`, "1");
  }

  render();
}
function defaultFor(key){
  if (key==="setores") return seedSetores();
  if (key==="tipos") return seedTipos();
  if (key==="categorias") return seedCategorias();
  if (key==="unidades") return seedUnidades();
  if (key==="colaboradores") return [];
  return [];
}
function persist(key){
  storageSet(`${STORAGE_PREFIX}:${key}`, JSON.stringify(DB[key]));
  if (DATA_FILE_HANDLE) escreverArquivoDados();
}

/* ------------------------------- arquivo de dados local (auto-save real em arquivo) ------------------------------- */
const HAS_FS_ACCESS = (typeof window.showSaveFilePicker === "function" && typeof window.showOpenFilePicker === "function");
const IDB_NAME = "biosyn_estoque_fs";
const IDB_STORE = "handles";
let DATA_FILE_HANDLE = null;    // arquivo conectado e autorizado nesta sessão
let PENDING_FILE_HANDLE = null; // arquivo encontrado de uma sessão anterior, aguardando reconexão

function idbOpen(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, value){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readonly");
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function idbDelete(key){
  try{
    const db = await idbOpen();
    return new Promise((resolve) => {
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    });
  } catch(e){ /* nada a fazer */ }
}

async function tentarRestaurarArquivoDados(){
  if (!HAS_FS_ACCESS) return;
  try{
    const handle = await idbGet("dataFile");
    if (!handle) return;
    const perm = await handle.queryPermission({ mode:"readwrite" });
    if (perm === "granted") DATA_FILE_HANDLE = handle;
    else PENDING_FILE_HANDLE = handle;
  } catch(e){ /* handle inválido ou revogado — ignora */ }
}
async function reconectarArquivoDados(){
  if (!PENDING_FILE_HANDLE) return;
  try{
    const perm = await PENDING_FILE_HANDLE.requestPermission({ mode:"readwrite" });
    if (perm === "granted"){
      DATA_FILE_HANDLE = PENDING_FILE_HANDLE;
      PENDING_FILE_HANDLE = null;
      await escreverArquivoDados();
      render();
    }
  } catch(e){ alert("Não foi possível reconectar ao arquivo."); }
}
async function criarNovoArquivoDados(){
  if (!HAS_FS_ACCESS){
    alert("Este navegador não permite salvar automaticamente em arquivo (recurso disponível no Chrome ou Edge, no computador). Os dados continuam salvos automaticamente neste navegador.");
    return;
  }
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: "estoque-biosyn.json",
      types: [{ description: "Arquivo de dados do Painel de Estoque", accept: { "application/json": [".json"] } }],
    });
    DATA_FILE_HANDLE = handle;
    PENDING_FILE_HANDLE = null;
    await idbSet("dataFile", handle);
    await escreverArquivoDados();
    render();
  } catch(e){ /* usuário cancelou a seleção — nada a fazer */ }
}
async function abrirArquivoDados(){
  if (!HAS_FS_ACCESS){
    alert("Este navegador não permite abrir arquivos de dados automaticamente (recurso disponível no Chrome ou Edge, no computador).");
    return;
  }
  try{
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: "Arquivo de dados do Painel de Estoque", accept: { "application/json": [".json"] } }],
    });
    const perm = await handle.requestPermission({ mode: "readwrite" });
    if (perm !== "granted"){ alert("Permissão de leitura e escrita não concedida."); return; }
    const file = await handle.getFile();
    let data;
    try {
      data = JSON.parse(await file.text());
    } catch(parseErr){
      alert("O arquivo selecionado não é um JSON válido — ele pode estar corrompido ou não ser um arquivo de dados deste painel.");
      return;
    }
    const chaves = ["materiais","categorias","unidades","setores","tipos","movimentos","colaboradores"];
    let algumaChaveEncontrada = false;
    for (const key of chaves){
      if (Array.isArray(data[key])){ DB[key] = data[key].map(x => ({ escopo:"ambas", ...x })); algumaChaveEncontrada = true; }
    }
    if (!algumaChaveEncontrada){
      alert("O arquivo selecionado não parece ser um arquivo de dados deste painel (nenhuma informação reconhecida foi encontrada nele).");
      return;
    }
    for (const key of chaves) persistLocalOnly(key);
    DATA_FILE_HANDLE = handle;
    PENDING_FILE_HANDLE = null;
    await idbSet("dataFile", handle);
    render();
  } catch(e){
    if (e && e.name !== "AbortError") alert(`Não foi possível abrir o arquivo selecionado. Detalhe técnico: ${e && e.message ? e.message : e}`);
  }
}
function persistLocalOnly(key){ storageSet(`${STORAGE_PREFIX}:${key}`, JSON.stringify(DB[key])); }
async function desconectarArquivoDados(){
  DATA_FILE_HANDLE = null;
  PENDING_FILE_HANDLE = null;
  await idbDelete("dataFile");
  render();
}
async function escreverArquivoDados(){
  if (!DATA_FILE_HANDLE) return;
  try{
    let perm = await DATA_FILE_HANDLE.queryPermission({ mode:"readwrite" });
    if (perm !== "granted") perm = await DATA_FILE_HANDLE.requestPermission({ mode:"readwrite" });
    if (perm !== "granted") return;
    const writable = await DATA_FILE_HANDLE.createWritable();
    const payload = JSON.stringify({
      materiais: DB.materiais, categorias: DB.categorias, unidades: DB.unidades,
      setores: DB.setores, tipos: DB.tipos, movimentos: DB.movimentos,
      colaboradores: DB.colaboradores,
      salvoEm: new Date().toISOString(),
    }, null, 2);
    await writable.write(payload);
    await writable.close();
  } catch(e){ console.error("Falha ao salvar no arquivo conectado", e); }
}

/* ------------------------------- leitor de código de barras ------------------------------- */
let html5QrCode = null;
let SCANNER_CALLBACK = null;

function scannerOverlayHTML(){
  return `
  <div id="scannerOverlay" style="display:none; position:fixed; inset:0; background:rgba(6,26,51,.75); z-index:1000; align-items:center; justify-content:center; padding:16px;">
    <div style="background:#fff; border-radius:12px; padding:18px; width:min(420px,94vw); box-shadow:0 12px 40px rgba(0,0,0,.35);">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <strong style="color:var(--navy); font-size:14px;">Escanear código de barras</strong>
        <button class="sc-iconbtn" onclick="closeScanner()">${icon("x",14)}</button>
      </div>
      <div id="scannerRegion" style="width:100%; border-radius:8px; overflow:hidden; background:#000; min-height:220px;"></div>
      <div class="sc-hint" style="margin-top:10px;">Aponte a câmera para o código de barras do material. É necessário permitir o acesso à câmera do dispositivo.</div>
      <div id="scannerError"></div>
    </div>
  </div>`;
}

function openScanner(callback){
  SCANNER_CALLBACK = callback;
  const overlay = document.getElementById("scannerOverlay");
  if (!overlay) return;
  overlay.style.display = "flex";
  const errBox = document.getElementById("scannerError");
  if (errBox) errBox.innerHTML = "";
  requestAnimationFrame(() => {
    if (typeof Html5Qrcode === "undefined"){
      if (errBox) errBox.innerHTML = `<div class="sc-error">${icon("alert",14)} Não foi possível carregar o leitor de código de barras. Verifique sua conexão com a internet.</div>`;
      return;
    }
    try{
      html5QrCode = new Html5Qrcode("scannerRegion", {
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.ITF, Html5QrcodeSupportedFormats.QR_CODE,
        ],
      });
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 260, height: 160 } },
        (decodedText) => handleScanSuccess(decodedText),
        () => {}
      ).catch(() => {
        if (errBox) errBox.innerHTML = `<div class="sc-error">${icon("alert",14)} Não foi possível acessar a câmera. Verifique as permissões do navegador.</div>`;
      });
    } catch(e){
      if (errBox) errBox.innerHTML = `<div class="sc-error">${icon("alert",14)} Leitor de código de barras indisponível neste navegador.</div>`;
    }
  });
}
function closeScanner(){
  const overlay = document.getElementById("scannerOverlay");
  if (overlay) overlay.style.display = "none";
  if (html5QrCode){
    html5QrCode.stop().then(() => html5QrCode.clear()).catch(() => {});
    html5QrCode = null;
  }
}
function handleScanSuccess(decodedText){
  const cb = SCANNER_CALLBACK;
  closeScanner();
  if (cb) cb(decodedText);
}
function scanForMaterialCodigo(){
  openScanner((text) => {
    const el = document.getElementById("f_codigoBarras");
    if (el) el.value = text;
  });
}
function scanForMovMaterial(){
  openScanner((text) => {
    const el = document.getElementById("mv_codigoBusca");
    if (el) el.value = text;
    buscarMaterialPorCodigo();
  });
}
function buscarMaterialPorCodigo(){
  const code = (document.getElementById("mv_codigoBusca")?.value || "").trim();
  const msgWrap = document.getElementById("mv_codigoMsg");
  if (!msgWrap) return;
  if (!code){ msgWrap.innerHTML = ""; return; }
  const codeLower = code.toLowerCase();
  const found = DB.materiais.find(m => (m.codigoBarras||"").trim().toLowerCase() === codeLower && inRoom(m, ROOM))
    || DB.materiais.find(m => (m.codigo||"").trim().toLowerCase() === codeLower && inRoom(m, ROOM));
  if (found){
    const sel = document.getElementById("mv_material");
    if (sel){ sel.value = found.id; onMovMaterialChange(); }
    msgWrap.innerHTML = `<div class="sc-hint">${icon("check",12)} Material localizado: <strong>${escapeHtml(found.nome)}</strong></div>`;
  } else {
    msgWrap.innerHTML = `<div class="sc-error">${icon("alert",14)} Nenhum material cadastrado com o código "${escapeHtml(code)}"${ROOM!=="todas" ? " nesta visão" : ""}.</div>`;
  }
}

/* ------------------------------- assinatura digital (mouse/touch) ------------------------------- */
let SIGNATURE_CALLBACK = null;
let sigCtx = null;
let sigDrawing = false;
let sigHasStroke = false;

function signatureOverlayHTML(){
  return `
  <div id="signatureOverlay" style="display:none; position:fixed; inset:0; background:rgba(6,26,51,.75); z-index:1000; align-items:center; justify-content:center; padding:16px;">
    <div style="background:#fff; border-radius:12px; padding:18px; width:min(480px,94vw); box-shadow:0 12px 40px rgba(0,0,0,.35);">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <strong style="color:var(--navy); font-size:14px;" id="signatureTitle">Assinatura do colaborador</strong>
        <button class="sc-iconbtn" onclick="closeSignature()">${icon("x",14)}</button>
      </div>
      <canvas id="signatureCanvas" style="width:100%; height:200px; border:1px solid var(--line); border-radius:8px; background:#fdfdfd; touch-action:none; cursor:crosshair; display:block;"></canvas>
      <div class="sc-hint" style="margin-top:8px;">Assine com o mouse ou o dedo (touch) na área acima.</div>
      <div style="display:flex; justify-content:space-between; gap:8px; margin-top:12px;">
        <button class="sc-btn sc-btn-ghost" onclick="limparAssinatura()">Limpar</button>
        <div style="display:flex; gap:8px;">
          <button class="sc-btn sc-btn-ghost" onclick="closeSignature()">Cancelar</button>
          <button class="sc-btn sc-btn-primary" onclick="confirmarAssinatura()">${icon("check",14)}<span>Confirmar assinatura</span></button>
        </div>
      </div>
    </div>
  </div>`;
}
function openSignature(title, callback){
  SIGNATURE_CALLBACK = callback;
  const overlay = document.getElementById("signatureOverlay");
  if (!overlay) return;
  const titleEl = document.getElementById("signatureTitle");
  if (titleEl) titleEl.textContent = title;
  overlay.style.display = "flex";
  requestAnimationFrame(() => {
    const canvas = document.getElementById("signatureCanvas");
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.round(rect.width));
    canvas.height = Math.max(1, Math.round(rect.height));
    sigCtx = canvas.getContext("2d");
    sigCtx.fillStyle = "#fdfdfd";
    sigCtx.fillRect(0, 0, canvas.width, canvas.height);
    sigCtx.strokeStyle = "#16233A";
    sigCtx.lineWidth = 2.2;
    sigCtx.lineCap = "round";
    sigCtx.lineJoin = "round";
    sigHasStroke = false;
    bindSignatureEvents(canvas);
  });
}
function bindSignatureEvents(canvas){
  const pos = (e) => {
    const rect = canvas.getBoundingClientRect();
    const point = e.touches && e.touches[0] ? e.touches[0] : e;
    return { x: point.clientX - rect.left, y: point.clientY - rect.top };
  };
  const start = (e) => { e.preventDefault(); sigDrawing = true; const p = pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); };
  const move = (e) => { if (!sigDrawing) return; e.preventDefault(); const p = pos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); sigHasStroke = true; };
  const end = () => { sigDrawing = false; };
  canvas.onmousedown = start; canvas.onmousemove = move; canvas.onmouseup = end; canvas.onmouseleave = end;
  canvas.ontouchstart = start; canvas.ontouchmove = move; canvas.ontouchend = end;
}
function limparAssinatura(){
  if (!sigCtx) return;
  const canvas = document.getElementById("signatureCanvas");
  sigCtx.fillStyle = "#fdfdfd";
  sigCtx.fillRect(0, 0, canvas.width, canvas.height);
  sigHasStroke = false;
}
function closeSignature(){
  const overlay = document.getElementById("signatureOverlay");
  if (overlay) overlay.style.display = "none";
  sigCtx = null;
  SIGNATURE_CALLBACK = null;
}
function confirmarAssinatura(){
  if (!sigHasStroke){ alert("Faça a assinatura na área indicada antes de confirmar."); return; }
  const canvas = document.getElementById("signatureCanvas");
  const dataUrl = canvas.toDataURL("image/png");
  const cb = SIGNATURE_CALLBACK;
  closeSignature();
  if (cb) cb(dataUrl);
}

function nav(view){
  if (view === "movimentacoes" && ROOM === "todas") view = "painel";
  VIEW = view; OPEN_FORM = null; render();
}
function setRoom(r){
  ROOM = r;
  OPEN_FORM = null;
  if (r === "todas" && VIEW === "movimentacoes") VIEW = "painel";
  render();
}
function closeForm(){ OPEN_FORM = null; renderMain(); }

function render(){ document.getElementById("app").innerHTML = shellHTML(); }
function renderMain(){
  const el = document.getElementById("mainContent");
  if (el) el.innerHTML = viewHTML();
  else render();
}

function shellHTML(){
  return `
  <div class="sc-shell">
    ${sidebarHTML()}
    <main class="sc-main" id="mainContent">${viewHTML()}</main>
  </div>
  ${scannerOverlayHTML()}
  ${signatureOverlayHTML()}`;
}

    <div class="sc-roomswitch">

    ${NAV_CADASTRO.map(item).join("")}
    <div class="sc-nav-groupLabel">Operação</div>
    ${NAV_OP.map(item).join("")}

    ${NAV_RELATORIOS.map(item).join("")}

      ${fileStatusHTML()}

  </nav>`;
}
function fileStatusHTML(){
  if (!HAS_FS_ACCESS){
    return `<div class="sc-filenote">Auto-save direto em arquivo requer Chrome ou Edge no computador. Os dados continuam salvos automaticamente neste navegador.</div>`;
  }
  if (DATA_FILE_HANDLE){
    return `
      <div class="sc-filenote is-ok">${icon("check",11)} Salvando automaticamente em arquivo</div>
      <button class="sc-filebtn" onclick="desconectarArquivoDados()">Desconectar arquivo</button>`;
  }
  if (PENDING_FILE_HANDLE){
    return `
      <div class="sc-filenote">Arquivo de dados encontrado desta sessão anterior.</div>
      <button class="sc-filebtn" onclick="reconectarArquivoDados()">Reconectar arquivo</button>`;
  }
  return `
    <div class="sc-filenote">Nenhum arquivo de dados conectado neste dispositivo.</div>
    <button class="sc-filebtn" onclick="criarNovoArquivoDados()">${icon("plus",11)} Criar arquivo de dados</button>

  return `<span class="sc-tag ${cls}">${escapeHtml(tipo.nome)}</span>`;

/* ================================ PAINEL ================================ */
function painelHTML(){
  const materiais = DB.materiais.filter(m => inRoom(m, ROOM));
  const movimentos = DB.movimentos.filter(m => inRoom(m, ROOM));
  const setores = DB.setores.filter(s => inRoom(s, ROOM));
  const tipoMapGeral = mapBy(DB.tipos);
  const abaixoMinimo = materiais.filter((m) => (m.estoqueAtual||0) <= (m.estoqueMinimo||0));
  const hoje = todayISO();
  const movHoje = movimentos.filter(m => m.data === hoje);
  const ultimos = movimentos.slice(0,8);
  const materialMap = mapBy(DB.materiais), setorMap = mapBy(DB.setores), tipoMap = mapBy(DB.tipos);

  const ordemUrgencia = { vencido:0, hoje:1, critico:2, atencao:3 };
  const alertasValidade = materiais
    .map(m => ({ m, c: piorValidadeMaterial(m.id) }))
    .filter(x => x.c && ordemUrgencia.hasOwnProperty(x.c.status))
    .sort((a,b) => ordemUrgencia[a.c.status]-ordemUrgencia[b.c.status]);

  const pendentesAssinatura = movimentos.filter(m => isEntregaIndividual(tipoMapGeral[m.tipoMovimentoId]) && !m.assinatura).length;

  const cards = `
  <div class="sc-cards">
    <button class="sc-stat" onclick="nav('materiais')"><div class="sc-stat-value">${materiais.length}</div><div class="sc-stat-label">Materiais nesta visão</div></button>
    <button class="sc-stat" onclick="nav('movimentacoes')"><div class="sc-stat-value">${movHoje.length}</div><div class="sc-stat-label">Movimentações hoje</div></button>
    <button class="sc-stat ${abaixoMinimo.length>0?"is-alert":""}" onclick="nav('estoques')"><div class="sc-stat-value">${abaixoMinimo.length}</div><div class="sc-stat-label">Abaixo do mínimo</div></button>
    <button class="sc-stat ${alertasValidade.length>0?"is-alert":""}" onclick="nav('estoques')"><div class="sc-stat-value">${alertasValidade.length}</div><div class="sc-stat-label">Alertas de validade</div></button>
    <button class="sc-stat ${pendentesAssinatura>0?"is-alert":""}" onclick="nav('individuais')"><div class="sc-stat-value">${pendentesAssinatura}</div><div class="sc-stat-label">Assinaturas pendentes</div></button>
  </div>`;

  let alertEstoqueSection = "";
  if (abaixoMinimo.length>0){
    alertEstoqueSection = sectionHTML("Alertas de estoque baixo","alert","", `
      <div class="sc-tablewrap"><table class="sc-table">
        <thead><tr><th>Material</th><th>Categoria</th><th class="num">Estoque</th><th class="num">Mínimo</th></tr></thead>
        <tbody>${abaixoMinimo.map(m=>`
          <tr><td>${escapeHtml(m.nome)}</td><td>${escapeHtml(m.categoria)}</td>
          <td class="num stamp-red mono">${fmtNum(m.estoqueAtual)} ${escapeHtml(m.unidade)}</td>
          <td class="num mono">${fmtNum(m.estoqueMinimo)} ${escapeHtml(m.unidade)}</td></tr>`).join("")}
        </tbody></table></div>`);
  }

  let alertValidadeSection = "";
  if (alertasValidade.length>0){
    alertValidadeSection = sectionHTML("Alertas de validade","alert","", `
      <div class="sc-tablewrap"><table class="sc-table">
        <thead><tr><th>Material</th><th>Categoria</th><th class="num">Estoque</th><th>Situação</th></tr></thead>
        <tbody>${alertasValidade.map(({m,c})=>`
          <tr><td>${escapeHtml(m.nome)}</td><td>${escapeHtml(m.categoria)}</td>
          <td class="num mono">${fmtNum(m.estoqueAtual)} ${escapeHtml(m.unidade)}</td>
          <td>${validadeBadgeFromClass(c)}</td></tr>`).join("")}
        </tbody></table></div>`);
  }

  const ultimosBody = ultimos.length===0 ? emptyHTML("Nenhuma movimentação registrada ainda nesta visão. Abra “Movimentações” para lançar a primeira entrada ou saída.") : `
    <div class="sc-tablewrap"><table class="sc-table">
      <thead><tr><th>Data</th><th>Material</th><th>Tipo</th><th>Setor</th><th class="num">Qtd.</th></tr></thead>
      <tbody>${ultimos.map(m=>`
        <tr><td class="mono">${fmtDate(m.data)}</td><td>${escapeHtml(materialMap[m.materialId]?.nome||"—")}</td>
        <td>${efeitoTagHTML(tipoMap[m.tipoMovimentoId])}</td><td>${escapeHtml(setorMap[m.setorId]?.nome||"—")}</td>
        <td class="num mono">${fmtNum(m.quantidade)}</td></tr>`).join("")}
      </tbody></table></div>`;

  return pageHTML("Painel", `Visão geral do dia<span class="sc-roomchip">${icon(roomIcon(ROOM),11)} ${roomLabel(ROOM)}</span>`, "", `
    ${cards}
    ${alertEstoqueSection}
    ${alertValidadeSection}
    ${sectionHTML("Últimas movimentações","clipboard","", ultimosBody)}
  `);
}

        <option value="todas">Somente "todas as salas"</option>

      </select>` : ""}
    </div>
    <div id="materialFormWrap">${formArea}</div>
    <div class="sc-tablewrap" id="materiaisTableWrap">${materiaisTableHTML(filterMateriaisList())}</div>

}
function filterMateriaisList(){
  const q = (document.getElementById("materiaisSearch")?.value || "").toLowerCase();
  const esc = document.getElementById("materiaisEscopoFiltro")?.value || "";
  return DB.materiais.filter(m => {
    if (!inRoom(m, ROOM)) return false;
    if (esc === "todas" && normalizeEscopo(m.escopo).length !== ROOMS.length) return false;
    if (esc && esc !== "todas" && !normalizeEscopo(m.escopo).includes(esc)) return false;
    return `${m.codigo} ${m.codigoBarras} ${m.nome} ${m.categoria}`.toLowerCase().includes(q);
  });
}
function renderMateriaisTable(){
  const wrap = document.getElementById("materiaisTableWrap");
  if (wrap) wrap.innerHTML = materiaisTableHTML(filterMateriaisList());
}

function openForm(type, editId){ OPEN_FORM = { type, editId: editId||null }; renderMain(); }
function saveMaterial(editId){
  const nome = document.getElementById("f_nome").value.trim();
  if (!nome){ alert("Informe o nome do material."); return; }
  const codigo = document.getElementById("f_codigo").value.trim();
  if (!codigo){ alert("Informe o código do material."); return; }
  const duplicadoCodigo = DB.materiais.find(m => m.codigo.trim().toLowerCase()===codigo.toLowerCase() && m.id!==editId);
  if (duplicadoCodigo){ alert(`Já existe um material com esse código: ${duplicadoCodigo.nome}.`); return; }
  const codigoBarras = document.getElementById("f_codigoBarras").value.trim();
  if (codigoBarras){
    const duplicadoBarras = DB.materiais.find(m => m.codigoBarras && m.codigoBarras===codigoBarras && m.id!==editId);
    if (duplicadoBarras){ alert(`Já existe um material com esse código de barras: ${duplicadoBarras.nome}.`); return; }
  }
  const escopo = readEscopoChecklist("f_escopo");
  if (escopo.length===0){ alert("Selecione ao menos uma sala em \"Visível em\"."); return; }
  const data = {
    codigo,
    codigoBarras,
    nome,
    categoria: document.getElementById("f_categoria").value,
    unidade: document.getElementById("f_unidade").value,
    estoqueMinimo: Number(document.getElementById("f_min").value)||0,
    ca: document.getElementById("f_ca").value.trim(),
    caValidade: document.getElementById("f_caValidade").value || "",
    escopo,
    observacao: document.getElementById("f_obs").value.trim(),
  };
  if (editId){
    DB.materiais = DB.materiais.map(m => m.id===editId ? { ...m, ...data } : m);
  } else {
    data.estoqueAtual = 0;
    DB.materiais.push({ id: uid(), ...data });
  }
  persist("materiais");
  OPEN_FORM = null;
  render();
}
function deleteMaterial(id){
  if (!confirm("Excluir este material do cadastro? O histórico de movimentações existente será mantido.")) return;
  DB.materiais = DB.materiais.filter(m=>m.id!==id);
  persist("materiais");
  render();
}
function gerarCodigoBarrasAuto(){
  let codigo = "";
  for (let i=0;i<12;i++) codigo += Math.floor(Math.random()*10);
  return codigo;
}
function gerarCodigoBarrasUnico(){
  let codigo;
  do { codigo = gerarCodigoBarrasAuto(); } while (DB.materiais.some(m=>m.codigoBarras===codigo));
  return codigo;
}
function gerarCodigoBarrasParaMaterial(){
  const el = document.getElementById("f_codigoBarras");
  if (el) el.value = gerarCodigoBarrasUnico();
}

  const html = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Etiqueta — ${escapeHtml(material.nome)}</title>

function saveCategoria(editId){
  const nome = document.getElementById("f_catnome").value.trim();
  if (!nome){ alert("Informe o nome da categoria."); return; }
  if (DB.categorias.some(c => c.nome.toLowerCase()===nome.toLowerCase() && c.id!==editId)){ alert("Já existe uma categoria com esse nome."); return; }
  const escopo = readEscopoChecklist("f_catescopo");
  if (escopo.length===0){ alert("Selecione ao menos uma sala em \"Visível em\"."); return; }
  if (editId){
    const antiga = DB.categorias.find(c=>c.id===editId);
    if (antiga && antiga.nome !== nome){
      DB.materiais = DB.materiais.map(m => m.categoria===antiga.nome ? {...m, categoria: nome} : m);
      persist("materiais");
    }
    DB.categorias = DB.categorias.map(c => c.id===editId ? {...c, nome, escopo} : c);
  } else {
    DB.categorias.push({ id: uid(), nome, escopo });
  }
  persist("categorias");
  OPEN_FORM = null;
  render();
}
function deleteCategoria(id){
  const c = DB.categorias.find(x=>x.id===id);
  const emUso = DB.materiais.filter(m=>m.categoria===c?.nome).length;
  if (emUso>0){ alert(`Não é possível excluir: ${emUso} material(is) usam esta categoria. Altere a categoria desses materiais antes de excluir.`); return; }
  if (!confirm("Excluir esta categoria?")) return;
  DB.categorias = DB.categorias.filter(x=>x.id!==id);
  persist("categorias");
  render();
}

  if (!validadeISO) return null;
  const hoje = new Date(todayISO()+"T00:00:00");
  const val = new Date(validadeISO+"T00:00:00");
  const diffDias = Math.round((val - hoje) / (1000*60*60*24));
  if (diffDias < 0) return { status:"vencido", label:`Vencido há ${Math.abs(diffDias)} dia(s)`, dias:diffDias };
  if (diffDias === 0) return { status:"hoje", label:"Vence hoje", dias:diffDias };
  if (diffDias <= LIMITE_CRITICO_DIAS) return { status:"critico", label:`Vence em ${diffDias} dia(s)`, dias:diffDias };
  if (diffDias <= LIMITE_ATENCAO_DIAS) return { status:"atencao", label:`Vence em ${diffDias} dia(s)`, dias:diffDias };
  return { status:"ok", label:`Vence em ${diffDias} dia(s)`, dias:diffDias };
}
function validadeBadgeFromClass(c){
  if (!c) return `<span class="sc-tag tag-semvalidade">Sem validade</span>`;
  const map = { vencido:"tag-vencido", hoje:"tag-hoje", critico:"tag-critico", atencao:"tag-atencao", ok:"tag-entrada" };
  return `<span class="sc-tag ${map[c.status]}">${c.label}</span>`;
}
function validadeBadgeHTML(validadeISO){
  return validadeBadgeFromClass(classificarValidade(validadeISO));
}
function piorValidadeMaterial(materialId){
  const ordem = { vencido:0, hoje:1, critico:2, atencao:3, ok:4 };
  let pior = null;
  getLotesEmEstoque(materialId).forEach(l => {
    if (!l.validade) return;
    const c = classificarValidade(l.validade);
    if (!pior || ordem[c.status] < ordem[pior.status]) pior = c;
  });
  return pior;
}
function getLotesEmEstoque(materialId){
  if (!materialId) return [];
  const tipoMap = mapBy(DB.tipos);
  const porLote = {};
  DB.movimentos
    .filter(m => m.materialId === materialId)
    .slice()
    .sort((a,b) => String(a.data||"").localeCompare(String(b.data||"")))
    .forEach(m => {
      const key = (m.lote||"").trim();
      const tipo = tipoMap[m.tipoMovimentoId];
      if (!porLote[key]) porLote[key] = { lote:key, saldo:0, validade:"", documento:"" };
      const entry = porLote[key];
      if (tipo?.efeito === "entrada"){
        entry.saldo = round3(entry.saldo + m.quantidade);
        if (m.validade) entry.validade = m.validade;
        if (m.documento) entry.documento = m.documento;
      } else if (tipo?.efeito === "saida"){
        entry.saldo = round3(entry.saldo - m.quantidade);
      }
    });
  return Object.values(porLote).filter(l => l.saldo > 0.0001).sort((a,b)=> (a.lote||"").localeCompare(b.lote||""));
}
/* ------------------------------- seleção de múltiplos lotes na saída ------------------------------- */
const MAX_LOTES_POR_LANCAMENTO = 5;
let MV_LOTES_SELECIONADOS = [];
let MV_CONTINUAR_DRAFT = null; // { tipoMovimentoId, setorId, colaboradorId } | null

function calcularAlocacaoLotes(selecoes, lotesDisponiveis, qtdAlvo){
  let restante = qtdAlvo;
  const alocacoes = [];
  for (const codigo of selecoes){
    const lote = lotesDisponiveis.find(l=>l.lote===codigo);
    if (!lote) continue;
    const usado = restante <= 0 ? 0 : round3(Math.min(lote.saldo, restante));
    alocacoes.push({ ...lote, usado });
    restante = round3(Math.max(0, restante - usado));
  }
  return { alocacoes, restante };
}
function lotesSaidaRowsHTML(materialId){
  const lotesDisponiveis = getLotesEmEstoque(materialId);
  MV_LOTES_SELECIONADOS = MV_LOTES_SELECIONADOS.filter(codigo => lotesDisponiveis.some(l=>l.lote===codigo));

  if (lotesDisponiveis.length === 0){
    return `<div class="sc-hint">Nenhum lote em estoque para este material — a saída será lançada sem vínculo a um lote específico.</div>`;
  }

  const qtdAlvo = Number(document.getElementById("mv_qtd")?.value) || 0;
  const { alocacoes, restante } = calcularAlocacaoLotes(MV_LOTES_SELECIONADOS, lotesDisponiveis, qtdAlvo);

  const linhas = MV_LOTES_SELECIONADOS.map((codigo, i) => {
    const info = alocacoes[i];
    const jaEscolhidosAntes = MV_LOTES_SELECIONADOS.slice(0, i);
    const opcoes = lotesDisponiveis.filter(l => l.lote===codigo || !jaEscolhidosAntes.includes(l.lote));
    const optionsHTML = `<option value="">Selecione…</option>` + opcoes.map(l=>`<option value="${escapeHtml(l.lote)}" ${l.lote===codigo?"selected":""}>${l.lote?escapeHtml(l.lote):"(sem lote)"} — saldo ${fmtNum(l.saldo)}${l.validade?` — val. ${fmtDate(l.validade)}`:""}</option>`).join("");
    return `<div class="sc-lotrow">
      <select class="sc-input" onchange="onMovLoteRowChange(${i}, this.value)">${optionsHTML}</select>
      <span class="sc-hint">${info ? `Usando ${fmtNum(info.usado)}${info.validade?` · val. ${fmtDate(info.validade)}`:""}` : ""}</span>
    </div>`;
  });

  const restamLotes = lotesDisponiveis.some(l => !MV_LOTES_SELECIONADOS.includes(l.lote));
  if (restante > 0 && MV_LOTES_SELECIONADOS.length < MAX_LOTES_POR_LANCAMENTO && restamLotes){
    const opcoes = lotesDisponiveis.filter(l => !MV_LOTES_SELECIONADOS.includes(l.lote));
    const optionsHTML = `<option value="">Selecione o próximo lote…</option>` + opcoes.map(l=>`<option value="${escapeHtml(l.lote)}">${l.lote?escapeHtml(l.lote):"(sem lote)"} — saldo ${fmtNum(l.saldo)}${l.validade?` — val. ${fmtDate(l.validade)}`:""}</option>`).join("");
    linhas.push(`<div class="sc-lotrow">
      <select class="sc-input" onchange="onMovLoteRowChange(${MV_LOTES_SELECIONADOS.length}, this.value)">${optionsHTML}</select>
    </div>`);
  }

  const aviso = (restante > 0 && MV_LOTES_SELECIONADOS.length >= MAX_LOTES_POR_LANCAMENTO)
    ? `<div class="sc-error">${icon("alert",14)} Os lotes selecionados somam ${fmtNum(round3(qtdAlvo-restante))}; faltam ${fmtNum(restante)} para completar a quantidade informada (máximo de ${MAX_LOTES_POR_LANCAMENTO} lotes por lançamento).</div>`
    : "";

  return `<div style="display:flex; flex-direction:column; gap:8px;">${linhas.join("")}</div>${aviso}`;
}
function onMovLoteRowChange(index, value){
  MV_LOTES_SELECIONADOS = MV_LOTES_SELECIONADOS.slice(0, index);
  if (value) MV_LOTES_SELECIONADOS.push(value);
  refreshLoteFields();
}

function submitMovimento(continuar){
  const materialId = document.getElementById("mv_material").value;
  const tipoMovimentoId = document.getElementById("mv_tipo").value;
  const setorId = document.getElementById("mv_setor")?.value || "";
  const errWrap = document.getElementById("mv_errorWrap");
  errWrap.innerHTML = "";
  if (!materialId || !tipoMovimentoId || !setorId){
    errWrap.innerHTML = `<div class="sc-error">${icon("alert",14)} Selecione material, tipo de movimento e setor.</div>`;
    return;
  }
  const qtd = Number(document.getElementById("mv_qtd").value);
  if (!qtd || qtd<=0){
    errWrap.innerHTML = `<div class="sc-error">${icon("alert",14)} Informe uma quantidade maior que zero.</div>`;
    return;
  }
  const tipo = DB.tipos.find(t=>t.id===tipoMovimentoId);
  const material = DB.materiais.find(m=>m.id===materialId);
  if (tipo?.efeito==="saida" && material && qtd > (material.estoqueAtual||0)){
    errWrap.innerHTML = `<div class="sc-error">${icon("alert",14)} Estoque insuficiente. Disponível: ${fmtNum(material.estoqueAtual)} ${escapeHtml(material.unidade)}.</div>`;
    return;
  }

  const colaboradorId = document.getElementById("mv_colaborador").value;
  if (isEntregaIndividual(tipo) && !colaboradorId){
    errWrap.innerHTML = `<div class="sc-error">${icon("alert",14)} Selecione o colaborador para a Entrega Individual.</div>`;
    return;
  }

  const escopoMov = ROOM==="todas" ? [...ALL_ROOM_IDS] : [ROOM];
  const dataMov = document.getElementById("mv_data").value || todayISO();
  const documento = document.getElementById("mv_doc").value.trim();
  const observacao = document.getElementById("mv_obs").value.trim();

  const baseRegistro = {
    data: dataMov, materialId, tipoMovimentoId, setorId, documento, observacao,
    escopo: escopoMov, colaboradorId: colaboradorId || "",
    assinatura: null, assinadoEm: null, criadoEm: new Date().toISOString(),
  };

  let novosRegistros = [];

  if (tipo?.efeito === "saida"){
    const lotesDisponiveis = getLotesEmEstoque(materialId);
    if (lotesDisponiveis.length === 0){
      // material sem lotes rastreados — mantém comportamento simples (sem vínculo a lote)
      novosRegistros = [{ id: uid(), ...baseRegistro, quantidade: qtd, delta: -qtd, lote: "", validade: "" }];
    } else if (ROOM === "epis"){
      // EPIs: sem seleção manual — aloca automaticamente entre os lotes (CA) disponíveis
      const codigosLotes = lotesDisponiveis.map(l=>l.lote);
      const { alocacoes, restante } = calcularAlocacaoLotes(codigosLotes, lotesDisponiveis, qtd);
      if (restante > 0.0001){
        errWrap.innerHTML = `<div class="sc-error">${icon("alert",14)} O saldo disponível entre os CAs cadastrados não cobre a quantidade informada. Faltam ${fmtNum(restante)}.</div>`;
        return;
      }
      novosRegistros = alocacoes.filter(a=>a.usado>0).map(a => ({
        id: uid(), ...baseRegistro,
        quantidade: a.usado, delta: -a.usado,
        lote: a.lote, validade: a.validade || "",
      }));
    } else {
      if (MV_LOTES_SELECIONADOS.length === 0){
        errWrap.innerHTML = `<div class="sc-error">${icon("alert",14)} Selecione ao menos um lote para esta saída.</div>`;
        return;
      }
      const { alocacoes, restante } = calcularAlocacaoLotes(MV_LOTES_SELECIONADOS, lotesDisponiveis, qtd);
      if (restante > 0.0001){
        errWrap.innerHTML = `<div class="sc-error">${icon("alert",14)} Os lotes selecionados somam ${fmtNum(round3(qtd-restante))}; faltam ${fmtNum(restante)} para completar a quantidade informada. Selecione mais lotes.</div>`;
        return;
      }
      novosRegistros = alocacoes.filter(a=>a.usado>0).map(a => ({
        id: uid(), ...baseRegistro,
        quantidade: a.usado, delta: -a.usado,
        lote: a.lote, validade: a.validade || "",
      }));
    }
  } else if (ROOM === "epis"){
    // EPIs: lote é o CA do material (ou "Sem CA"); validade vem do CA, exceto quando "Sem CA"
    const temCa = !!(material && material.ca);
    if (!temCa){
      const validadeManual = document.getElementById("mv_validade")?.value || "";
      if (!validadeManual){
        errWrap.innerHTML = `<div class="sc-error">${icon("alert",14)} Este material está "Sem CA" — informe a validade manualmente.</div>`;
        return;
      }
      novosRegistros = [{ id: uid(), ...baseRegistro, quantidade: qtd, delta: qtd, lote: "Sem CA", validade: validadeManual }];
    } else {
      novosRegistros = [{ id: uid(), ...baseRegistro, quantidade: qtd, delta: qtd, lote: material.ca, validade: material.caValidade || "" }];
    }
  } else {
    // entrada: lote/validade manuais, um único lançamento
    novosRegistros = [{
      id: uid(), ...baseRegistro, quantidade: qtd, delta: qtd,
      lote: document.getElementById("mv_lote")?.value.trim() || "",
      validade: document.getElementById("mv_validade")?.value || "",
    }];
  }

  DB.movimentos = [...novosRegistros, ...DB.movimentos];
  const somaDelta = novosRegistros.reduce((acc,r)=>acc+r.delta, 0);
  if (somaDelta !== 0){
    DB.materiais = DB.materiais.map(m => m.id===materialId ? {...m, estoqueAtual: round3((m.estoqueAtual||0)+somaDelta)} : m);
    persist("materiais");
  }
  persist("movimentos");

  MV_LOTES_SELECIONADOS = [];
  if (continuar){
    MV_CONTINUAR_DRAFT = { tipoMovimentoId, setorId, colaboradorId: colaboradorId || "" };
  } else {
    MV_CONTINUAR_DRAFT = null;
  }
  render();
}
function deleteMovimento(id){
  if (!confirm("Excluir esta movimentação? O estoque será recalculado.")) return;
  const mov = DB.movimentos.find(m=>m.id===id);
  if (mov && mov.delta){
    DB.materiais = DB.materiais.map(m => m.id===mov.materialId ? {...m, estoqueAtual: round3((m.estoqueAtual||0)-mov.delta)} : m);
    persist("materiais");
  }
  DB.movimentos = DB.movimentos.filter(m=>m.id!==id);
  persist("movimentos");
  render();
}

function downloadExcel(rows, sheetName, filename){
  if (typeof XLSX === "undefined"){
    alert("Não foi possível carregar o gerador de planilhas Excel. Verifique sua conexão com a internet e tente novamente.");
    return;
  }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, filename);
}
function estoquesHTML(){
  const materiaisNaSala = DB.materiais.filter(m => inRoom(m, ROOM));
  const abaixoMinimo = materiaisNaSala.filter(m => (m.estoqueAtual||0) <= (m.estoqueMinimo||0));
  const statusValidadePorMaterial = materiaisNaSala.map(m => piorValidadeMaterial(m.id)).filter(Boolean);
  const contarStatus = (status) => statusValidadePorMaterial.filter(c=>c.status===status).length;
  const qtdVencidos = contarStatus("vencido");
  const qtdHoje = contarStatus("hoje");
  const qtdCriticos = contarStatus("critico");
  const qtdAtencao = contarStatus("atencao");

  const estoqueSection = sectionHTML("Estoque atual","boxes",
    `<button class="sc-btn sc-btn-ghost" onclick="exportEstoqueExcel()">${icon("download",14)}<span>Exportar Excel</span></button>`, `
    ${abaixoMinimo.length>0 ? `<div class="sc-hint sc-hint-alert">${icon("alert",14)} ${abaixoMinimo.length} material(is) abaixo do estoque mínimo.</div>` : ""}
    ${(qtdVencidos+qtdHoje+qtdCriticos+qtdAtencao)>0 ? `
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
      ${qtdVencidos>0?`<span class="sc-tag tag-vencido">${qtdVencidos} vencido(s)</span>`:""}
      ${qtdHoje>0?`<span class="sc-tag tag-hoje">${qtdHoje} vencendo hoje</span>`:""}
      ${qtdCriticos>0?`<span class="sc-tag tag-critico">${qtdCriticos} com menos de ${LIMITE_CRITICO_DIAS} dias</span>`:""}
      ${qtdAtencao>0?`<span class="sc-tag tag-atencao">${qtdAtencao} com menos de ${LIMITE_ATENCAO_DIAS} dias</span>`:""}
    </div>` : ""}
    <div class="sc-tablewrap" id="estoqueTableWrap">${estoqueTableHTML(materiaisNaSala)}</div>
  `);

  return pageHTML("Estoques", `Quantidades atuais, lotes e validade<span class="sc-roomchip">${icon(roomIcon(ROOM),11)} ${roomLabel(ROOM)}</span>`, "", estoqueSection);
}

function estoqueTableHTML(materiais){
  if (materiais.length===0) return emptyHTML("Nenhum material nesta visão.");
  const mostrarColunaVisibilidade = ROOM === "todas";
  const totalColunas = 8 + (mostrarColunaVisibilidade?1:0);
  return `<table class="sc-table">
    <thead><tr><th></th><th>Código</th><th>Material</th><th>Categoria</th><th class="num">Estoque</th><th class="num">Mínimo</th><th>Situação</th><th>Validade</th>${mostrarColunaVisibilidade?"<th>Visibilidade</th>":""}</tr></thead>
    <tbody>${materiais.map(m=>{
      const baixo = (m.estoqueAtual||0) <= (m.estoqueMinimo||0);
      const expandido = ESTOQUE_EXPANDIDO.has(m.id);
      const piorValidade = piorValidadeMaterial(m.id);
      const linha = `<tr class="sc-rowclick" onclick="toggleEstoqueDetalhe('${m.id}')">
        <td class="sc-expandcell">${icon(expandido?"chevronDown":"chevronRight",13)}</td>
        <td class="mono">${escapeHtml(m.codigo||"—")}</td><td>${escapeHtml(m.nome)}</td><td>${escapeHtml(m.categoria)}</td>
        <td class="num mono">${fmtNum(m.estoqueAtual)} ${escapeHtml(m.unidade)}</td><td class="num mono">${fmtNum(m.estoqueMinimo)}</td>
        <td><span class="sc-tag ${baixo?"tag-saida":"tag-entrada"}">${baixo?"Abaixo do mínimo":"Normal"}</span></td>
        <td>${piorValidade ? validadeBadgeFromClass(piorValidade) : `<span class="sc-tag tag-semvalidade">—</span>`}</td>
        ${mostrarColunaVisibilidade?`<td>${escopoBadgesHTML(m.escopo)}</td>`:""}</tr>`;
      const detalhe = expandido ? `<tr class="sc-rowdetail"><td colspan="${totalColunas}">${loteDetalheHTML(m)}</td></tr>` : "";
      return linha + detalhe;
    }).join("")}</tbody></table>`;
}
function loteDetalheHTML(material){
  const lotes = getLotesEmEstoque(material.id);
  if (lotes.length===0){
    return `<div class="sc-hint" style="padding:8px 4px;">Nenhum lote com saldo rastreado para este material — o estoque atual pode ter sido definido diretamente no cadastro, sem passar por uma entrada com lote.</div>`;
  }
  return `<table class="sc-table sc-subtable">
    <thead><tr><th>Lote</th><th class="num">Saldo</th><th>Validade</th><th>Situação</th><th>Documento</th></tr></thead>
    <tbody>${lotes.map(l=>`
      <tr><td class="mono">${l.lote?escapeHtml(l.lote):"(sem lote)"}</td>
      <td class="num mono">${fmtNum(l.saldo)} ${escapeHtml(material.unidade)}</td>
      <td class="mono">${l.validade?fmtDate(l.validade):"—"}</td>
      <td>${validadeBadgeHTML(l.validade)}</td>
      <td class="mono">${escapeHtml(l.documento||"—")}</td></tr>`).join("")}</tbody></table>`;
}
function toggleEstoqueDetalhe(materialId){
  if (ESTOQUE_EXPANDIDO.has(materialId)) ESTOQUE_EXPANDIDO.delete(materialId);
  else ESTOQUE_EXPANDIDO.add(materialId);
  renderEstoqueTable();
}
function renderEstoqueTable(){
  const wrap = document.getElementById("estoqueTableWrap");
  if (!wrap) return;
  const materiaisNaSala = DB.materiais.filter(m => inRoom(m, ROOM));
  wrap.innerHTML = estoqueTableHTML(materiaisNaSala);
}
function filterMovs(){
  const de = document.getElementById("rf_de")?.value || "";
  const ate = document.getElementById("rf_ate")?.value || "";
  const materialId = document.getElementById("rf_material")?.value || "";
  const setorId = document.getElementById("rf_setor")?.value || "";
  return DB.movimentos.filter(m=>{
    if (!inRoom(m, ROOM)) return false;
    if (de && m.data < de) return false;
    if (ate && m.data > ate) return false;
    if (materialId && m.materialId !== materialId) return false;
    if (setorId && m.setorId !== setorId) return false;
    return true;
  });
}

      <label class="sc-field"><span>Até</span><input class="sc-input" type="date" id="cf_ate" onchange="renderConsumoTable()"></label>
      <div class="sc-field is-wide">
        <span>Materiais</span>

          <button type="button" class="sc-btn sc-btn-ghost" onclick="selecionarTodosConsumo()">Selecionar todos</button>
          <button type="button" class="sc-btn sc-btn-ghost" onclick="limparSelecaoConsumo()">Limpar seleção</button>
        </div>
        ${listaMateriaisHTML}
      </div>
    </div>
    <div class="sc-tablewrap" id="consumoTableWrap" style="margin-top:12px;">${consumoTableHTML()}</div>
    <div class="sc-formfoot" style="padding:14px 0 0;">
      <button class="sc-btn sc-btn-ghost" onclick="exportConsumoExcel()">${icon("download",14)}<span>Exportar Excel</span></button>
    </div>
  `);

  let painelRegulatorio = "";
  if (ROOM === "controlados"){
    painelRegulatorio = sectionHTML("Relatório para Órgãos Reguladores","clipboard","", `
      <div class="sc-hint">
        Gera uma planilha com entradas, saídas e saldo por material no período selecionado acima, como ponto de partida para a prestação de contas de produtos químicos controlados (ex.: Polícia Federal / SIPROQUIM).
      </div>

        <button class="sc-btn sc-btn-primary" onclick="exportRelatorioRegulatorioExcel()">${icon("download",14)}<span>Gerar relatório para Órgãos Reguladores</span></button>
      </div>

  return pageHTML("Consumo", `Consumo por material e análises<span class="sc-roomchip">${icon(roomIcon(ROOM),11)} ${roomLabel(ROOM)}</span>`, "",

function onConsumoMaterialToggle(materialId, checked){
  if (checked) CONSUMO_MATERIAIS_SELECIONADOS.add(materialId);
  else CONSUMO_MATERIAIS_SELECIONADOS.delete(materialId);
  renderConsumoTable();
}
function selecionarTodosConsumo(){
  const materiaisNaSala = DB.materiais.filter(m => inRoom(m, ROOM));
  materiaisNaSala.forEach(m => CONSUMO_MATERIAIS_SELECIONADOS.add(m.id));
  renderMain();
}
function limparSelecaoConsumo(){
  CONSUMO_MATERIAIS_SELECIONADOS.clear();
  renderMain();
}
function calcularConsumo(){
  const de = document.getElementById("cf_de")?.value || "";
  const ate = document.getElementById("cf_ate")?.value || "";
  const tipoMap = mapBy(DB.tipos);
  const materiaisAlvo = DB.materiais.filter(m => inRoom(m, ROOM) && CONSUMO_MATERIAIS_SELECIONADOS.has(m.id));
  return materiaisAlvo.map(m => {
    const movs = DB.movimentos.filter(mv => {
      if (mv.materialId !== m.id) return false;
      if (!inRoom(mv, ROOM)) return false;
      if (de && mv.data < de) return false;
      if (ate && mv.data > ate) return false;
      return tipoMap[mv.tipoMovimentoId]?.efeito === "saida";
    });
    const totalConsumido = round3(movs.reduce((acc,mv)=>acc+mv.quantidade, 0));
    return { material: m, totalConsumido, numMovimentos: movs.length };
  }).sort((a,b)=> b.totalConsumido - a.totalConsumido);
}
function consumoTableHTML(){
  if (CONSUMO_MATERIAIS_SELECIONADOS.size===0){
    return emptyHTML("Selecione um ou mais materiais acima para ver o consumo no período.");
  }
  const linhas = calcularConsumo();
  if (linhas.length===0) return emptyHTML("Nenhum material selecionado nesta visão.");
  return `<table class="sc-table">
    <thead><tr><th>Material</th><th>Categoria</th><th class="num">Consumido no período</th><th class="num">Nº movimentações</th></tr></thead>
    <tbody>${linhas.map(l=>`
      <tr><td>${escapeHtml(l.material.nome)}</td><td>${escapeHtml(l.material.categoria)}</td>
      <td class="num mono">${fmtNum(l.totalConsumido)} ${escapeHtml(l.material.unidade)}</td>
      <td class="num mono">${l.numMovimentos}</td></tr>`).join("")}</tbody></table>`;
}
function renderConsumoTable(){
  const wrap = document.getElementById("consumoTableWrap");
  if (wrap) wrap.innerHTML = consumoTableHTML();
}
function exportConsumoExcel(){
  const linhas = calcularConsumo();
  const rows = linhas.map(l => ({
    "Material": l.material.nome,
    "Código": l.material.codigo || "",
    "Categoria": l.material.categoria,
    "Consumido no Período": l.totalConsumido,
    "Unidade": l.material.unidade,
    "Nº de Movimentações": l.numMovimentos,
  }));
  downloadExcel(rows, "Consumo por Material", `consumo_por_material_${todayISO()}.xlsx`);
}
function exportRelatorioRegulatorioExcel(){
  const de = document.getElementById("cf_de")?.value || "";
  const ate = document.getElementById("cf_ate")?.value || "";
  const tipoMap = mapBy(DB.tipos);
  const materiaisNaSala = DB.materiais.filter(m => inRoom(m, ROOM));
  const rows = materiaisNaSala.map(m => {
    const movsPeriodo = DB.movimentos.filter(mv => {
      if (mv.materialId !== m.id || !inRoom(mv, ROOM)) return false;
      if (de && mv.data < de) return false;
      if (ate && mv.data > ate) return false;
      return true;
    });
    const totalEntradas = round3(movsPeriodo.filter(mv=>tipoMap[mv.tipoMovimentoId]?.efeito==="entrada").reduce((a,mv)=>a+mv.quantidade,0));
    const totalSaidas = round3(movsPeriodo.filter(mv=>tipoMap[mv.tipoMovimentoId]?.efeito==="saida").reduce((a,mv)=>a+mv.quantidade,0));
    const estoqueFinal = m.estoqueAtual || 0;
    const estoqueInicial = round3(estoqueFinal - totalEntradas + totalSaidas);
    return {
      "Código": m.codigo || "",
      "Material": m.nome,
      "Categoria": m.categoria,
      "Unidade": m.unidade,
      "Estoque Inicial (estimado)": estoqueInicial,
      "Total Entradas no Período": totalEntradas,
      "Total Saídas no Período": totalSaidas,
      "Estoque Final": estoqueFinal,
      "Período": `${de?fmtDate(de):"—"} a ${ate?fmtDate(ate):"—"}`,
    };
  });
  downloadExcel(rows, "Relatório Regulatório", `relatorio_orgaos_reguladores_${todayISO()}.xlsx`);
}
